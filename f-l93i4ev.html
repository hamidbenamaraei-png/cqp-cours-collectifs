<style>
:root{--bg:#10162b;--card:#1c2442;--line:#2c365c;--txt:#fff;--soft:#c9cfe6;--mute:#8a92b2;--or:#ff7a3d;--ok:#4cc38a;--ko:#ff5d6c;--bl:#4c8dff;--ja:#f5c451}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.tag{color:var(--or);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:26px;margin:4px 0 18px;line-height:1.2}
h2{font-size:20px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 16px;border-top:5px solid var(--bl)}
.card.o{border-top-color:var(--or)}.card.g{border-top-color:var(--ok)}.card.r{border-top-color:var(--ko)}.card.j{border-top-color:var(--ja)}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:17px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--or);color:#10162b;font-weight:800;font-size:18px;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
.btn.sec{background:#2a3566;color:#fff}
.btn.wa{background:#25d366;color:#0b2416}
.btn.ko{background:#3a1c25;color:var(--ko)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;cursor:pointer;padding:6px 0;font-family:inherit;text-align:left}
.back{background:none;border:0;color:var(--soft);font-size:16px;cursor:pointer;padding:8px 0;font-family:inherit}
.muted{color:var(--mute);font-size:15px}
.err{color:var(--ko);font-weight:700;margin-top:10px}
.ok{color:var(--ok);font-weight:700;margin-top:10px}
.hide{display:none!important}
.big{font-size:40px;font-weight:800;line-height:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;min-width:52px;text-align:center;padding:3px 10px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap}
.p-ok{background:#173528;color:var(--ok)}.p-moy{background:#3a321a;color:var(--ja)}.p-ko{background:#3a1c25;color:var(--ko)}
.stag{background:#141b33;border-radius:12px;padding:12px 14px;margin:10px 0}
.stag b{font-size:17px}
.stag .d{margin-top:6px;color:var(--soft);font-size:15px}

.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--soft)}
.check input{width:22px;height:22px}
#resume{min-height:260px;font-size:15px}
.slide{width:100%;border-radius:12px;display:block;margin:0 0 12px;border:1px solid var(--line)}
.scale{display:flex;gap:8px;margin-top:4px}
.scale button{flex:1;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.scale button.on{background:var(--or);border-color:var(--or);color:#10162b}
.q{margin:16px 0 6px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
.opt.on{border-color:var(--or);background:#2a2230}
.opt.good{border-color:var(--ok);background:#173528}
.expl{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:#141b33;font-size:15px;color:var(--soft)}
.statut{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.ligne{display:flex;gap:8px;align-items:center;margin:8px 0}
.ligne input{flex:1}
.x{flex:none;width:44px;height:48px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:var(--ko);font-size:20px;cursor:pointer}
.bonne{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:var(--mute);font-size:20px;cursor:pointer}
.bonne.on{background:var(--ok);border-color:var(--ok);color:#0b2416}
.qed{background:#141b33;border-radius:14px;padding:14px;margin:14px 0;border-left:4px solid var(--or)}
.qed textarea,.qed input{background:#1c2442}
.verrou{flex:none;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#141b33;color:var(--soft);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.verrou.on{background:#3a321a;border-color:var(--ja);color:var(--ja)}
.apq{background:#141b33;border-radius:14px;padding:14px;margin:12px 0;border-left:4px solid var(--bl)}
.apq.lock{border-left-color:var(--ja)}
.apq .bon{color:var(--ok);font-weight:700}
.apq .th{font-size:13px;color:var(--mute);margin-top:6px}
.choix{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Barre de dictée, collée en bas sur tous les écrans */
#barre-dictee{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--ko);color:#fff;box-shadow:0 -4px 14px rgba(0,0,0,.4)}
#barre-dictee.coupe{background:#3a321a;color:var(--ja)}
#barre-dictee button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;background:#fff;color:#10162b}
#barre-dictee button.sec{flex:none;background:#2a3566;color:#fff}

body.avec-barre .wrap{padding-bottom:120px}
/* La roue */
.rchip{padding:9px 13px;border-radius:999px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.rchip.on{background:var(--or);border-color:var(--or);color:#10162b}
.rchip.mi{border-color:var(--or)}
.rchip small{font-weight:600;opacity:.8}
.de{background:none;border:0;font-size:inherit;cursor:pointer;padding:0;display:inline-block;line-height:1}
.de.roule{animation:deroule .6s ease-out}
@keyframes deroule{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
/* Mode projection */

#proj .pj-g{flex:none;display:flex;flex-direction:column;align-items:center}
#proj .pj-w{width:min(84vh,56vw);max-width:none}
#proj .pj-t{font-size:clamp(22px,2.6vw,52px);font-weight:800;margin-bottom:1vh;text-align:center}
#proj .pj-d{flex:1;max-width:40vw;max-height:94vh;display:flex;flex-direction:column;gap:1.4vh;overflow:auto;padding:4px 2px}
#proj .pj-sel{font-size:clamp(16px,1.4vw,28px);padding:12px 14px;background:#141b33}
#proj .pj-res{font-size:clamp(26px,2.7vw,60px);font-weight:800;line-height:1.12;min-height:2em}
#proj .pj-res small{display:block;font-size:.38em;color:var(--mute);letter-spacing:2px;text-transform:uppercase;margin-top:.4em}
#proj .pj-qui{font-size:.55em;color:var(--or)}
#proj .pj-ph{font-size:.45em;color:var(--ja);margin-top:.6em;line-height:1.3}
#proj .pj-mute{font-size:.5em;color:var(--mute);font-weight:600}
#proj .pj-go{padding:2.2vh 2vw;border:0;border-radius:18px;background:var(--or);color:#10162b;font-weight:800;font-size:clamp(24px,2.6vw,56px);cursor:pointer;font-family:inherit}
#proj .pj-go:disabled{opacity:.5}
#proj .pj-b{padding:1.4vh 1.4vw;border:0;border-radius:14px;background:#2a3566;color:#fff;font-weight:800;font-size:clamp(18px,1.6vw,34px);cursor:pointer;font-family:inherit}
#proj .pj-b2{padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:none;color:var(--soft);font-weight:700;font-size:clamp(14px,1vw,20px);cursor:pointer;font-family:inherit}
#proj .pj-o{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:clamp(14px,1.1vw,22px);color:var(--soft)}
#proj .pj-o input{width:22px;height:22px;vertical-align:middle}
#proj .pj-h{font-size:clamp(14px,1.1vw,22px);color:var(--mute);line-height:1.5;max-height:14vh;overflow:auto}
#proj .pj-disc{position:fixed;left:6px;bottom:4px;width:28px;height:28px;border:0;background:none;color:#1c2442;font-size:22px;cursor:pointer;padding:0}
#proj .pj-disc.arme{color:#283258}
#proj .pj-menu{position:fixed;left:8px;bottom:36px;display:flex;flex-direction:column;gap:4px;z-index:3}
#proj .pj-menu select{width:auto;font-size:12px;padding:3px 6px;border-radius:6px;background:#0b1022;color:#8a92b2;border:1px solid #1c2442}
#proj .pj-fiche{position:fixed;inset:4vh 6vw;background:#10162b;border:3px solid var(--ok);border-radius:24px;padding:3vh 3vw;overflow:auto;z-index:4;font-size:clamp(18px,1.7vw,34px)}
#proj .pj-fiche .fiche{font-size:inherit;border-left-width:8px}
#proj .pj-fiche .fiche h3{font-size:1.6em}
#proj .pj-fiche .fiche .fl{font-size:1em}
#proj .pj-fiche .fiche .fl b,#proj .pj-fiche .fiche .fc{font-size:.6em}
@media (max-aspect-ratio:1/1){#proj{flex-direction:column;justify-content:flex-start}#proj .pj-w{width:min(92vw,58vh)}#proj .pj-d{max-width:none;width:100%}}
/* Feuille papier */
.feuille{background:#fff;color:#111;border-radius:6px;padding:26px 24px;font-size:15px;line-height:1.4}
.feuille h3{margin:0 0 4px;font-size:19px}
.feuille .sub{color:#444;margin:0 0 14px}
.feuille .champ{display:flex;gap:10px;margin:8px 0}
.feuille .champ span{flex:none;font-weight:700}
.feuille .champ i{flex:1;border-bottom:1.5px solid #333}
.feuille .bloc{border:1.5px solid #333;border-radius:8px;padding:10px 12px;margin:14px 0}
.feuille .bloc h4{margin:0 0 6px;font-size:16px}
.feuille .rs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #ccc}
.feuille .rs:last-child{border-bottom:0}
.feuille .ronds{flex:none;white-space:nowrap;letter-spacing:6px;font-size:17px}
.feuille .qq{margin:10px 0 4px;font-weight:700}
.feuille .oo{margin:3px 0 3px 8px}
.feuille .ex{margin:4px 0 0 8px;font-style:italic;color:#333}
.feuille .zone{height:70px}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .feuille{border-radius:0;padding:0}
  .feuille .bloc{break-inside:avoid}
}
.rs-plein{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;overflow:auto;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 6vw;background:#0b1022}
.rs-plein .roue-boite{max-width:min(60vh,800px)}
.rs-plein .roue-res{font-size:44px}
.rs-plein input{font-size:26px}
.rs-plein .btn{font-size:26px}
</style>

<body>
<div class="wrap" id="app"></div>
<script src="commun.js?v=202610260300"></script>
<script src="roue.js?v=202610260300"></script>
<script src="fiches.js?v=202610260300"></script>
<script>
// ======= Réglages propres au formateur =======
// Empreinte du code d'accès (le code lui-même n'est pas écrit ici)
const CODE_HASH = '9de007567a93e86a677452886d8b9326ecf5a0726172be9c57b017546bb21146';
// Lien du groupe WhatsApp des formateurs : vide = WhatsApp demande à qui envoyer
const WHATSAPP_GROUPE = '';
// Tableau des réponses des stagiaires (publié en CSV). Il n'est lu QUE sur cette page :
// les stagiaires n'y ont pas accès (il contient les réponses de tout le monde et tes observations).
const CSV_REPONSES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0Q6CmVaNRB_wzqusRfYaLQjon3iYJ9qjfPRGaimeo687QAkNxIeem81Mf_HeHGIdTqe3AsVerGOnx/pub?gid=1231707561&single=true&output=csv';
const DUREES_CHRONO = [3,5,7,10];

// ======= Outils =======
function lire(k,d){try{const v=localStorage.getItem('cqpf_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function ecrire(k,v){try{localStorage.setItem('cqpf_'+k,JSON.stringify(v))}catch(e){}}
const app = document.getElementById('app');
function haut(){window.scrollTo(0,0)}
async function empreinte(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cqp-cc:'+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function classe(v,max){const p=max?v/max:0;return p>=0.8?'p-ok':p>=0.6?'p-moy':'p-ko'}
function ouvrirWhatsApp(txt,groupe){
  const url=(groupe&&WHATSAPP_GROUPE)?WHATSAPP_GROUPE:('https://wa.me/?text='+encodeURIComponent(txt));
  window.location.href=url;
}
async function copier(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){return false}}
const copie = x => JSON.parse(JSON.stringify(x));
// Les lignes « __obs__ » du tableau des réponses sont tes observations, jamais un stagiaire
function estObs(l){return (l[1]||'').trim()==='__obs__'}
// Les lignes « __roue__ » gardent tes 🎯 de la roue (jamais un stagiaire non plus)
function estRoue(l){return (l[1]||'').trim()==='__roue__'}

// ======= Le tableau des réponses (les observations sont mises à part) =======
let lignes=[], OBS=[];
async function chargerReponses(){
  const L=await lireCSV(CSV_REPONSES);
  lignes=L.length?[L[0]].concat(L.slice(1).filter(l=>!estObs(l)&&!estRoue(l))):[];
  OBS=L.slice(1).filter(estObs);
  MARQUES_EN_LIGNE=L.slice(1).filter(estRoue);
  return lignes;
}

// ======= État des quiz (tableau Google + ce que tu viens de faire sur ce téléphone) =======
// Le tableau Google met quelques minutes à se mettre à jour : pendant 15 min, ce téléphone
// se fie à ce que tu viens d'enregistrer.
let ETAT = null, STAG = {}, REVS = {};
async function chargerEtat(){
  let g=null;
  try{g=await etatGeneral()}catch(e){g=null}
  if(g){ETAT=g.quiz;STAG=g.stagiaires;REVS=g.revisions||{}}
  else{ETAT={};STAG={};REVS={};JOURNEES.forEach(j=>ETAT[j.id]={quiz:j.quiz,ouvert:false,horsLigne:true})}
  roueChargerLocal(g);
  fichesChargerLocal(g);
  // décisions prises sur ce téléphone depuis moins de 15 min (le temps que Google se mette à jour)
  const ls=lire('localst',{});
  Object.entries(ls).forEach(([id,v])=>{if(Date.now()-v.at<15*60*1000){STAG[id]=Object.assign(STAG[id]||{id,nom:v.nom,prenom:v.prenom},{statut:v.statut})}});
  JOURNEES.forEach(j=>{
    const loc=lire('local_'+j.id,null);
    if(loc && Date.now()-loc.at<15*60*1000){
      if(loc.quiz)ETAT[j.id].quiz=loc.quiz;
      if(typeof loc.ouvert==='boolean'){ETAT[j.id].ouvert=loc.ouvert;if(loc.ouvert){ETAT[j.id].duree=loc.duree||0;ETAT[j.id].ouvertAt=loc.ouvertAt||null}}
    }
  });
  const lr=lire('local_revs',{});
  Object.entries(lr).forEach(([id,v])=>{if(Date.now()-v.at<15*60*1000){const c=Object.assign({},v);delete c.at;REVS[id]=Object.assign(REVS[id]||{id,journees:[],ouvert:false,duree:0},c)}});
}
function noterLocal(id,champ,val){
  let loc=lire('local_'+id,{}); if(!loc.at||Date.now()-loc.at>15*60*1000)loc={};
  if(typeof champ==='object')Object.assign(loc,champ);else loc[champ]=val;
  loc.at=Date.now(); ecrire('local_'+id,loc);
}
function noterLocalRev(id,champs){
  const lr=lire('local_revs',{});
  let v=lr[id]; if(!v||Date.now()-v.at>15*60*1000)v={};
  lr[id]=Object.assign(v,champs,{at:Date.now()});
  Object.keys(lr).forEach(k=>{if(Date.now()-lr[k].at>24*3600*1000)delete lr[k]});
  ecrire('local_revs',lr);
  REVS[id]=Object.assign(REVS[id]||{id,journees:[],ouvert:false,duree:0},champs);
}
function quizDe(j){return (ETAT&&ETAT[j.id]&&ETAT[j.id].quiz)||j.quiz}
// Phrase d'état d'un quiz (journée ou révision)
function etatTexte(e){
  if(estOuvert(e))return e.duree?`Quiz ouvert · ⏱️ ${e.duree} min · se ferme tout seul à ${heureParis(finQuiz(e))}`:'Quiz ouvert aux stagiaires (sans chrono)';
  if(e&&e.ouvert&&finQuiz(e))return `Quiz fermé tout seul à ${heureParis(finQuiz(e))} (temps fini)`;
  return 'Quiz caché aux stagiaires';
}
// Choix de la durée du chrono avant d'ouvrir un quiz
function choixDuree(zone,ouvrir){
  zone.innerHTML=`<div class="card o" style="margin-top:12px"><h2>⏱️ Combien de temps pour répondre ?</h2>
    <p class="muted" style="margin-top:0">Le chrono démarre quand chaque stagiaire ouvre le quiz : tout le monde a le même temps. Le quiz se ferme pour tous 15 minutes + cette durée après l'ouverture.</p>
    <div class="choix">${DUREES_CHRONO.map(d=>`<button class="btn" data-d="${d}">${d} min</button>`).join('')}</div>
    <button class="btn sec" data-d="0">Sans chrono</button></div>`;
  zone.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{zone.querySelectorAll('[data-d]').forEach(x=>x.disabled=true);ouvrir(+b.dataset.d)});
  zone.scrollIntoView({behavior:'smooth',block:'center'});
}
function messageWhatsApp(titre,e){
  let t=`Hello la team ! 👋\n${titre} est ouvert ! 📝\n`;
  if(e.duree){const avant=heureParis((e.ouvertAt||Date.now())+15*60000);t+=`⏱️ Vous aurez ${e.duree} minutes une fois le quiz commencé. Commencez-le avant ${avant}.\n`}
  else t+=`Prenez 2-3 minutes pour le remplir.\n`;
  return t+`C'est sur votre espace stagiaires :\n${LIEN_STAGIAIRES}\nMerci ! 💪`;
}

// ======= Écran : code =======
function ecranCode(){
  app.innerHTML=`<div class="tag">CQP Instructeur Fitness – Cours collectifs</div><h1>Espace formateur</h1>
  <div class="card o"><h2>Code d'accès</h2>
   <input type="password" id="c" inputmode="numeric" autocomplete="off" placeholder="••••••">
   <div class="err hide" id="er">Code incorrect.</div>
   <button class="btn" id="go">Entrer</button>
   <p class="muted" style="margin-top:14px"><a href="./" style="color:var(--mute)">← Retour à l'espace stagiaires</a></p></div>`;
  const go=async()=>{
    const er=document.getElementById('er');
    const bl=lire('bloque',{n:0,jusqua:0});
    if(Date.now()<bl.jusqua){er.textContent=`Trop d'essais. Réessaie dans ${Math.ceil((bl.jusqua-Date.now())/60000)} min.`;er.classList.remove('hide');return}
    const h=await empreinte(document.getElementById('c').value.trim());
    if(h===CODE_HASH){ecrire('bloque',{n:0,jusqua:0});ecrire('ok',h);demarrer();return}
    bl.n++;
    if(bl.n>=5){const min=Math.pow(2,Math.min(bl.n-5,10));bl.jusqua=Date.now()+min*60000;er.textContent=`Code incorrect. Trop d'essais : réessaie dans ${min} min.`}
    else er.textContent=`Code incorrect (${5-bl.n} essai${5-bl.n>1?'s':''} avant blocage).`;
    ecrire('bloque',bl);er.classList.remove('hide');
  };
  document.getElementById('go').onclick=go;
  document.getElementById('c').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function demarrer(){
  app.innerHTML=`<p class="muted">Chargement…</p>`;
  await chargerEtat(); accueil();
}

// ======= Écran : accueil =======
function accueil(){
  let h=`<div class="tag">Espace formateur</div><h1>Bonjour Hamid 👋</h1>`;

// ======= Écran : mes stagiaires =======
function estTest(x){return !!(x&&String(x.id||'').startsWith('test-'))}
function acceptes(){return Object.values(STAG).filter(x=>x.statut==='accepte').sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom,'fr'))}
async function decider(liste,statut){
  for(const x of liste){
    await envoyerForm(FORM_QUIZ,{[EQ.journee]:'stagiaires',[EQ.statut]:statut,[EQ.contenu]:JSON.stringify({id:x.id,nom:x.nom,prenom:x.prenom})});
    const ls=lire('localst',{});ls[x.id]={statut,nom:x.nom,prenom:x.prenom,at:Date.now()};ecrire('localst',ls);
    STAG[x.id]=Object.assign(STAG[x.id]||x,{statut});
  }
}
function mesStagiaires(msg){
  const tous=Object.values(STAG);
  const att=tous.filter(x=>x.statut==='attente'), acc=acceptes(), aut=tous.filter(x=>x.statut==='refuse'||x.statut==='supprime');
  const doublon=x=>acc.some(a=>a.id!==x.id&&memeNom(a.prenom+' '+a.nom,x.prenom+' '+x.nom));
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>👥 Mes stagiaires</h1>
  ${msg?`<div class="ok" style="margin:-6px 0 14px">${msg}</div>`:''}
  <div class="card o"><h2>Demandes en attente (${att.length})</h2>`;
  if(!att.length)h+=`<p class="muted" style="margin:0">Aucune demande pour l'instant.</p>`;
  att.forEach(x=>{h+=`<div class="stag"><b>${esc(x.prenom)} ${esc(x.nom)}</b>${doublon(x)?`<div class="d" style="color:var(--ja)">⚠️ Même nom qu'un stagiaire déjà accepté (deuxième téléphone ou faux profil ?)</div>`:''}
    <div style="display:flex;gap:8px"><button class="btn small" data-acc="${x.id}">✅ Accepter</button><button class="btn small ko" data-ref="${x.id}">❌ Refuser</button></div></div>`});
  if(att.length>1)h+=`<button class="btn ko" id="toutref">❌ Tout refuser (${att.length})</button>`;
  h+=`</div><div class="card g"><h2>Stagiaires acceptés (${acc.length})</h2>`;
  if(!acc.length)h+=`<p class="muted" style="margin:0">Personne pour l'instant.</p>`;
  acc.forEach(x=>{h+=`<div class="stag"><b>${esc(x.prenom)} ${esc(x.nom)}</b><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-bil="${x.id}">📊 Bilan</button><button class="btn small ko" data-sup="${x.id}">🗑️ Supprimer</button></div></div>`});
  h+=`</div>`;
  if(aut.length){h+=`<div class="card"><h2>Refusés ou supprimés (${aut.length})</h2><p class="muted" style="margin-top:0">Ils n'ont pas accès. Tu peux les réaccepter en cas d'erreur.</p>`;
    aut.forEach(x=>{h+=`<div class="row" style="align-items:center"><span>${esc(x.prenom)} ${esc(x.nom)} <span class="muted">(${x.statut==='refuse'?'refusé':'supprimé'})</span></span><span style="display:flex;gap:6px;flex:none"><button class="btn small sec" style="margin:0" data-acc="${x.id}">↩️ Réaccepter</button><button class="btn small ko" style="margin:0" data-eff="${x.id}">🗑️ Effacer</button></span></div>`});
    h+=`</div>`}
  const tests=acc.filter(estTest), moiTest=(()=>{try{return JSON.parse(localStorage.getItem('cqp_moi')||'null')}catch(e){return null}})();
  h+=`<div class="card j"><h2>🧪 Stagiaires de test</h2><p class="muted" style="margin-top:0">Pour essayer l'appli. Ils ne comptent pas dans tes statistiques ni dans ton résumé.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>Combien ?</span><select id="t-nb" style="width:auto">${[1,2,4,6,10].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select><button class="btn small" style="margin:0" id="t-cree">➕ Créer</button></div>
    ${tests.map(x=>`<div class="row" style="align-items:center"><span><b>${esc(x.prenom)} ${esc(x.nom)}</b>${moiTest&&moiTest.id===x.id?' <span class="muted">(c\'est toi sur ce téléphone)</span>':''}</span><button class="btn small sec" style="margin:0" data-moi="${x.id}">👤 Me mettre à sa place</button></div>`).join('')}
    ${tests.length?`<button class="btn ko" id="t-sup">🗑️ Supprimer tous les stagiaires de test (${tests.length})</button>`:''}
    <div class="ok hide" id="t-ok"></div></div>`;
  h+=`<button class="btn sec" id="maj">🔄 Actualiser</button>
  <p class="muted">Une décision met quelques minutes à arriver chez le stagiaire (le temps que Google se mette à jour). Le jour J, accepte-les dès l'accueil.</p>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=accueil;
  document.getElementById('maj').onclick=async()=>{app.innerHTML=`<p class="muted">Chargement…</p>`;await chargerEtat();mesStagiaires()};
  const agir=async(btn,liste,statut,texte)=>{
    btn.disabled=true;btn.textContent='…';
    try{await decider(liste,statut)}catch(e){alert("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.");mesStagiaires();return}
    const y=window.scrollY;mesStagiaires(texte);window.scrollTo(0,y);
  };
  const tc=document.getElementById('t-cree');
  if(tc)tc.onclick=async()=>{
    const n=+document.getElementById('t-nb').value, deja=acc.filter(estTest).map(x=>+x.nom||0), base=deja.length?Math.max(...deja):0, liste=[];
    for(let k=1;k<=n;k++)liste.push({id:'test-'+nouvelId(),prenom:'Test',nom:String(base+k)});
    tc.disabled=true;tc.textContent='…';
    try{for(const x of liste){await envoyerForm(FORM_QUIZ,{[EQ.journee]:'stagiaires',[EQ.statut]:'demande',[EQ.contenu]:JSON.stringify({id:x.id,nom:x.nom,prenom:x.prenom})})}
      await decider(liste,'accepte')}catch(e){alert("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.")}
    mesStagiaires(`🧪 ${n} stagiaire${n>1?'s':''} de test créé${n>1?'s':''}.`);
  };
  app.querySelectorAll('[data-moi]').forEach(b=>b.onclick=()=>{const x=STAG[b.dataset.moi];
    if(!confirm(`Ouvrir l'espace stagiaires sur ce téléphone en tant que « ${x.prenom} ${x.nom} » ?`))return;
    try{localStorage.setItem('cqp_moi',JSON.stringify({id:x.id,nom:x.nom,prenom:x.prenom}))}catch(e){}
    window.location.href='./';});
  const ts=document.getElementById('t-sup');
  if(ts)ts.onclick=()=>{const L=acc.filter(estTest);if(confirm(`Supprimer les ${L.length} stagiaires de test ?`))agir(ts,L,'efface',`🗑️ ${L.length} stagiaire${L.length>1?'s':''} de test supprimé${L.length>1?'s':''}.`)};
  app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const x=STAG[b.dataset.acc];agir(b,[x],'accepte',`✅ ${esc(x.prenom)} ${esc(x.nom)} est accepté.`)});
  app.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const x=STAG[b.dataset.ref];agir(b,[x],'refuse',`${esc(x.prenom)} ${esc(x.nom)} est refusé.`)});
  app.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{const x=STAG[b.dataset.sup];
    if(confirm(`Supprimer ${x.prenom} ${x.nom} ?\n\nIl n'aura plus accès à l'espace stagiaires et ses réponses ne compteront plus dans tes statistiques. Tu pourras le réaccepter plus tard.`))agir(b,[x],'supprime',`🗑️ ${esc(x.prenom)} ${esc(x.nom)} est supprimé.`)});
  app.querySelectorAll('[data-bil]').forEach(b=>b.onclick=()=>bilanStagiaire(STAG[b.dataset.bil]));
  app.querySelectorAll('[data-eff]').forEach(b=>b.onclick=()=>{const x=STAG[b.dataset.eff];
    if(confirm(`Effacer ${x.prenom} ${x.nom} de ta liste ?`))agir(b,[x],'efface',`🗑️ ${esc(x.prenom)} ${esc(x.nom)} est effacé de ta liste.`)});
  const tr=document.getElementById('toutref');
  if(tr)tr.onclick=()=>{if(confirm(`Refuser les ${att.length} demandes en attente ?`))agir(tr,att,'refuse',`${att.length} demandes refusées.`)};
  haut();
}

// ======= Lecture d'une ligne de réponse =======
// La question n°i d'une ligne : celle de la banque si la ligne garde son numéro, sinon celle du quiz
function questionDe(R,i,z){const id=R.ids[i];const b=id&&questionParId(id);return b||(z&&z.questions[i])||null}
function quizDeLigne(lab){
  const j=JOURNEES.find(j=>lab.startsWith(j.titre));
  if(j)return {j,z:quizDe(j),tag:j.titre,titre:j.theme};
  const r=Object.values(REVS).find(r=>r.titre===lab);
  if(r)return {rev:r,z:r.quiz,tag:'Révision',titre:r.titre};
  if(/^Révision/.test(lab))return {z:{ressenti:[],questions:[]},tag:'Révision',titre:lab};
  return null;
}
// Tout l'historique d'un stagiaire, reconstruit depuis le tableau des réponses (feuilles papier comprises)
function historiqueStagiaire(x){
  return lignes.slice(1).filter(l=>!estObs(l)&&memeNom(x.prenom+' '+x.nom,(l[2]||'')+' '+(l[1]||''))).map(l=>{
    const lab=(l[3]||'').trim(), info=quizDeLigne(lab);
    if(!info)return null;
    const R=lireReponses(l[5]), items=[];
    for(let i=0;i<R.total;i++){const e=R.etats[i];items.push({q:questionDe(R,i,info.z),etat:e?e.etat:'?',rep:e?e.rep:null})}
    return Object.assign({l:lab,d:horoVersMs(l[0])||0,h:l[0]||'',R,items,rs:lireRessenti(l[4]),dif:(l[6]||'').trim()},info);
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
}

// ======= Écran : bilan d'un stagiaire =======
async function bilanStagiaire(x){
  app.innerHTML=`<button class="back" id="bk">← Retour</button><div class="tag">Bilan du stagiaire</div><h1>${esc(x.prenom)} ${esc(x.nom)}</h1><div id="zb"><p class="muted">Chargement…</p></div>`;
  document.getElementById('bk').onclick=()=>mesStagiaires();
  haut();
  try{await chargerReponses()}catch(e){document.getElementById('zb').innerHTML=`<div class="card r"><h2>Impossible de lire les réponses</h2><p>Vérifie ta connexion internet, puis réessaie.</p><button class="btn" id="re">Réessayer</button></div>`;document.getElementById('re').onclick=()=>bilanStagiaire(x);return}
  const H=historiqueStagiaire(x);
  let h=`<div class="card j"><h2>📲 Nouveau téléphone ?</h2><p class="muted" style="margin-top:0">Envoie-lui un lien qui récupère son espace et son évolution sur son nouveau téléphone (valable 7 jours, à ouvrir une seule fois).</p>
    <button class="btn wa" id="tel">📲 Envoyer son historique sur son nouveau téléphone</button><div class="muted hide" id="telinfo" style="margin-top:8px"></div></div>`;
  if(!H.length)h+=`<div class="card"><p class="muted" style="margin:0">Pas encore de réponse pour ce stagiaire.</p></div>`;
  const nb={};H.forEach(e=>nb[e.l]=(nb[e.l]||0)+1);const vu={};
  H.slice().reverse().forEach(e=>{
    vu[e.l]=(vu[e.l]||0)+1;
    const sc=e.R.score||0, tot=e.R.total||e.z.questions.length, c=classe(sc,tot);
    h+=`<div class="card ${c==='p-ok'?'g':c==='p-moy'?'j':'r'}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><div class="tag" style="color:var(--soft)">${esc(e.tag)}${nb[e.l]>1?` · envoi ${nb[e.l]-vu[e.l]+1}`:''}</div><h2 style="margin:4px 0 0">${esc(e.titre)}</h2></div><span class="pill ${c}">${sc}/${tot}</span></div>
      <p class="muted" style="margin:6px 0 0">Envoyé le ${esc(e.h)}${e.R.papier?' · feuille papier':''}</p>
      <label>Ressenti « J'ai compris… »</label>`;
    e.rs.forEach(k=>{h+=`<div class="row"><span>${esc(k.t)}</span><span class="pill ${k.n?classe(k.n,5):'p-ko'}">${k.n?k.n+'/5':'⏳ -'}</span></div>`});
    if(!e.rs.length)h+=`<p class="muted" style="margin:0">Pas de ressenti dans ce quiz.</p>`;
    h+=`<label>Ses réponses</label>`;
    e.items.forEach((it,i)=>{
      const q=it.q;
      h+=`<div class="stag"><b>${i+1}. ${esc(q?q.q:'Question '+(i+1))}</b>`;
      if(it.etat==='ok')h+=`<div class="d">✅ ${esc(q?q.o[q.b]:'Bonne réponse')}</div>`;
      else if(it.etat==='ko')h+=`<div class="d">❌ A répondu : ${esc(it.rep)}</div>${q?`<div class="d" style="color:var(--ok)">Bonne réponse : ${esc(q.o[q.b])}</div>`:''}`;
      else if(it.etat==='na')h+=`<div class="d" style="color:var(--ja)">⏳ Pas répondu (temps fini)</div>${q?`<div class="d" style="color:var(--ok)">Bonne réponse : ${esc(q.o[q.b])}</div>`:''}`;
      else h+=`<div class="d muted">Pas de réponse</div>`;
      h+=`</div>`;
    });
    h+=`<label>Difficulté signalée</label><p style="margin:0" class="${e.dif?'':'muted'}">${e.dif?esc(e.dif):'Aucune.'}</p></div>`;
  });
  document.getElementById('zb').innerHTML=h;
  document.getElementById('tel').onclick=async()=>{
    const b=document.getElementById('tel'), info=document.getElementById('telinfo');
    b.disabled=true;
    let lien;
    try{lien=await lienTransfert(x,H)}catch(e){b.disabled=false;info.textContent="Je n'ai pas pu fabriquer le lien. Réessaie.";info.classList.remove('hide');return}
    b.disabled=false;
    info.textContent=`✅ Lien prêt (${H.length} quiz). WhatsApp va s'ouvrir : choisis ${x.prenom}, puis envoie.`;info.classList.remove('hide');
    setTimeout(()=>ouvrirWhatsApp(`Voici ton lien pour retrouver ton espace et ton évolution sur ton nouveau téléphone (à ouvrir une seule fois) : ${lien}`),400);
  };
}
// Fabrique le lien #t=… (les questions de la banque sont envoyées par leur numéro seulement)
async function lienTransfert(x,H){
  const ref=q=>(q.id&&questionParId(q.id))?q.id:{q:q.q,o:q.o,b:q.b,e:q.e||'',t:q.theme||'autre'};
  const fab=(niveau)=>({v:1,c:Math.round(Date.now()/1000),m:[x.id,x.nom,x.prenom],
    h:H.slice(niveau>=3?-15:0).map(e=>[e.l,Math.round(e.d/1000),
      e.items.filter(it=>it.q&&it.etat!=='?').map(it=>{
        const s=it.etat==='ok'?1:it.etat==='na'?2:0; let r=ref(it.q);
        if(niveau>=1&&typeof r==='object')r=Object.assign({},r,{e:''});
        if(s!==0)return [r,s];
        const k=it.q.o.indexOf(it.rep);return [r,s,k>=0?k:String(it.rep||'')];
      }),
      niveau>=2?[]:e.rs.map(k=>[k.t,k.n])])});
  let t='';
  for(let n=0;n<=3;n++){t=await encoderLien(fab(n));if(t.length<7500)break}
  return LIEN_STAGIAIRES+'#t='+t;
}

function diapos(j){
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Diapos et documents</h1>
   ${(j.docs||[]).map(d=>`<a class="btn" href="${d.fichier}" download>⬇️ ${esc(d.titre)}</a>`).join('')}
   <p class="muted" style="margin-top:16px">Exactement ce que les stagiaires ont reçu. Touche une diapo pour l'ouvrir en grand.</p>`;
  for(let i=1;i<=j.diapos;i++){const s=`${j.dossier}/${String(i).padStart(2,'0')}.jpg`;h+=`<a href="${s}" target="_blank" rel="noopener"><img class="slide" loading="lazy" src="${s}" alt="Diapo ${i}"></a>`}
  h+=`<button class="btn sec" id="bk2">← Retour</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>journee(j);document.getElementById('bk2').onclick=()=>journee(j);
  haut();
}

// ======= Écran : mon quiz du jour (voir + modifier) =======
function monQuiz(j,zDepart,msg){
  editeur({tag:j.titre,titre:'Mon quiz du jour',z:zDepart||copie(quizDe(j)),msg,banque:j,max:5,
    retour:()=>journee(j),
    reouvrir:(z,m)=>monQuiz(j,z,m),
    defaut:()=>copie(j.quiz), defautTexte:'↩️ Revenir au quiz préparé avec Claude',
    note:'Si le quiz est déjà ouvert, les changements s\'appliquent aux stagiaires qui ne l\'ont pas encore rempli.',
    enregistrer:async propre=>{
      await envoyerForm(FORM_QUIZ,{[EQ.journee]:j.id,[EQ.statut]:'quiz',[EQ.contenu]:JSON.stringify(propre)});
      ETAT[j.id].quiz=propre; noterLocal(j.id,'quiz',propre);
      return `✅ Quiz enregistré${estOuvert(ETAT[j.id])?" : les stagiaires verront la nouvelle version d'ici quelques minutes.":". Il reste caché tant que tu ne l'as pas ouvert."}`;
    }});
}
// Éditeur de quiz (journée ou révision)
function nettoyer(z){
  return {ressenti:z.ressenti.map(t=>t.trim()).filter(Boolean),
    questions:z.questions.map(q=>{const o=[];let b=-1;q.o.forEach((t,k)=>{if(t.trim()){if(k===q.b)b=o.length;o.push(t.trim())}});
      const r={q:q.q.trim(),o,b,e:(q.e||'').trim()};
      if(q.theme)r.theme=q.theme;
      // on garde le numéro de la banque seulement si la question n'a pas été changée
      const bq=q.id&&questionParId(q.id);
      if(bq&&bq.q===r.q&&JSON.stringify(bq.o)===JSON.stringify(r.o)&&bq.b===r.b)r.id=q.id;
      return r})};
}
function editeur(cfg){
  const z=cfg.z;
  const dessiner=()=>{
    let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(cfg.tag)}</div><h1>${esc(cfg.titre)}</h1>
    ${cfg.msg?`<div class="ok" style="margin:-6px 0 14px">${esc(cfg.msg)}</div>`:''}
    ${cfg.banque&&cfg.banque.banque?`<div class="card j"><h2>Pas d'idée ?</h2><p class="muted" style="margin-top:0">Des quiz tout prêts, faits à partir des diapos de la journée.</p>
      <button class="btn" id="bq">📚 Choisir un quiz tout prêt</button><button class="btn sec" id="sur">🎲 Quiz surprise</button></div>`:''}
    <p class="muted" style="margin-top:-8px">Pour dicter : touche une case, puis le micro 🎤 de ton clavier. Touche ✓ pour choisir la bonne réponse.</p>
    <p><span class="duree">${texteDuree(z)}</span>${cfg.max&&dureeQuiz(z)>cfg.max?` <span style="color:var(--ja);font-size:15px">Plus de ${cfg.max} minutes : pense à enlever une question ou une ligne.</span>`:''}</p>
    <div class="card o"><h2>Ressenti « J'ai compris… »</h2><p class="muted" style="margin-top:0">Les stagiaires notent chaque ligne de 1 à 5.</p>`;
    z.ressenti.forEach((t,i)=>{h+=`<div class="ligne"><input type="text" data-rs="${i}" value="${esc(t)}"><button class="x" data-rsx="${i}" title="Supprimer">✕</button></div>`});
    h+=`<button class="btn small sec" id="addr">+ Ajouter une ligne</button></div>
    <div class="card"><h2>Les questions</h2>`;
    z.questions.forEach((q,i)=>{
      h+=`<div class="qed"><div style="display:flex;justify-content:space-between;align-items:center"><b>Question ${i+1}</b><button class="link" data-qx="${i}" style="color:var(--ko)">Supprimer</button></div>
      <textarea data-qq="${i}" style="min-height:70px;margin-top:8px">${esc(q.q)}</textarea>
      <label style="margin-top:10px">Réponses proposées</label>`;
      q.o.forEach((o,k)=>{h+=`<div class="ligne"><button class="bonne ${q.b===k?'on':''}" data-qb="${i}:${k}" title="Bonne réponse">✓</button><input type="text" data-qo="${i}:${k}" value="${esc(o)}">${q.o.length>2?`<button class="x" data-qox="${i}:${k}">✕</button>`:''}</div>`});
      if(q.o.length<4)h+=`<button class="btn small sec" data-qoa="${i}">+ Ajouter une réponse</button>`;
      h+=`<label>Explication (affichée après l'envoi)</label><textarea data-qe="${i}" style="min-height:70px">${esc(q.e||'')}</textarea></div>`;
    });
    h+=`<button class="btn small sec" id="addq">+ Ajouter une question</button></div>
    <div class="err hide" id="er"></div>
    <button class="btn" id="sav">💾 ${esc(cfg.texteEnregistrer||'Enregistrer le quiz')}</button>
    <div class="ok hide" id="okk"></div>
    ${cfg.defaut?`<button class="btn sec" id="def">${esc(cfg.defautTexte)}</button>`:''}
    ${cfg.note?`<p class="muted">${esc(cfg.note)}</p>`:''}`;
    app.innerHTML=h;
    document.getElementById('bk').onclick=cfg.retour;
    // lecture des champs avant chaque action
    const lireChamps=()=>{
      app.querySelectorAll('[data-rs]').forEach(e=>z.ressenti[+e.dataset.rs]=e.value);
      app.querySelectorAll('[data-qq]').forEach(e=>z.questions[+e.dataset.qq].q=e.value);
      app.querySelectorAll('[data-qe]').forEach(e=>z.questions[+e.dataset.qe].e=e.value);
      app.querySelectorAll('[data-qo]').forEach(e=>{const [i,k]=e.dataset.qo.split(':').map(Number);z.questions[i].o[k]=e.value});
    };
    const re=f=>()=>{lireChamps();f();const y=window.scrollY;cfg.msg='';dessiner();window.scrollTo(0,y)};
    const bq=document.getElementById('bq');
    if(bq){
      bq.onclick=()=>{lireChamps();banqueCategories(cfg.banque,()=>cfg.reouvrir(z),(zc,titre)=>cfg.reouvrir(zc,`📚 Quiz « ${titre} » chargé. Vérifie-le, puis touche 💾 Enregistrer le quiz.`))};
      document.getElementById('sur').onclick=()=>{lireChamps();quizSurprise(cfg.banque,()=>cfg.reouvrir(z),(zc)=>cfg.reouvrir(zc,'🎲 Quiz surprise chargé. Vérifie-le, puis touche 💾 Enregistrer le quiz.'))};
    }
    document.getElementById('addr').onclick=re(()=>z.ressenti.push(''));
    app.querySelectorAll('[data-rsx]').forEach(b=>b.onclick=re(()=>z.ressenti.splice(+b.dataset.rsx,1)));
    document.getElementById('addq').onclick=re(()=>z.questions.push({q:'',o:['','',''],b:-1,e:''}));
    app.querySelectorAll('[data-qx]').forEach(b=>b.onclick=re(()=>z.questions.splice(+b.dataset.qx,1)));
    app.querySelectorAll('[data-qb]').forEach(b=>b.onclick=re(()=>{const [i,k]=b.dataset.qb.split(':').map(Number);z.questions[i].b=k}));
    app.querySelectorAll('[data-qoa]').forEach(b=>b.onclick=re(()=>z.questions[+b.dataset.qoa].o.push('')));
    app.querySelectorAll('[data-qox]').forEach(b=>b.onclick=re(()=>{const [i,k]=b.dataset.qox.split(':').map(Number);const q=z.questions[i];q.o.splice(k,1);if(q.b===k)q.b=-1;else if(q.b>k)q.b--}));
    const def=document.getElementById('def');
    if(def)def.onclick=()=>{if(confirm('Remettre le quiz préparé avec Claude ? Tes changements non enregistrés seront perdus.')){const d=cfg.defaut();z.ressenti=d.ressenti;z.questions=d.questions;cfg.msg='';dessiner()}};
    document.getElementById('sav').onclick=async()=>{
      lireChamps();
      const er=document.getElementById('er');
      const propre=nettoyer(z);
      const pb=[];
      if(!propre.questions.length)pb.push('Ajoute au moins une question.');
      propre.questions.forEach((q,i)=>{
        if(!q.q)pb.push(`Question ${i+1} : écris la question.`);
        if(q.o.length<2)pb.push(`Question ${i+1} : il faut au moins 2 réponses.`);
        if(q.b<0)pb.push(`Question ${i+1} : touche ✓ pour choisir la bonne réponse.`);
      });
      propre.ressenti.forEach((t,i)=>{if(/[:|]/.test(t))pb.push(`Ressenti, ligne ${i+1} : n'utilise pas les signes « : » ni « | ».`)});
      if(pb.length){er.innerHTML=pb.map(esc).join('<br>');er.classList.remove('hide');er.scrollIntoView({behavior:'smooth',block:'center'});return}
      er.classList.add('hide');
      const b=document.getElementById('sav');b.disabled=true;b.textContent='Enregistrement…';
      let m;
      try{m=await cfg.enregistrer(propre)}
      catch(e){b.disabled=false;b.textContent='💾 '+(cfg.texteEnregistrer||'Enregistrer le quiz');er.textContent="L'enregistrement n'a pas marché. Vérifie ta connexion internet et réessaie.";er.classList.remove('hide');return}
      if(cfg.apres)return cfg.apres(m);
      z.ressenti=propre.ressenti; z.questions=propre.questions; cfg.msg='';
      dessiner();
      const ok=document.getElementById('okk');ok.textContent=m;ok.classList.remove('hide');ok.scrollIntoView({behavior:'smooth',block:'center'});
    };
  };
  dessiner(); haut();
}

// ======= Quiz tout prêts : catégories → quiz → aperçu =======
function banqueCategories(j,retour,choisir){
  const B=j.banque;
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>📚 Quiz tout prêts</h1>
   <p class="muted" style="margin-top:-8px">Choisis un thème. Chaque quiz dure 5 minutes au plus.</p>`;
  B.categories.forEach((c,i)=>{h+=`<button class="btn sec" data-c="${i}" style="text-align:left">${c.emoji} ${esc(c.titre)} <span class="muted" style="float:right">${c.quiz.length} quiz</span></button>`});
  h+=`<button class="btn" id="sur" style="margin-top:22px">🎲 Quiz surprise</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=retour;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>banqueQuiz(j,B.categories[+b.dataset.c],retour,choisir));
  document.getElementById('sur').onclick=()=>quizSurprise(j,()=>banqueCategories(j,retour,choisir),z=>choisir(z,'Quiz surprise'));
  haut();
}
function banqueQuiz(j,c,retour,choisir){
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)} · ${c.emoji} ${esc(c.titre)}</div><h1>Choisis un quiz</h1>`;
  c.quiz.forEach((qz,i)=>{const z=quizDepuisBanque(qz);
    h+=`<div class="card"><h2>${esc(qz.titre)}</h2><p class="muted" style="margin:0">${z.questions.length} questions · ${z.ressenti.length} ligne${z.ressenti.length>1?'s':''} de ressenti</p><span class="duree">${texteDuree(z)}</span>
     <button class="btn sec" data-z="${i}">👀 Voir les questions</button></div>`});
  app.innerHTML=h;
  const ici=()=>banqueQuiz(j,c,retour,choisir);
  document.getElementById('bk').onclick=()=>banqueCategories(j,retour,choisir);
  app.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const qz=c.quiz[+b.dataset.z];
    apercu({tag:`${c.emoji} ${c.titre}`,titre:qz.titre,z:quizDepuisBanque(qz),pool:j.banque.questions,retour:ici,
      actions:[{txt:'✅ Choisir ce quiz',f:z=>choisir(z,qz.titre)}]})});
  haut();
}
function quizSurprise(j,retour,choisir){
  const z={ressenti:(j.quiz.ressenti||[]).slice(0,3),questions:tirerQuestions(paquetsParTheme(j.banque.questions),10)};
  apercu({tag:j.titre,titre:'Quiz surprise',de:true,z,pool:j.banque.questions,retour,
    info:'Questions tirées au hasard dans la banque de la journée.',
    actions:[{txt:'✅ Choisir ce quiz',f:z=>choisir(z)}]});
}
// Aperçu : bonnes réponses visibles, 🔒 pour garder une question, 🔄 pour changer les autres
function apercu(cfg){
  const z=copie(cfg.z), verrous=z.questions.map(()=>false), vus=new Set();
  const dessiner=()=>{
    let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(cfg.tag)}</div><h1>${cfg.de?`<button class="de" id="de" title="Relancer le tirage" aria-label="Relancer le tirage">🎲</button> `:''}${esc(cfg.titre)}</h1>
     ${cfg.de?`<p style="margin:-12px 0 10px;color:var(--or);font-weight:700;font-size:15px">👆 Touche le dé pour relancer</p>`:''}
     ${cfg.info?`<p class="muted" style="margin-top:-8px">${esc(cfg.info)}</p>`:''}
     <p><span class="duree">${texteDuree(z)}</span> <span class="muted">· ${z.questions.length} questions</span></p>`;
    if(z.ressenti.length)h+=`<div class="card o"><h2>Ressenti « J'ai compris… »</h2>${z.ressenti.map(t=>`<div class="row"><span>${esc(t)}</span></div>`).join('')}</div>`;
    h+=`<div class="card"><h2>Les questions</h2><p class="muted" style="margin-top:0">✓ = bonne réponse. Touche 🔒 pour garder une question, puis 🔄 pour changer les autres.</p>`;
    z.questions.forEach((q,i)=>{
      h+=`<div class="apq ${verrous[i]?'lock':''}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><b>${i+1}. ${esc(q.q)}</b>
        <button class="verrou ${verrous[i]?'on':''}" data-v="${i}">${verrous[i]?'🔒 Gardée':'🔒 Garder'}</button></div>
        ${q.o.map((o,k)=>`<div class="${k===q.b?'bon':'muted'}" style="margin-top:6px">${k===q.b?'✓':'•'} ${esc(o)}</div>`).join('')}
        ${q.e?`<div class="expl">💡 ${esc(q.e)}</div>`:''}
        <div class="th">Thème : ${esc(nomTheme(q.theme))}</div></div>`});
    h+=`</div><button class="btn sec" id="autre">🔄 Autre proposition</button>
      <div class="muted hide" id="autreinfo" style="margin-top:6px"></div>
      ${cfg.actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-a="${i}">${a.txt}</button>`).join('')}`;
    app.innerHTML=h;
    document.getElementById('bk').onclick=cfg.retour;
    app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{verrous[+b.dataset.v]=!verrous[+b.dataset.v];const y=window.scrollY;dessiner();window.scrollTo(0,y)});
    document.getElementById('autre').onclick=()=>{
      if(verrous.every(Boolean)){const i=document.getElementById('autreinfo');i.textContent='Toutes les questions sont gardées 🔒 : enlève un cadenas pour en changer.';i.classList.remove('hide');return}
      z.questions=autreProposition(z.questions,verrous,cfg.pool,vus);const y=window.scrollY;dessiner();window.scrollTo(0,y)};
    app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>cfg.actions[+b.dataset.a].f(copie(z)));
    const de=document.getElementById('de');
    if(de)de.onclick=()=>{
      if(verrous.every(Boolean)){const i=document.getElementById('autreinfo');i.textContent='Toutes les questions sont gardées 🔒 : enlève un cadenas pour en changer.';i.classList.remove('hide');return}
      // nouveau tirage au hasard (les 🔒 restent), en évitant les questions déjà affichées
      const gardees=new Set(z.questions.filter((q,i)=>verrous[i]).map(cleQ)), actuelles=new Set(z.questions.map(cleQ));
      const pool=cfg.pool.filter(p=>!gardees.has(cleQ(p))), neufs=pool.filter(p=>!actuelles.has(cleQ(p))), nb=verrous.filter(v=>!v).length;
      let tir=tirerQuestions(paquetsParTheme(neufs.length>=nb?neufs:pool),nb);
      if(tir.length<nb){const pris=new Set(tir.map(cleQ));tir=tir.concat(tirerQuestions(paquetsParTheme(pool.filter(p=>!pris.has(cleQ(p)))),nb-tir.length))}
      let k=0;z.questions=z.questions.map((q,i)=>verrous[i]?q:(tir[k++]||q));
      z.questions.forEach(q=>vus.add(cleQ(q)));
      const y=window.scrollY;dessiner();window.scrollTo(0,y);
      const d2=document.getElementById('de');if(d2){d2.classList.add('roule');setTimeout(()=>d2.classList.remove('roule'),650)}
    };
  };
  dessiner(); haut();
}

// ======= Quiz de révision =======
function revisionEcran(msg){
  const rc=revisionCourante(REVS);
  const autres=Object.values(REVS).filter(r=>!rc||r.id!==rc.id).sort((a,b)=>b.cree-a.cree);
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>🧠 Quiz de révision</h1>
   ${msg?`<div class="ok" style="margin:-6px 0 14px">${esc(msg)}</div>`:''}`;
  if(rc){const o=estOuvert(rc);
    h+=`<div class="card ${o?'g':'j'}"><div class="tag" style="color:var(--soft)">Révision en cours</div><h2 style="margin-top:4px">${esc(rc.titre)}</h2>
     <div class="statut" style="font-size:16px"><span class="dot" style="background:${o?'var(--ok)':'var(--mute)'}"></span>${esc(etatTexte(rc))}</div>
     <p class="muted" style="margin:6px 0 0">${rc.quiz.questions.length} questions · ${texteDuree(rc.quiz)}${(rc.journees||[]).length?` · ${rc.journees.map(id=>{const j=JOURNEES.find(x=>x.id===id);return j?j.titre:id}).join(', ')}`:''}</p>
     ${o?`<button class="btn wa" id="prev">📲 Prévenir les stagiaires sur WhatsApp</button><button class="btn ko" id="tog">🔒 Fermer la révision</button>`:`<button class="btn" id="tog">🔓 Ouvrir aux stagiaires</button>`}
     <div id="dur"></div><div class="ok hide" id="togok"></div>
     <button class="btn sec" id="rep">📊 Réponses et résumé</button>
     <button class="btn sec" id="mod">✏️ Modifier ce quiz</button></div>`}
  h+=`<div class="card o"><h2>🆕 Nouvelle révision</h2><p class="muted" style="margin-top:0">Des questions tirées au hasard dans les journées que tu choisis.${rc?' La révision en cours sera fermée.':''}</p><button class="btn" id="new">Préparer une nouvelle révision</button></div>`;
  if(autres.length){h+=`<div class="card"><h2>Historique</h2>`+autres.map(r=>`<div class="row" style="align-items:center"><span>${esc(r.titre)} <span class="muted">· ${r.quiz.questions.length} questions</span></span><button class="btn small sec" style="margin:0" data-r="${esc(r.id)}">📊 Réponses</button></div>`).join('')+`</div>`}
  h+=`<button class="btn sec" id="maj">🔄 Actualiser</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=accueil;
  document.getElementById('new').onclick=()=>nouvelleRevision();
  document.getElementById('maj').onclick=async()=>{app.innerHTML=`<p class="muted">Chargement…</p>`;await chargerEtat();revisionEcran()};
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>reponses(cibleRevision(REVS[b.dataset.r])));
  if(rc){
    const o=estOuvert(rc);
    document.getElementById('rep').onclick=()=>reponses(cibleRevision(rc));
    document.getElementById('mod').onclick=()=>editeur({tag:'Révision',titre:rc.titre,z:copie(rc.quiz),retour:()=>revisionEcran(),reouvrir:()=>revisionEcran(),
      note:'Si la révision est déjà ouverte, les changements s\'appliquent aux stagiaires qui ne l\'ont pas encore commencée.',
      enregistrer:async propre=>{await enregistrerRevision(rc,propre);return '✅ Révision enregistrée.'}});
    const prev=document.getElementById('prev');
    if(prev)prev.onclick=()=>ouvrirWhatsApp(messageWhatsApp(`Le quiz de révision (${rc.titre}) 🧠`,rc));
    const tog=document.getElementById('tog');
    const changer=async(nouveau,duree)=>{
      tog.disabled=true;tog.textContent='Un instant…';
      try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:'revision',[EQ.statut]:nouveau?'ouvert':'ferme',[EQ.contenu]:JSON.stringify(nouveau?{id:rc.id,duree}:{id:rc.id})})}
      catch(e){alert("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.");revisionEcran();return}
      noterLocalRev(rc.id,nouveau?{ouvert:true,duree,ouvertAt:Date.now()}:{ouvert:false});
      revisionEcran(nouveau?`✅ Révision ouverte${duree?` avec un chrono de ${duree} min`:''}. Elle apparaîtra chez les stagiaires d'ici quelques minutes.`:'✅ Révision fermée.');
    };
    tog.onclick=()=>{if(o)changer(false);else choixDuree(document.getElementById('dur'),d=>changer(true,d))};
  }
  haut();
}
async function enregistrerRevision(r,propre){
  await envoyerForm(FORM_QUIZ,{[EQ.journee]:'revision',[EQ.statut]:'quiz',[EQ.contenu]:JSON.stringify({id:r.id,titre:r.titre,journees:r.journees||[],quiz:propre})});
  noterLocalRev(r.id,{titre:r.titre,journees:r.journees||[],quiz:propre,cree:r.cree||Date.now()});
}
function nouvelleRevision(){
  const choix={j:JOURNEES.map(j=>j.id).filter(id=>{const j=JOURNEES.find(x=>x.id===id);return j.banque&&j.banque.questions.length}),duree:5,ressenti:false};
  const dessiner=()=>{
    let h=`<button class="back" id="bk">← Retour</button><div class="tag">Quiz de révision</div><h1>🆕 Nouvelle révision</h1>
     <div class="card"><h2>Quelles journées ?</h2>`+
     JOURNEES.filter(j=>j.banque&&j.banque.questions.length).map(j=>`<label class="check"><input type="checkbox" data-j="${j.id}" ${choix.j.includes(j.id)?'checked':''}> ${esc(j.titre)} – ${esc(j.theme)}</label>`).join('')+`</div>
     <div class="card"><h2>Combien de temps ?</h2><div class="choix">${[5,10,15].map(d=>`<button class="btn ${choix.duree===d?'':'sec'}" data-d="${d}">${d} min</button>`).join('')}</div>
      <p class="muted" style="margin-bottom:0">Environ ${choix.duree*2} questions.</p>
      <label class="check"><input type="checkbox" id="rs" ${choix.ressenti?'checked':''}> Ajouter le ressenti « J'ai compris… » (facultatif)</label></div>
     <div class="err hide" id="er"></div>
     <button class="btn" id="go">🎲 Tirer les questions</button>`;
    app.innerHTML=h;
    document.getElementById('bk').onclick=()=>revisionEcran();
    app.querySelectorAll('[data-j]').forEach(c=>c.onchange=()=>{choix.j=[...app.querySelectorAll('[data-j]')].filter(x=>x.checked).map(x=>x.dataset.j)});
    app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{choix.duree=+b.dataset.d;dessiner()});
    document.getElementById('rs').onchange=e=>{choix.ressenti=e.target.checked};
    document.getElementById('go').onclick=()=>{
      if(!choix.j.length){const er=document.getElementById('er');er.textContent='Coche au moins une journée.';er.classList.remove('hide');return}
      tirerRevision(choix);
    };
  };
  dessiner(); haut();
}
function tirerRevision(choix){
  const js=JOURNEES.filter(j=>choix.j.includes(j.id));
  const pool=[].concat(...js.map(j=>j.banque.questions));
  const n=choix.duree*2;
  const z={ressenti:choix.ressenti?js.slice(-4).map(j=>`Ce qu'on a vu le ${j.titre.toLowerCase()}`):[],
    questions:tirerQuestions(js.map(j=>j.banque.questions),n)};
  // titre unique : « Révision du JJ/MM »
  let titre=`Révision du ${jjmm(Date.now())}`, k=2;
  while(Object.values(REVS).some(r=>r.titre===titre))titre=`Révision du ${jjmm(Date.now())} n°${k++}`;
  const r={id:nouvelId(),titre,journees:choix.j,cree:Date.now()};
  const sauver=async propre=>{
    const avant=revisionCourante(REVS);
    if(avant&&avant.ouvert){await envoyerForm(FORM_QUIZ,{[EQ.journee]:'revision',[EQ.statut]:'ferme',[EQ.contenu]:JSON.stringify({id:avant.id})});noterLocalRev(avant.id,{ouvert:false})}
    await enregistrerRevision(r,propre);
    return `✅ ${titre} enregistrée. Ouvre-la aux stagiaires quand tu veux.`;
  };
  const apres=m=>revisionEcran(m);
  apercu({tag:'Quiz de révision',titre,z,pool,retour:()=>nouvelleRevision(),
    info:`${js.map(j=>j.titre).join(', ')} · tirage mélangé.`,
    actions:[
      {txt:'✏️ Modifier avant d\'enregistrer',cls:'sec',f:zz=>editeur({tag:'Quiz de révision',titre,z:zz,retour:()=>revisionEcran(),reouvrir:()=>revisionEcran(),texteEnregistrer:'Enregistrer la révision',enregistrer:sauver,apres})},
      {txt:'💾 Enregistrer la révision',f:async zz=>{
        const p=nettoyer(zz);
        try{apres(await sauver(p))}catch(e){alert("L'enregistrement n'a pas marché. Vérifie ta connexion internet et réessaie.")}
      }}]});
}

  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Saisir une réponse papier</h1>

   <div id="manuel" class="${acceptes().length?'hide':''}"><label for="n">Nom</label><input type="text" id="n"><label for="p">Prénom</label><input type="text" id="p"></div></div>`;

    z.ressenti.forEach((t,i)=>{h+=`<div class="q">${esc(t)}</div><div class="scale" data-r="${i}">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`});h+=`</div>`}

  z.questions.forEach((q,i)=>{h+=`<div class="q">${i+1}. ${esc(q.q)}</div><div data-q="${i}">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`});
  h+=`</div><div class="card g"><h2>Difficulté signalée</h2><p class="muted" style="margin-top:0">Facultatif : recopie ce qu'il a écrit.</p><textarea id="dif"></textarea></div>
  <div class="err hide" id="er"></div><button class="btn" id="env">Envoyer cette feuille</button><div id="fin"></div>`;

  app.querySelectorAll('[data-q]').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{rep[+g.dataset.q]=+b.dataset.k;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))}));
  document.getElementById('env').onclick=async()=>{
    const er=document.getElementById('er'), nom=document.getElementById('n').value.trim(), prenom=document.getElementById('p').value.trim();
    if(!nom||!prenom){er.textContent='Choisis le stagiaire (ou écris son nom et son prénom).';er.classList.remove('hide');return}
    if(nom==='__obs__'||nom==='__roue__'){er.textContent='Ce nom est réservé.';er.classList.remove('hide');return}
    if(r.includes(0)||rep.includes(-1)){er.textContent='Remplis tout le ressenti et toutes les questions (si une case est vide sur la feuille, choisis la plus proche ou laisse la feuille de côté).';er.classList.remove('hide');return}
    er.classList.add('hide');
    const t=texteReponses(z,r,rep,true);
    const champs={[E.nom]:nom,[E.prenom]:prenom,[E.journee]:`${j.titre} – ${j.theme}`,[E.ressenti]:t.ressenti,[E.reponses]:t.reponses,[E.difficulte]:document.getElementById('dif').value.trim()};

}
function cibleRevision(r){

async function reponses(c){
  app.innerHTML=`<button class="back" id="bk">← Retour</button>
  <div class="tag">${esc(c.tag)}</div><h1>Réponses et résumé</h1><div id="zone"><p class="muted">Chargement des réponses…</p></div>`;

    document.getElementById('re').onclick=()=>reponses(c);return;
  }

function afficher(c,tests){
  const z=c.z, nq=z.questions.length;
  const iH=0,iN=1,iP=2,iJ=3,iR=4,iQ=5,iD=6;
  let rep=lignes.slice(1).filter(l=>!estObs(l)&&c.filtre(l));
  const nbTests=c.dateMin?rep.filter(l=>dateFR(l[iH])<c.dateMin).length:0;
  if(!tests&&c.dateMin)rep=rep.filter(l=>dateFR(l[iH])>=c.dateMin);
  // seulement les stagiaires acceptés (dès qu'il y en a au moins un)
  const acc=acceptes().filter(x=>!estTest(x)); let masques=0;
  if(acc.length&&!tests){const avant=rep.length;rep=rep.filter(l=>acc.some(a=>memeNom(a.prenom+' '+a.nom,(l[iP]||'')+' '+(l[iN]||''))));masques=avant-rep.length}
  const zone=document.getElementById('zone');
  let h='';
  if(masques)h+=`<p class="muted">${masques} réponse${masques>1?'s':''} de personnes non acceptées ou supprimées ${masques>1?'sont masquées':'est masquée'}.</p>`;
  if(nbTests)h+=`<label class="check"><input type="checkbox" id="tst" ${tests?'checked':''}> Afficher aussi les réponses de test ${esc(c.testTexte)} (${nbTests})</label>`;
  if(!rep.length){
    h+=`<div class="card"><h2>Pas encore de réponses</h2><p class="muted">Les réponses arrivent dès qu'un stagiaire envoie son quiz${c.dateMin?' (ou que tu saisis une feuille papier)':''}.</p><button class="btn sec" id="maj">🔄 Actualiser</button></div>`;
    zone.innerHTML=h;
    document.getElementById('maj').onclick=()=>reponses(c);
    if(nbTests)document.getElementById('tst').onchange=e=>afficher(c,e.target.checked);
    observations(c,null,zone);return;
  }
  const RR=rep.map(l=>lireReponses(l[iQ]));
  const res={};
  rep.forEach(l=>lireRessenti(l[iR]).forEach(x=>{if(x.n)(res[x.t]=res[x.t]||[]).push(x.n)}));
  const moy=Object.entries(res).map(([k,v])=>({k,m:v.reduce((a,b)=>a+b,0)/v.length}));
  const bonnes=Array(nq).fill(0), sansRep=Array(nq).fill(0);
  RR.forEach(R=>{for(let i=0;i<nq;i++){const e=R.etats[i];if(e&&e.etat==='ok')bonnes[i]++;if(e&&e.etat==='na')sansRep[i]++}});
  const diffs=rep.map(l=>({n:`${(l[iP]||'').trim()} ${(l[iN]||'').trim()}`.trim(),d:(l[iD]||'').trim()})).filter(x=>x.d);
  const scoreTot=RR.reduce((a,R)=>a+(R.score||0),0);
  const qTexte=(R,i)=>{const q=questionDe(R,i,z);return q?q.q:'Question '+(i+1)};

  h+=`<div class="card o" style="display:flex;justify-content:space-between;align-items:center">
     <div><div class="big">${rep.length}</div><div class="muted">stagiaire${rep.length>1?'s ont':' a'} répondu</div></div>
     <div style="text-align:right"><div class="big">${(scoreTot/rep.length).toFixed(1)}<span style="font-size:20px">/${nq}</span></div><div class="muted">score moyen</div></div></div>`;
  if(moy.length)h+=`<div class="card"><h2>Ressenti « J'ai compris… »</h2><p class="muted" style="margin-top:0">Moyenne sur 5</p>`+
     moy.map(x=>`<div class="row"><span>${esc(x.k)}</span><span class="pill ${classe(x.m,5)}">${x.m.toFixed(1)}</span></div>`).join('')+`</div>`;
  h+=`<div class="card"><h2>Les questions</h2><p class="muted" style="margin-top:0">Bonnes réponses${sansRep.some(Boolean)?' · ⏳ = pas répondu (temps fini)':''}</p>`+
     z.questions.map((q,i)=>`<div class="row"><span>${i+1}. ${esc(q.q)}${sansRep[i]?` <span style="color:var(--ja)">· ⏳ ${sansRep[i]}</span>`:''}</span><span class="pill ${classe(bonnes[i],rep.length)}">${bonnes[i]}/${rep.length}</span></div>`).join('')+`</div>`;
  h+=`<div class="card ${diffs.length?'r':'g'}"><h2>Difficultés signalées</h2>`+
     (diffs.length?diffs.map(x=>`<div class="stag"><b>${esc(x.n)}</b><div class="d">${esc(x.d)}</div></div>`).join(''):`<p class="muted" style="margin:0">Aucune difficulté signalée.</p>`)+`</div>`;
  h+=`<div class="card"><h2>Détail par stagiaire</h2>`+rep.map((l,n)=>{
       const R=RR[n], sc=R.score||0;
       const rs=lireRessenti(l[iR]).map(x=>x.n||'-').join(' · ');
       const erreurs=R.etats.map((e,i)=>!e?'':e.etat==='ko'?`<div class="d">❌ ${esc(qTexte(R,i))}<br><span style="color:var(--mute)">→ a répondu : ${esc(e.rep)}</span></div>`
         :e.etat==='na'?`<div class="d">⏳ ${esc(qTexte(R,i))}<br><span style="color:var(--mute)">→ pas répondu (temps fini)</span></div>`:'').join('');
       const pap=R.papier?' <span class="muted">(papier)</span>':'';
       return `<div class="stag"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(((l[iP]||'')+' '+(l[iN]||'')).trim())}${pap}</b><span class="pill ${classe(sc,nq)}">${sc}/${nq}</span></div>
       ${rs?`<div class="d">Ressenti : ${esc(rs)}</div>`:''}${erreurs}</div>`}).join('')+
     `<button class="btn sec" id="maj">🔄 Actualiser les réponses</button></div>`;
  zone.innerHTML=h;
  document.getElementById('maj').onclick=()=>reponses(c);
  if(nbTests)document.getElementById('tst').onchange=e=>afficher(c,e.target.checked);
  const eleves=rep.map((l,n)=>{
    const R=RR[n], nom=((l[iP]||'')+' '+(l[iN]||'')).trim();
    const pts=[];
    R.etats.forEach((e,i)=>{if(!e)return;
      if(e.etat==='ko')pts.push(`s'est trompé(e) sur « ${qTexte(R,i)} » (a répondu : ${e.rep})`);
      if(e.etat==='na')pts.push(`n'a pas répondu à « ${qTexte(R,i)} » (temps fini)`)});
    lireRessenti(l[iR]).forEach(x=>{if(x.n&&x.n<=2)pts.push(`ressenti faible sur « ${x.t} » (${x.n}/5)`)});
    const d=(l[iD]||'').trim(); if(d)pts.push(`a écrit : « ${d} »`);
    return {nom,pts};
  }).filter(x=>x.pts.length);
  observations(c,{n:rep.length,moy,bonnes,sansRep,diffs,scoreTot,eleves},zone);
}

function programmerSauvegarde(cle,ms){clearTimeout(OBS_MINUTEURS[cle]);OBS_MINUTEURS[cle]=setTimeout(()=>sauverObsEnLigne(cle),ms||3000)}
async function sauverObsEnLigne(cle){
  if(!cle)return;

  const v=lire('obs_'+cle,''), deja=lire('obs_envoye_'+cle,null);
  if(deja!==null?deja===v:!v.trim())return; // rien de nouveau
  etatObs(cle,'☁️ Sauvegarde en ligne…');

    await envoyerForm(FORM,{[E.nom]:'__obs__',[E.prenom]:cle,[E.journee]:'Observations',[E.ressenti]:'',[E.reponses]:'',[E.difficulte]:v});

}

  else mb.onclick=()=>{if(DICTEE.voulu&&DICTEE.cle===cle)arreterDictee();else demarrerDictee(cle,c.titre)};
  majBoutonMic();
  let mode=lire('mode','complet');
  const majModes=()=>document.querySelectorAll('#modes .opt').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  document.querySelectorAll('#modes .opt').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ecrire('mode',mode);majModes()});
  majModes();
  document.getElementById('res').onclick=()=>{
    document.getElementById('resume').value=resume(c,st,obs.value.trim(),mode);
    const rb=document.getElementById('rbox');rb.classList.remove('hide');rb.scrollIntoView({behavior:'smooth'});
  };
  document.getElementById('wa').onclick=async()=>{
    const txt=document.getElementById('resume').value;
    if(!await copier(txt)){const t=document.getElementById('resume');t.select();try{document.execCommand('copy')}catch(_){}}
    document.getElementById('cp').classList.remove('hide');
    setTimeout(()=>ouvrirWhatsApp(txt,true),600);
  };
}

function resume(c,st,obs,mode){
  mode=mode||'complet';
  const z=c.z;
  let t=`📋 Bilan CQP Cours collectifs – ${c.titre}\n${c.sousTitre}\n`;
  if(mode==='obs'){t+=obs?`\n👀 Mes observations :\n${obs}\n`:`\n(Pas d'observations écrites.)\n`;return t+`\nHamid`}
  if(!st){t+=`\nPas de réponses au quiz pour l'instant.\n`}
  else{
    t+=`\n👥 ${st.n} stagiaire${st.n>1?'s ont':' a'} répondu au quiz · score moyen ${(st.scoreTot/st.n).toFixed(1)}/${z.questions.length}\n`;
    const bien=st.moy.filter(x=>x.m>=4), revoir=st.moy.filter(x=>x.m<3.5), moyen=st.moy.filter(x=>x.m>=3.5&&x.m<4);
    if(bien.length)t+=`\n✅ Bien compris :\n`+bien.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(moyen.length)t+=`\n🟡 Compris en partie :\n`+moyen.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(revoir.length)t+=`\n🔴 À retravailler :\n`+revoir.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    const qrat=z.questions.map((q,i)=>({q:q.q,b:st.bonnes[i],nr:(st.sansRep||[])[i]||0})).filter(x=>x.b<st.n);
    t+=`\n📝 Questions :\n`+(qrat.length?qrat.map(x=>`• ${x.q} : ${x.b}/${st.n} bonnes réponses${x.nr?` (⏳ ${x.nr} sans réponse, temps fini)`:''}`).join('\n'):`• Toutes les questions réussies par tout le monde`)+'\n';
    if(st.eleves&&st.eleves.length)t+=`\n👤 Points de vigilance par stagiaire :\n`+st.eleves.map(x=>`• ${x.nom} : ${x.pts.join(' · ')}`).join('\n')+'\n';
    else t+=`\n👤 Aucun point de vigilance particulier chez les stagiaires.\n`;
  }
  if(mode==='complet'&&obs)t+=`\n👀 Mes observations :\n${obs}\n`;
  t+=`\nHamid`;
  return t;
}

// ======= Dictée : elle ne s'arrête que quand tu touches « Arrêter » =======
// Elle continue quand tu changes d'écran (barre rouge en bas) et le texte va dans les
// observations de la journée où tu as commencé.
const DICTEE={voulu:false,coupe:false,rec:null,cle:null,label:'',premier:true,erreurs:0,minuteur:null};
function SRdispo(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function demarrerDictee(cle,label){
  if(DICTEE.voulu)arreterDictee();
  Object.assign(DICTEE,{voulu:true,coupe:false,cle,label,premier:true,erreurs:0});
  lancerReco(); barreDictee(); majBoutonMic();
}
function lancerReco(){
  const SR=SRdispo(); let rec;
  try{rec=new SR()}catch(e){DICTEE.voulu=false;barreDictee();majBoutonMic();return}
  rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{
    let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=(t?' ':'')+String(e.results[i][0].transcript).trim();
    if(t){DICTEE.erreurs=0;ajouterTexteObs(DICTEE.cle,t)}
  };
  rec.onerror=e=>{
    const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed'||c==='audio-capture'){
      DICTEE.voulu=false;
      const mi=document.getElementById('micinfo');if(mi){mi.textContent="Le micro n'est pas autorisé. Tu peux utiliser le micro 🎤 de ton clavier.";mi.classList.remove('hide')}
    }else if(c==='network')DICTEE.erreurs++;
    // « no-speech » (silence) et « aborted » : on relance simplement (voir onend)
  };
  rec.onend=()=>{
    if(DICTEE.rec!==rec)return;
    DICTEE.rec=null;
    if(DICTEE.voulu&&!DICTEE.coupe){
      if(document.hidden){DICTEE.coupe=true;barreDictee();return}
      const attente=DICTEE.erreurs?Math.min(8000,1000*DICTEE.erreurs):150;
      clearTimeout(DICTEE.minuteur);
      DICTEE.minuteur=setTimeout(()=>{if(DICTEE.voulu&&!DICTEE.coupe&&!DICTEE.rec)lancerReco()},attente);
    }else{barreDictee();majBoutonMic()}
  };
  DICTEE.rec=rec;
  try{rec.start()}catch(e){DICTEE.rec=null;DICTEE.erreurs++;clearTimeout(DICTEE.minuteur);DICTEE.minuteur=setTimeout(()=>{if(DICTEE.voulu&&!DICTEE.coupe&&!DICTEE.rec)lancerReco()},1000)}
}
function arreterDictee(){
  const cle=DICTEE.cle;
  DICTEE.voulu=false;DICTEE.coupe=false;clearTimeout(DICTEE.minuteur);
  const r=DICTEE.rec;DICTEE.rec=null;
  if(r){try{r.stop()}catch(e){}}
  if(cle)sauverObsEnLigne(cle);
  barreDictee();majBoutonMic();
}
function reprendreDictee(){DICTEE.coupe=false;DICTEE.premier=true;DICTEE.erreurs=0;lancerReco();barreDictee();majBoutonMic()}
function ajouterTexteObs(cle,t){
  const cur=lire('obs_'+cle,'');
  const v=cur.trim()?cur.replace(/\s*$/,'')+(DICTEE.premier?'\n':' ')+t:t;
  DICTEE.premier=false;
  ecrire('obs_'+cle,v);
  const ta=document.getElementById('obs');
  if(ta&&ta.dataset.cle===cle)ta.value=v;
  programmerSauvegarde(cle);
}
function majBoutonMic(){
  const mb=document.getElementById('mic'), ta=document.getElementById('obs');
  if(!mb||!ta)return;
  const ici=DICTEE.voulu&&DICTEE.cle===ta.dataset.cle;
  mb.textContent=ici?(DICTEE.coupe?'🎤 Reprendre la dictée':'⏹️ Arrêter la dictée'):'🎤 Dicter';
  mb.classList.toggle('rec',ici&&!DICTEE.coupe);
  if(ici&&DICTEE.coupe)mb.onclick=reprendreDictee;
  else if(SRdispo())mb.onclick=()=>{if(DICTEE.voulu&&DICTEE.cle===ta.dataset.cle)arreterDictee();else demarrerDictee(ta.dataset.cle,OBS_LABELS[ta.dataset.cle]||'')};
}
function barreDictee(){
  let b=document.getElementById('barre-dictee');
  if(!b){b=document.createElement('div');b.id='barre-dictee';document.body.appendChild(b)}
  document.body.classList.toggle('avec-barre',DICTEE.voulu);
  if(!DICTEE.voulu){b.className='hide';b.innerHTML='';return}
  if(DICTEE.coupe){
    b.className='coupe';
    b.innerHTML=`<button id="bd-rep">🎤 Reprendre la dictée<small>Le micro a été coupé · ${esc(DICTEE.label)}</small></button><button class="sec" id="bd-stop">Arrêter</button>`;
    document.getElementById('bd-rep').onclick=reprendreDictee;
  }else{
    b.className='';
    b.innerHTML=`<button id="bd-stop">🔴 Dictée en cours – Arrêter<small>${esc(DICTEE.label)}</small></button>`;
  }
  document.getElementById('bd-stop').onclick=arreterDictee;
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)return;
  // Android coupe le micro quand on quitte l'appli : le texte déjà dicté est gardé
  if(DICTEE.voulu&&!DICTEE.coupe){
    DICTEE.coupe=true;const r=DICTEE.rec;DICTEE.rec=null;
    if(r){try{r.abort()}catch(e){}}
    barreDictee();majBoutonMic();
  }
  Object.keys(OBS_MINUTEURS).forEach(sauverObsEnLigne);
  if(DICTEE.cle)sauverObsEnLigne(DICTEE.cle);
});

// ======= 📋 Mes exercices (formateur) : renforcement, étirements, méthodes — partage partie par partie =======
// Ce que les stagiaires voient (clés renfo.bas, etir.haut, meth…). Google met quelques minutes :
// pendant 15 min ce téléphone se fie à ce que tu viens de décider.
let FICHES_OUV=[];
function fichesChargerLocal(g){
  FICHES_OUV=(g&&g.fiches&&g.fiches.ouverts)||[];
  const l=lire('local_fiches',null);
  if(l&&Array.isArray(l.ouverts)&&Date.now()-l.at<15*60*1000)FICHES_OUV=l.ouverts;
}
async function fichesChanger(cle,montrer){
  const avant=FICHES_OUV.slice();
  const n=montrer?[...new Set(FICHES_OUV.concat(cle))]:FICHES_OUV.filter(x=>x!==cle);
  FICHES_OUV=n; ecrire('local_fiches',{ouverts:n,at:Date.now()});
  try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:'fiches',[EQ.statut]:'etat',[EQ.contenu]:JSON.stringify({ouverts:n})});return true}
  catch(e){FICHES_OUV=avant;ecrire('local_fiches',{ouverts:avant,at:Date.now()});return false}
}
function mesExercices(msg){

  <p class="muted" style="margin-top:0">Touche une catégorie. Dans chaque partie, tu choisis ce que les stagiaires peuvent voir pour réviser.</p>`;

    h+=`<button class="btn sec" data-fcat="${k}" style="text-align:left">${c.emoji} ${esc(c.titre)}<br><span class="muted" style="font-weight:400;font-size:14px">${o?`👀 ${o===t?(t>1?'tout est montré':'montré'):o+' partie'+(o>1?'s':'')+' sur '+t+' montrée'+(o>1?'s':'')} aux stagiaires`:'🙈 caché aux stagiaires'}</span></button>`});

function ecranFiches(cat,msg,ouverte){
  const C=FICHES_CATS[cat];
  const tg=cle=>{const on=FICHES_OUV.includes(cle);
    return `<button class="btn small ${on?'':'sec'} fx-tg" data-tg="${cle}" data-on="${on?1:0}">${on?'👀 Montré aux stagiaires · toucher pour cacher':'🙈 Caché aux stagiaires · toucher pour montrer'}</button>`};
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">📋 Mes exercices</div><h1>${C.emoji} ${esc(C.titre)}</h1>

// ---- le hasard ----
function hasard(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function melangerH(a){a=a.slice();for(let i=a.length-1;i>0;i--){const k=hasard(i+1);[a[i],a[k]]=[a[k],a[i]]}return a}
// Répartit k cases entre des « unités » (stagiaires ou équipes) :
// assez de cases → aucun doublon ; sinon équilibré (chaque case sort autant de fois, à une près).
// o.fixe {u:case} (choisi par toi), o.interdit {u:Set} (déjà eu avant), o.prec [nb de sorties avant], o.base [déjà pris ici], o.libre (au hasard pur)
function repartir(units,k,o){
  o=o||{};const fixe=o.fixe||{},interdit=o.interdit||{},prec=o.prec||[],res={};
  if(!k||!units.length)return res;
  const tous=[...Array(k).keys()], ok=(u,c)=>!(interdit[u]&&interdit[u].has(c));
  units.forEach(u=>{if(fixe[u]!=null&&fixe[u]<k)res[u]=fixe[u]});
  const libres=melangerH(units.filter(u=>res[u]==null));
  if(o.libre){libres.forEach(u=>{const p=tous.filter(c=>ok(u,c)),q=p.length?p:tous;res[u]=q[hasard(q.length)]});return res}
  const cnt=tous.map(c=>(o.base&&o.base[c])||0);Object.values(res).forEach(c=>cnt[c]++);
  const slots=[];
  libres.forEach(()=>{
    const min=Math.min(...cnt);let cand=tous.filter(c=>cnt[c]===min);
    const pm=Math.min(...cand.map(c=>prec[c]||0));cand=cand.filter(c=>(prec[c]||0)===pm);
    const c=cand[hasard(cand.length)];cnt[c]++;slots.push(c);
  });
  // on donne les cases en évitant ce que chacun a déjà eu (appariement)
  const match=Array(slots.length).fill(-1);
  const essayer=(ui,vu)=>{for(const s of melangerH(slots.map((_,i)=>i))){if(vu[s]||!ok(libres[ui],slots[s]))continue;vu[s]=1;if(match[s]<0||essayer(match[s],vu)){match[s]=ui;return true}}return false};
  const sans=[];libres.forEach((u,ui)=>{if(!essayer(ui,{}))sans.push(ui)});
  match.forEach((ui,s)=>{if(ui>=0)res[libres[ui]]=slots[s]});
  const restes=slots.filter((_,s)=>match[s]<0);sans.forEach((ui,j)=>{res[libres[ui]]=restes[j]});
  return res;
}
function tailleEquipes(n){
  const t=Math.max(2,+RC.taille||4), f=nb=>{nb=Math.max(1,nb);const b=Math.floor(n/nb),r=n%nb;return Array.from({length:nb},(_,i)=>b+(i<r?1:0))};
  return {plus:f(Math.ceil(n/t)),moins:f(Math.floor(n/t)),exact:n%t===0};
}
function texteTailles(ts){const et=ts.length>1?ts.slice(0,-1).join(', ')+' et '+ts[ts.length-1]:String(ts[0]);return `${ts.length} équipe${ts.length>1?'s':''} (${et} stagiaires)`}
function taillesChoisies(n){const t=tailleEquipes(n);return RC.variante==='moins'&&!t.exact?t.moins:t.plus}
function formerEquipes(ids,tailles){const m=melangerH(ids);let p=0;return tailles.map((t,i)=>{const e={n:LETTRES[i]||String(i+1),ids:m.slice(p,p+t)};p+=t;return e})}
// Une manche : pour chaque roue, un résultat (liste de cases) par stagiaire
function tirerManche(T,ids,cibles,avant){
  const M={};ids.forEach(s=>M[s]=T.roues.map(()=>[]));
  T.roues.forEach((r,k)=>{
    const n=r.cases.length;if(!n)return;
    const prec=Array(n).fill(0), interdit={};
    avant.forEach(A=>Object.entries(A).forEach(([s,v])=>((v&&v[k])||[]).forEach(i=>{prec[i]++;(interdit[s]=interdit[s]||new Set()).add(i)})));
    const fixe={};ids.forEach(s=>{const c=cibles[s]&&cibles[s][k];if(c!=null&&c<n)fixe[s]=c});
    if(T.eq&&r.mode==='equipe'){
      const fx={},it={};
      T.eq.forEach(e=>e.ids.forEach(s=>{if(fixe[s]!=null)fx[e.n]=fixe[s];if(interdit[s])interdit[s].forEach(i=>(it[e.n]=it[e.n]||new Set()).add(i))}));
      const R=repartir(T.eq.map(e=>e.n),n,{fixe:fx,interdit:it,prec,libre:!r.sansDoublon});
      T.eq.forEach(e=>e.ids.forEach(s=>{if(M[s])M[s][k]=[R[e.n]]}));
    }else if(T.eq){
      const glob=Array(n).fill(0);
      melangerH(T.eq).forEach(e=>{
        const membres=e.ids.filter(s=>M[s]);
        const R=repartir(membres,n,{fixe,interdit,prec:prec.map((p,i)=>p*1000+glob[i]),libre:!r.sansDoublon});
        membres.forEach(s=>{M[s][k]=[R[s]];glob[R[s]]++});
        if(r.type==='partie'&&T.deuxParties&&r.sansDoublon&&membres.length&&membres.length<n){
          const pris=new Set(membres.map(s=>R[s])), reste=melangerH([...Array(n).keys()].filter(i=>!pris.has(i))), ordre=melangerH(membres);
          reste.forEach((i,j)=>{const s=ordre[j%ordre.length];M[s][k].push(i);M[s][k].sort((a,b)=>a-b)});
        }
      });
    }else{
      const R=repartir(ids,n,{fixe,interdit,prec,libre:!r.sansDoublon});
      ids.forEach(s=>M[s][k]=[R[s]]);
    }
  });
  return M;
}
function manches(T){const nb=Math.max(0,...Object.values(T.res).map(v=>v.length));return Array.from({length:nb},(_,m)=>{const A={};Object.entries(T.res).forEach(([s,v])=>{if(v[m])A[s]=v[m]});return A})}
// 🎯 choisis avant l'activation → {stagiaire:{numéro de roue: numéro de case}}
function ciblesIndex(T,ids){
  const out={};
  ids.forEach(s=>{const c=RC.cibles[s];if(!c)return;
    T.roues.forEach((r,k)=>{const key=c[r.type];if(key==null)return;const i=r.cases.findIndex(x=>(x.f||roueCle(x.t))===key);if(i>=0)(out[s]=out[s]||{})[k]=i})});
  return out;
}
function construireTirage(){
  const ids=acceptes().map(x=>x.id);
  const roues=RC.choisies.map(type=>({type,emoji:roueType(type).emoji,titre:titreRoue(type),
    cases:casesCochees(type).map(c=>c.f?{t:c.t,f:c.f}:{t:c.t}),sansDoublon:sansDoublon(type),mode:RC.equipes?modeRoue(type):'stag'})).filter(r=>r.cases.length);
  const T={id:nouvelId(),v:1,at:Date.now(),actif:true,fiches:!!RC.fiches,roues,eq:null,res:{}};
  if(RC.equipes&&ids.length>1){T.eq=formerEquipes(ids,taillesChoisies(ids.length));if(RC.deuxParties)T.deuxParties=true}
  const cib=ciblesIndex(T,ids), M=tirerManche(T,ids,cib,[]);
  ids.forEach(s=>T.res[s]=[M[s]]);
  const mq={};Object.entries(cib).forEach(([s,v])=>Object.keys(v).forEach(k=>(mq[s]=mq[s]||{})['0:'+k]=1));
  return {T,mq};
}
function nouveauxSansResultat(T){return acceptes().filter(x=>!T.res[x.id])}
function ajouterNouveaux(T,nouv){
  const nb=Math.max(1,...Object.values(T.res).map(v=>v.length));
  nouv.forEach(s=>{
    if(T.eq&&T.eq.length){const min=Math.min(...T.eq.map(e=>e.ids.length)),c=T.eq.filter(e=>e.ids.length===min);c[hasard(c.length)].ids.push(s)}
    T.res[s]=[];
    for(let m=0;m<nb;m++){
      const res=T.roues.map((r,k)=>{
        const n=r.cases.length;if(!n)return [];
        const E_=T.eq&&T.eq.find(e=>e.ids.includes(s));
        const groupe=(E_?E_.ids:Object.keys(T.res)).filter(x=>x!==s&&T.res[x]&&T.res[x][m]);
        if(E_&&r.mode==='equipe'&&groupe.length)return T.res[groupe[0]][m][k].slice();
        const base=Array(n).fill(0);groupe.forEach(x=>(T.res[x][m][k]||[]).forEach(i=>base[i]++));
        const it=new Set();T.res[s].forEach(v=>(v[k]||[]).forEach(i=>it.add(i)));
        return [repartir([s],n,{base,interdit:{[s]:it},libre:!r.sansDoublon})[s]];
      });
      T.res[s].push(res);
    }
  });
}
// Choisir le résultat d'un stagiaire après coup (dernière manche) : échange avec quelqu'un qui n'a pas encore lancé
function choisirApres(T,X,k,c){
  const m=T.res[X].length-1, r=T.roues[k], L=(ROUE.lances[T.id]||{}), aLance=s=>(L[s]||0)>=m+1, nom=s=>STAG[s]?STAG[s].prenom:'?';
  const ancien=T.res[X][m][k].slice(), notes=[];
  if(ancien.length===1&&ancien[0]===c)return notes;
  if(T.eq&&r.mode==='equipe'){
    const e=T.eq.find(e=>e.ids.includes(X));
    if(r.sansDoublon){const autre=T.eq.find(f=>f!==e&&f.ids.some(s=>T.res[s]&&T.res[s][m]&&(T.res[s][m][k]||[]).includes(c)));
      if(autre){if(autre.ids.some(aLance))notes.push(`L'équipe ${autre.n} a aussi cette case (elle a déjà lancé la roue).`);else autre.ids.forEach(s=>{if(T.res[s]&&T.res[s][m])T.res[s][m][k]=ancien.slice()})}}
    e.ids.forEach(s=>{if(T.res[s]&&T.res[s][m])T.res[s][m][k]=[c]});
    if(e.ids.some(aLance))notes.push(`Quelqu'un de l'équipe ${e.n} a déjà lancé la roue : il verra le nouveau résultat en rouvrant la roue.`);
  }else{
    const groupe=T.eq?(T.eq.find(e=>e.ids.includes(X))||{ids:[]}).ids:Object.keys(T.res);
    const neuf=[c].concat(ancien.slice(1).filter(i=>i!==c));
    if(r.sansDoublon){
      const tient=groupe.filter(s=>s!==X&&T.res[s]&&T.res[s][m]&&(T.res[s][m][k]||[]).includes(c));
      const Y=tient.find(s=>!aLance(s)&&T.res[s][m][k].length===1);
      if(Y)T.res[Y][m][k]=[ancien[0]];
      else if(tient.length)notes.push(`${tient.map(nom).join(', ')} a aussi cette case (déjà lancé) : ce sera un doublon.`);
    }
    T.res[X][m][k]=neuf;
    if(aLance(X))notes.push(`${nom(X)} a déjà lancé la roue : il verra son nouveau résultat en rouvrant la roue.`);
  }
  return notes;
}
