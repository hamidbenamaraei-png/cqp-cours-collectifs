<script>
// ======= Réglages propres au formateur =======
// Empreinte du code d'accès (le code lui-même n'est pas écrit ici)
const CODE_HASH = '9de007567a93e86a677452886d8b9326ecf5a0726172be9c57b017546bb21146';
// Lien du groupe WhatsApp des formateurs : vide = WhatsApp demande à qui envoyer
const WHATSAPP_GROUPE = '';
// Tableau des réponses des stagiaires (publié en CSV). Il n'est lu QUE sur cette page :
// les stagiaires n'y ont pas accès (il contient les réponses de tout le monde et tes observations).
const CSV_REPONSES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0Q6CmVaNRB_wzqusRfYaLQjon3iYJ9qjfPRGaimeo687QAkNxIeem81Mf_HeHGIdTqe3AsVerGOnx/pub?gid=1231707561&single=true&output=csv';

// ======= Outils =======
function lire(k,d){try{const v=localStorage.getItem('cqpf_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function ecrire(k,v){try{localStorage.setItem('cqpf_'+k,JSON.stringify(v))}catch(e){}}
const app = document.getElementById('app');
function haut(){window.scrollTo(0,0)}
async function empreinte(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cqp-cc:'+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function classe(v,max){const p=max?v/max:0;return p>=0.8?'p-ok':p>=0.6?'p-moy':'p-ko'}
function ouvrirWhatsApp(txt,groupe){
  const url=(groupe&&WHATSAPP_GROUPE)?WHATSAPP_GROUPE:('https://wa.me/?text='+encodeURIComponent(txt));
  window.location.href=url;
}
async function copier(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){return false}}
const copie = x => JSON.parse(JSON.stringify(x));
// Les lignes « __obs__ » du tableau des réponses sont tes observations, jamais un stagiaire
function estObs(l){return (l[1]||'').trim()==='__obs__'}
// Les lignes « __roue__ » gardent tes 🎯 de la roue (jamais un stagiaire non plus)
function estRoue(l){return (l[1]||'').trim()==='__roue__'}
// 29/10 : les lignes « __cours__ » sont les cours préparés envoyés par les stagiaires (📝 Je prépare mon cours)
function estCours(l){return (l[1]||'').trim()==='__cours__'}
let COURS_LIGNES=[];

// ======= Le tableau des réponses (les observations sont mises à part) =======
let lignes=[], OBS=[];
async function chargerReponses(){
  const L=await lireCSV(CSV_REPONSES);
  lignes=L.length?[L[0]].concat(L.slice(1).filter(l=>!estObs(l)&&!estRoue(l)&&!estRetour(l)&&!estNote(l)&&!estCours(l))):[];
  COURS_LIGNES=L.slice(1).filter(estCours);
  NOTES=L.slice(1).filter(estNote).map(l=>{try{return JSON.parse(l[6]||'')}catch(e){return null}}).filter(x=>x&&x.nid);
  RETOURS=L.slice(1).filter(estRetour).map(l=>{try{return JSON.parse(l[6]||'')}catch(e){return null}}).filter(x=>x&&x.sid&&x.texte);
  OBS=L.slice(1).filter(estObs);
  MARQUES_EN_LIGNE=L.slice(1).filter(estRoue);
  return lignes;
}

// ======= État des quiz (tableau Google + ce que tu viens de faire sur ce téléphone) =======
// Le tableau Google met quelques minutes à se mettre à jour : pendant 15 min, ce téléphone
// se fie à ce que tu viens d'enregistrer.
let ETAT = null, STAG = {}, REVS = {}, DEROULES = {}, MINUTEUR_MONTRE = false, PREP_COURS = null, APPAREILS = {};
// 06/11 : autres formateurs. Hamid = celui qui a le code CODE_HASH (le patron). Les autres : liste en ligne.
let INVITE_F = '', FORMATEURS = [], FORMATEURS_LUS = false, PARTAGE = Object.assign({},PARTAGE_DEFAUT), QUIZF = {};
// 06/11 : « Voir l'espace formateur » : Hamid voit l'espace comme un autre formateur (aperçu, rien n'est envoyé)
let APERCU=false;
const vraiAdmin=()=>lire('ok','')===CODE_HASH;
function estAdmin(){return !APERCU&&vraiAdmin()}
function moiF(){if(APERCU)return {id:'apercu',prenom:'Formateur',nom:'',h:''};const q=lire('qui',null);return q&&q.id&&q.h&&q.h===lire('ok','')?q:null}
function apercuFormateur(on){APERCU=!!on&&vraiAdmin();let b=document.getElementById('apercu-b');
  if(APERCU&&!b){b=document.createElement('div');b.id='apercu-b';b.style.cssText='position:sticky;top:0;z-index:60;background:var(--or,#f97316);color:#111;padding:10px 12px;border-radius:0 0 12px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700;margin:-8px 0 12px';
    b.innerHTML='<span>👀 Aperçu : ce que voient les formateurs</span><button class="btn small" style="margin:0;flex:none;width:auto;background:#111;color:#fff" id="apercu-x">← Revenir à mon espace</button>';
    app.parentNode.insertBefore(b,app);b.querySelector('#apercu-x').onclick=()=>{apercuFormateur(false);accueil();haut()}}
  if(!APERCU&&b)b.remove()}
function peut(k){return estAdmin()||!!PARTAGE[k]}
// 06/11 : « seulement ce que j'ai montré aux stagiaires » (si « tout » n'est pas coché)
const seulMontre=()=>!estAdmin()&&!PARTAGE.cours&&!!PARTAGE.coursSt, peutCours=()=>peut('cours')||!!PARTAGE.coursSt;
function retirerAcces(){ecrire('ok','');ecrire('qui',null);marqueHamid();ecranCode("Ton accès à l'espace formateur n'est plus actif. Si c'est une erreur, parles-en à Hamid.")}
async function chargerEtat(){
  let g=null;
  try{g=await etatGeneral()}catch(e){g=null}
  if(g){ETAT=g.quiz;STAG=g.stagiaires;REVS=g.revisions||{}}
  else{ETAT={};STAG={};REVS={};JOURNEES.forEach(j=>ETAT[j.id]={quiz:j.quiz,ouvert:false,horsLigne:true})}
  DEROULES=(g&&g.deroules)||{};
  APPAREILS=(g&&g.appareils)||{};
  MINUTEUR_MONTRE=!!(g&&g.minuteur&&g.minuteur.montrer);
  {const lm=lire('local_minuteur',null);if(lm&&typeof lm.montrer==='boolean'&&Date.now()-lm.at<15*60*1000)MINUTEUR_MONTRE=lm.montrer}
  PREP_COURS=crPrep(g);
  FORMATEURS=(g&&g.formateurs)||[]; FORMATEURS_LUS=!!(g&&g.formateursLus);
  PARTAGE=Object.assign({},PARTAGE_DEFAUT,(g&&g.partage)||{}); QUIZF=(g&&g.quizF)||{};
  {const lf=lire('local_formateurs',null);if(lf&&Array.isArray(lf.liste)&&Date.now()-lf.at<15*60*1000){FORMATEURS=lf.liste;FORMATEURS_LUS=true}}
  INVITE_F=(g&&g.inviteF)||'';{const li=lire('local_invite',null);if(li&&Date.now()-li.at<15*60*1000)INVITE_F=li.p}
  // 06/11 : formateur qui vient de s'inscrire avec le lien : accès tout de suite, le temps que Google se mette à jour
  {const ins=lire('local_inscrit',null);if(ins&&ins.f&&Date.now()-ins.at<20*60*1000&&!FORMATEURS.some(f=>f.id===ins.f.id))FORMATEURS=FORMATEURS.concat([ins.f])}
  {const lp=lire('local_partage',null);if(lp&&lp.v&&Date.now()-lp.at<15*60*1000)PARTAGE=Object.assign({},PARTAGE_DEFAUT,lp.v)}
  {const lq=lire('local_quizf',{});Object.entries(lq).forEach(([id,v])=>{if(Date.now()-v.at>=15*60*1000)return;
    if(v.supprime){delete QUIZF[id];return}const c=Object.assign({},v);delete c.at;QUIZF[id]=Object.assign(QUIZF[id]||{id,ouvert:false,duree:0},c)});

function ecranCode(msg){
  app.innerHTML=`<div class="tag">CQP Instructeur Fitness – Cours collectifs</div><h1>Espace formateur</h1>
  ${msg?`<div class="card r nopli"><p style="margin:0">${esc(msg)}</p></div>`:''}

  <div class="card o"><h2>Code d'accès</h2>
   <input type="password" id="c" inputmode="numeric" autocomplete="off" placeholder="••••••">
   <button class="link" id="lettres">🔤 Mon code a des lettres</button>
   <div class="err hide" id="er">Code incorrect.</div>
   <button class="btn" id="go">Entrer</button>
   <p class="muted" style="margin-top:14px"><a href="./" style="color:var(--mute)">← Retour à l'espace stagiaires</a></p></div>`;
  const sl=document.getElementById('sanslien');
  if(sl)sl.onclick=()=>{LIEN_PC=null;(estAdmin()||moiF())?demarrer():ecranCode()};
  document.getElementById('lettres').onclick=e=>{const c=document.getElementById('c');c.setAttribute('inputmode','text');e.currentTarget.classList.add('hide');c.focus()};
  let enCours=false;
  const go=async()=>{
    if(enCours)return;
    const er=document.getElementById('er'), bt=document.getElementById('go');
    const bl=lire('bloque',{n:0,jusqua:0});
    if(Date.now()<bl.jusqua){er.textContent=`Trop d'essais. Réessaie dans ${Math.ceil((bl.jusqua-Date.now())/60000)} min.`;er.classList.remove('hide');return}
    const code=document.getElementById('c').value.trim();
    if(!code){er.textContent='Écris ton code.';er.classList.remove('hide');return}
    const h=await empreinte(code);
    const entrer=qui=>{ecrire('bloque',{n:0,jusqua:0});ecrire('ok',h);ecrire('qui',qui);LIEN_PC?appliquerLienPC():demarrer()};
    if(h===CODE_HASH)return entrer(null);
    // un autre formateur ? (liste en ligne)
    enCours=true;bt.disabled=true;bt.textContent='⏳ Vérification…';
    let g=null;try{g=await etatGeneral()}catch(e){g=null}
    enCours=false;bt.disabled=false;bt.textContent='Entrer';
    if(!g){er.textContent="Je n'arrive pas à vérifier ton code. Vérifie ta connexion internet et réessaie.";er.classList.remove('hide');return}
    const f=(g.formateurs||[]).find(x=>x.h===h);
    if(f)return entrer({id:f.id,prenom:f.prenom,nom:f.nom,h});
    bl.n++;
    if(bl.n>=5){const min=Math.pow(2,Math.min(bl.n-5,10));bl.jusqua=Date.now()+min*60000;er.textContent=`Code incorrect. Trop d'essais : réessaie dans ${min} min.`}

}

// Enregistré dans « Mes quiz CQP » (Journée = coursprep, Statut = etat) : {montrer, choisi, modeles}. La dernière ligne gagne.
async function enregistrerPrepCours(P){
  const v={montrer:!!P.montrer,choisi:P.choisi,modeles:P.modeles};
  await envoyerForm(FORM_QUIZ,{[EQ.journee]:'coursprep',[EQ.statut]:'etat',[EQ.contenu]:JSON.stringify(v)});
  PREP_COURS=JSON.parse(JSON.stringify(v));ecrire('local_coursprep',Object.assign({at:Date.now()},v));
}
let CRP_TRAVAIL=null; // modèles en cours de modification (pas encore enregistrés)
function coursPrepEcran(msg){
  if(!estAdmin())return accueil(); // 06/11 : écran d'Hamid seulement
  if(!CRP_TRAVAIL)CRP_TRAVAIL=copie({choisi:PREP_COURS.choisi,modeles:PREP_COURS.modeles});
  const W=CRP_TRAVAIL, modif=JSON.stringify({choisi:W.choisi,modeles:W.modeles})!==JSON.stringify({choisi:PREP_COURS.choisi,modeles:PREP_COURS.modeles});
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>📝 Mes modèles de cours</h1>
   ${msg?`<div class="ok" style="margin:-6px 0 14px">${msg}</div>`:''}
   <p class="muted" style="margin-top:0">Un modèle = les parties du cours et leurs minutes. Les stagiaires / apprentis partent du modèle « proposé » ; le téléphone les prévient si une partie dure trop ou pas assez (à 15 s près). Ça ne les bloque jamais.</p>
   <p class="muted">Montré aux stagiaires / apprentis : <b style="color:${PREP_COURS.montrer?'var(--ok)':'var(--soft)'}">${PREP_COURS.montrer?'Oui':'Non'}</b> (bouton sur l'accueil).</p>`;
  W.modeles.forEach((m,mi)=>{const tot=crCibleModele(m), pro=m.id===W.choisi;
    h+=`<div class="card ${pro?'g':''}"><div class="tag" style="color:${pro?'var(--ok)':'var(--soft)'}">${pro?'✅ Proposé aux stagiaires / apprentis':'Modèle '+(mi+1)}</div>
     <label for="crn${mi}">Nom du modèle</label><input type="text" id="crn${mi}" data-crnom="${mi}" value="${esc(m.nom)}">
     <label>Les parties</label>`;
    m.parties.forEach((p,pi)=>{h+=`<div class="qed" style="padding:10px 12px;margin:10px 0">
       <div class="ligne" style="margin:0"><input type="text" data-crpn="${mi}:${pi}" value="${esc(p.n)}" placeholder="Nom de la partie" style="min-width:0">
       <input type="number" inputmode="decimal" data-crpm="${mi}:${pi}" value="${esc(p.m)}" style="width:72px;flex:none;text-align:center;padding:13px 4px" aria-label="Minutes"><span class="muted" style="flex:none">min</span></div>
       <div class="ligne" style="margin:8px 0 0"><button class="ordre" data-crpup="${mi}:${pi}" ${pi===0?'disabled':''} aria-label="Monter">⬆️</button><button class="ordre" data-crpdn="${mi}:${pi}" ${pi===m.parties.length-1?'disabled':''} aria-label="Descendre">⬇️</button><span style="flex:1"></span><button class="link" data-crpx="${mi}:${pi}" style="color:var(--ko)">🗑️ Supprimer la partie</button></div></div>`});
    h+=`<button class="btn small sec" data-crpadd="${mi}">➕ Ajouter une partie</button>
     <p style="margin:12px 0 0;font-weight:800" id="crtot${mi}">Durée totale : ${crFmt(tot)}</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${pro?'':`<button class="btn small" data-crpro="${mi}">✅ Proposer ce modèle</button>`}<button class="btn small sec" data-crdup="${mi}">📄 Dupliquer</button>${W.modeles.length>1?`<button class="btn small ko" data-crsup="${mi}">🗑️ Supprimer</button>`:''}</div></div>`});
  h+=`<button class="btn sec" id="crnew">➕ Nouveau modèle (ex. « Cours 45 min »)</button>
   <div class="err hide" id="crerr"></div>
   <button class="btn" id="crsave" ${modif?'':'disabled'}>💾 Enregistrer mes modèles</button>
   <p class="muted" id="crinfo">${modif?'⚠️ Changements pas encore enregistrés.':'Tout est enregistré.'}</p>`;
  app.innerHTML=h;
  const re=()=>{const y=window.scrollY;coursPrepEcran();window.scrollTo(0,y)};
  const ij=t=>t.split(':').map(Number);
  const sale=()=>{document.getElementById('crsave').disabled=false;document.getElementById('crinfo').textContent='⚠️ Changements pas encore enregistrés.'};

// ======= Lecture d'une ligne de réponse =======
// La question n°i d'une ligne : celle de la banque si la ligne garde son numéro, sinon celle du quiz
function questionDe(R,i,z){const id=R.ids[i];const b=id&&questionParId(id);return b||(z&&z.questions[i])||null}
function quizDeLigne(lab){
  const qf=Object.values(QUIZF).find(q=>q.label===lab);
  if(qf)return {qf,z:qf.quiz,tag:'Quiz de '+qf.auteur.nom,titre:qf.titre};
  const j=JOURNEES.find(j=>lab.startsWith(j.titre));
  if(j)return {j,z:quizDe(j),tag:j.titre,titre:j.theme};
  const r=Object.values(REVS).find(r=>r.titre===lab);
  if(r)return {rev:r,z:r.quiz,tag:'Révision',titre:r.titre};
  if(/^Révision/.test(lab))return {z:{ressenti:[],questions:[]},tag:'Révision',titre:lab};
  return null;
}
// Tout l'historique d'un stagiaire, reconstruit depuis le tableau des réponses (feuilles papier comprises)
function historiqueStagiaire(x){
  return lignes.slice(1).filter(l=>!estObs(l)&&memeNom(x.prenom+' '+x.nom,(l[2]||'')+' '+(l[1]||''))).map(l=>{
    const lab=(l[3]||'').trim(), info=quizDeLigne(lab);
    if(!info)return null;
    const R=lireReponses(l[5]), items=[];
    for(let i=0;i<R.total;i++){const e=R.etats[i];items.push({q:questionDe(R,i,info.z),etat:e?e.etat:'?',rep:e?e.rep:null})}
    return Object.assign({l:lab,d:horoVersMs(l[0])||0,h:l[0]||'',R,items,rs:lireRessenti(l[4]),dif:(l[6]||'').trim()},info);
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
}

// Fabrique le lien #t=… (les questions de la banque sont envoyées par leur numéro seulement)
// 05/11 : le lien porte aussi ses retours (pour qu'il puisse encore les lire) et un numéro pour ne servir qu'une fois
async function lienTransfert(x,H){
  const ref=q=>(q.id&&questionParId(q.id))?q.id:{q:q.q,o:q.o,b:q.b,e:q.e||'',t:q.theme||'autre'};
  const n=nouvelId().slice(0,10), RT=retoursDe(x.id);
  const fab=(niveau)=>({v:2,n,c:Math.round(Date.now()/1000),m:[x.id,x.nom,x.prenom,x.st||'',x.str||''],
    r:RT.slice(0,niveau>=3?5:50).map(r=>[r.titre||'',r.texte||'',r.at||0,r.date||'']),
    h:H.slice(niveau>=3?-15:0).map(e=>[e.l,Math.round(e.d/1000),
      e.items.filter(it=>it.q&&it.etat!=='?').map(it=>{
        const s=it.etat==='ok'?1:it.etat==='na'?2:0; let r=ref(it.q);
        if(niveau>=1&&typeof r==='object')r=Object.assign({},r,{e:''});
        if(s!==0)return [r,s];
        const k=it.q.o.indexOf(it.rep);return [r,s,k>=0?k:String(it.rep||'')];
      }),
      niveau>=2?[]:e.rs.map(k=>[k.t,k.n])])});
  let t='';
  for(let n=0;n<=3;n++){t=await encoderLien(fab(n));if(t.length<7500)break}
  return LIEN_STAGIAIRES+'#t='+t;
}

const GEN={ouvert:false,theme:null,prop:null,vus:new Set(),msg:''};
function genReset(){GEN.ouvert=false;GEN.prop=null;GEN.msg='';GEN.vus=new Set();GEN.theme=lire('gen_theme',null);if(GEN.theme&&GEN.theme!=='tout'&&!GEN_THEMES[GEN.theme])GEN.theme=null}
function genNouvelle(z,sauf){const q=genProposer(GEN.theme,z.questions.concat(sauf?[sauf]:[]),GEN.vus);if(q)GEN.vus.add(q.id);return q}
function htmlGen(z){

    <div style="font-weight:700;margin-top:10px">🧘 Étirements</div><div class="choix" style="margin-top:6px">${puce('etir.bas','Bas du corps')}${puce('etir.haut','Haut du corps')}${puce('etir.abdos','Abdos')}</div>
    <div class="choix">${puce('tout','🎲 Tout')}</div>`;
  if(GEN.msg)h+=`<div class="ok">${esc(GEN.msg)}</div>`;
  if(GEN.theme){
    const q=GEN.prop;
    if(q)h+=`<p class="muted" style="margin:14px 0 4px">2. La question proposée (✓ = bonne réponse) :</p>
      <div style="background:#1c2442;border-radius:12px;padding:12px"><b>${esc(q.q)}</b>
       ${q.o.map((o,k)=>`<div class="${k===q.b?'bon':'muted'}" style="margin-top:6px">${k===q.b?'✓':'•'} ${esc(o)}</div>`).join('')}
       ${q.e?`<div class="expl">💡 ${esc(q.e)}</div>`:''}<div class="th">${esc(nomTheme(q.theme))}</div></div>
      <div style="display:flex;gap:8px"><button class="btn" id="genok" style="flex:1">✅ Garder</button><button class="btn sec" id="genautre" style="flex:1">🔄 Une autre</button></div>`;
    else h+=`<p class="muted" style="margin-top:12px">Il n'y a plus de nouvelle question dans ce thème : elles sont toutes déjà dans ton quiz. Choisis un autre thème.</p>`;
  }else h+=`<p class="muted" style="margin-top:12px">Touche un thème pour voir une question.</p>`;
  return h+`</div>`;
}
function brancherGen(z,re){
  const voir=()=>setTimeout(()=>{const g=document.getElementById('genbox');if(g)g.scrollIntoView({block:'start'})},0);
  const a=document.getElementById('genadd');
  if(a)a.onclick=()=>{re(()=>{GEN.ouvert=true;GEN.msg='';if(GEN.theme&&!GEN.prop)GEN.prop=genNouvelle(z)})();voir()};
  const x=document.getElementById('genx');
  if(x)x.onclick=()=>{re(()=>{GEN.ouvert=false;GEN.prop=null;GEN.msg=''})()};
  app.querySelectorAll('[data-gth]').forEach(b=>b.onclick=()=>{re(()=>{GEN.theme=b.dataset.gth;ecrire('gen_theme',GEN.theme);GEN.msg='';GEN.prop=genNouvelle(z)})();voir()});
  const ok=document.getElementById('genok');
  if(ok)ok.onclick=()=>{re(()=>{const q=GEN.prop;
    if(q&&!z.questions.some(y=>(y.id&&y.id===q.id)||genNorm(y.q)===genNorm(q.q))){z.questions.push(q);GEN.msg=`✅ Gardée : c'est la question ${z.questions.length}. Voici une autre proposition.`}
    GEN.prop=genNouvelle(z)})();voir()};
  const au=document.getElementById('genautre');
  if(au)au.onclick=()=>{re(()=>{GEN.msg='';const q=genNouvelle(z,GEN.prop);if(q)GEN.prop=q;else GEN.msg="C'est la seule question encore libre dans ce thème."})();voir()};
}
// Éditeur de quiz (journée ou révision)
function nettoyer(z){
  return {ressenti:z.ressenti.map(t=>t.trim()).filter(Boolean),
    questions:z.questions.map(q=>{const o=[];let b=-1;q.o.forEach((t,k)=>{if(t.trim()){if(k===q.b)b=o.length;o.push(t.trim())}});
      const r={q:q.q.trim(),o,b,e:(q.e||'').trim()};
      if(q.theme)r.theme=q.theme;
      // on garde le numéro de la banque seulement si la question n'a pas été changée
      const bq=q.id&&questionParId(q.id);
      // (30/10 : une question générée gardée avec son ancien énoncé garde aussi son numéro)
      if(bq&&(bq.q===r.q||(typeof genTexteAncien==='function'&&genTexteAncien(q.id)===r.q))&&JSON.stringify(bq.o)===JSON.stringify(r.o)&&bq.b===r.b)r.id=q.id;
      return r})};
}

      // nouveau tirage au hasard (les 🔒 restent), en évitant les questions déjà affichées
      const gardees=new Set(z.questions.filter((q,i)=>verrous[i]).map(cleQ)), actuelles=new Set(z.questions.map(cleQ));
      const pool=cfg.pool.filter(p=>!gardees.has(cleQ(p))), neufs=pool.filter(p=>!actuelles.has(cleQ(p))), nb=verrous.filter(v=>!v).length;
      let tir=tirerQuestions(paquetsParTheme(neufs.length>=nb?neufs:pool),nb);
      if(tir.length<nb){const pris=new Set(tir.map(cleQ));tir=tir.concat(tirerQuestions(paquetsParTheme(pool.filter(p=>!pris.has(cleQ(p)))),nb-tir.length))}
      let k=0;z.questions=z.questions.map((q,i)=>verrous[i]?q:(tir[k++]||q));
      z.questions.forEach(q=>vus.add(cleQ(q)));
      const y=window.scrollY;dessiner();window.scrollTo(0,y);
      const d2=document.getElementById('de');if(d2){d2.classList.add('roule');setTimeout(()=>d2.classList.remove('roule'),650)}
    };
  };
  dessiner(); haut();
}

function tirerRevision(choix){
  const js=JOURNEES.filter(j=>choix.j.includes(j.id));
  const pool=[].concat(...js.map(j=>j.banque.questions));
  const n=choix.duree*2;
  const z={ressenti:choix.ressenti?js.slice(-4).map(j=>`Ce qu'on a vu le ${j.titre.toLowerCase()}`):[],
    questions:tirerQuestions(js.map(j=>j.banque.questions),n)};
  // titre unique : « Révision du JJ/MM »
  let titre=`Révision du ${jjmm(Date.now())}`, k=2;
  while(Object.values(REVS).some(r=>r.titre===titre))titre=`Révision du ${jjmm(Date.now())} n°${k++}`;
  const r={id:nouvelId(),titre,journees:choix.j,cree:Date.now()};
  const sauver=async propre=>{
    const avant=revisionCourante(REVS);
    if(avant&&avant.ouvert){await envoyerForm(FORM_QUIZ,{[EQ.journee]:'revision',[EQ.statut]:'ferme',[EQ.contenu]:JSON.stringify({id:avant.id})});noterLocalRev(avant.id,{ouvert:false})}
    await enregistrerRevision(r,propre);
    return `✅ ${titre} enregistrée. Ouvre-la aux stagiaires quand tu veux.`;
  };
  const apres=m=>revisionEcran(m);
  apercu({tag:'Quiz de révision',titre,z,pool,retour:()=>nouvelleRevision(),
    info:`${js.map(j=>j.titre).join(', ')} · tirage mélangé.`,
    actions:[
      {txt:'✏️ Modifier avant d\'enregistrer',cls:'sec',f:zz=>editeur({tag:'Quiz de révision',titre,z:zz,retour:()=>revisionEcran(),reouvrir:()=>revisionEcran(),texteEnregistrer:'Enregistrer la révision',enregistrer:sauver,apres})},
      {txt:'💾 Enregistrer la révision',f:async zz=>{
        const p=nettoyer(zz);
        try{apres(await sauver(p))}catch(e){alert("L'enregistrement n'a pas marché. Vérifie ta connexion internet et réessaie.")}
      }}]});
}

function afficher(c,tests){
  const z=c.z, nq=z.questions.length;
  const adm=estAdmin(); // 06/11 : un autre formateur ne voit ni les observations, ni le résumé, ni les retours d'Hamid
  const iH=0,iN=1,iP=2,iJ=3,iR=4,iQ=5,iD=6;
  let rep=lignes.slice(1).filter(l=>!estObs(l)&&c.filtre(l));
  const nbTests=c.dateMin?rep.filter(l=>dateFR(l[iH])<c.dateMin).length:0;
  if(!tests&&c.dateMin)rep=rep.filter(l=>dateFR(l[iH])>=c.dateMin);
  // seulement les stagiaires acceptés (dès qu'il y en a au moins un)
  const acc=acceptes().filter(x=>!estTest(x)&&voitStag(x)); let masques=0;
  if((acc.length||!estAdmin())&&!tests){const avant=rep.length;rep=rep.filter(l=>acc.some(a=>memeNom(a.prenom+' '+a.nom,(l[iP]||'')+' '+(l[iN]||''))));masques=avant-rep.length}
  // si quelqu'un a envoyé plusieurs fois (accès redonné…), seul son dernier envoi compte
  {const vus=new Map();rep.forEach(l=>vus.set(memeNomCle(((l[iP]||'')+' '+(l[iN]||'')).trim()),l));rep=[...vus.values()]}
  const zone=document.getElementById('zone');
  let h='';
  if(masques)h+=`<p class="muted">${masques} réponse${masques>1?'s':''} de personnes non acceptées ou supprimées ${masques>1?'sont masquées':'est masquée'}.</p>`;
  if(nbTests)h+=`<label class="check"><input type="checkbox" id="tst" ${tests?'checked':''}> Afficher aussi les réponses de test ${esc(c.testTexte)} (${nbTests})</label>`;
  if(!rep.length){
    if(adm)h+=htmlRetoursJour(c);
    h+=`<div class="card"><h2>Pas encore de réponses</h2><p class="muted">Les réponses arrivent dès qu'un stagiaire envoie son quiz${c.dateMin?' (ou que tu saisis une feuille papier)':''}.</p><button class="btn sec" id="maj">🔄 Actualiser</button></div>`;
    zone.innerHTML=h;
    document.getElementById('maj').onclick=()=>reponses(c);
    if(nbTests)document.getElementById('tst').onchange=e=>afficher(c,e.target.checked);
    if(adm)observations(c,null,zone);return;
  }
  const RR=rep.map(l=>lireReponses(l[iQ]));
  const res={};
  rep.forEach(l=>lireRessenti(l[iR]).forEach(x=>{if(x.n)(res[x.t]=res[x.t]||[]).push(x.n)}));
  const moy=Object.entries(res).map(([k,v])=>({k,m:v.reduce((a,b)=>a+b,0)/v.length}));
  const bonnes=Array(nq).fill(0), sansRep=Array(nq).fill(0);
  RR.forEach(R=>{for(let i=0;i<nq;i++){const e=R.etats[i];if(e&&e.etat==='ok')bonnes[i]++;if(e&&e.etat==='na')sansRep[i]++}});
  const diffs=rep.map(l=>({n:`${(l[iP]||'').trim()} ${(l[iN]||'').trim()}`.trim(),d:(l[iD]||'').trim()})).filter(x=>x.d);
  const scoreTot=RR.reduce((a,R)=>a+(R.score||0),0);
  const qTexte=(R,i)=>{const q=questionDe(R,i,z);return q?q.q:'Question '+(i+1)};
  // 30/10 : questions cochées « 🤔 Je ne comprends pas bien la question » (champ [nc:…] des réponses)
  const sig=new Map();
  rep.forEach((l,n)=>{const R=RR[n];(R.nc||[]).forEach(i=>{const q=questionDe(R,i,z), id=R.ids[i]||(q&&q.id)||null, txt=q?q.q:'Question '+(i+1);
    const k=id||'t:'+genNorm(txt), s0=sig.get(k)||{id,txt,noms:[]};
    const pr=((l[iP]||'').trim()||(l[iN]||'').trim()); if(!s0.noms.includes(pr))s0.noms.push(pr); sig.set(k,s0)})});
  const SIG=[...sig.values()].map(x=>Object.assign(x,{idx:z.questions.findIndex(q=>(x.id&&q.id===x.id)||genNorm(q.q)===genNorm(x.txt)||(x.id&&genTexteAncien(x.id)&&genNorm(q.q)===genNorm(genTexteAncien(x.id))))}))
    .map(x=>Object.assign(x,{txt:x.idx>=0?z.questions[x.idx].q:x.txt})) // le texte que les stagiaires ont vu
    .sort((a,b)=>b.noms.length-a.noms.length);
  if(SIG.length)h+=`<div class="card j"><h2>🤔 Questions pas claires</h2><p class="muted" style="margin-top:0">Les stagiaires / apprentis ont coché « Je ne comprends pas bien la question ». Touche ✏️ Corriger pour la réécrire.</p>`+
     SIG.map(x=>`<div class="stag"><b>${x.idx>=0?(x.idx+1)+'. ':''}${esc(x.txt)}</b>
       <div class="d">🤔 ${x.noms.length} stagiaire${x.noms.length>1?'s':''} : ${esc(x.noms.join(', '))}</div>
       ${c.editer?`<button class="btn small" style="margin-top:8px" data-corr="${x.idx}">✏️ Corriger${x.idx<0?' (question plus dans le quiz)':''}</button>`:''}</div>`).join('')+`</div>`;

  h+=`<div class="card o" style="display:flex;justify-content:space-between;align-items:center">
     <div><div class="big">${rep.length}</div><div class="muted">stagiaire${rep.length>1?'s ont':' a'} répondu</div></div>
     <div style="text-align:right"><div class="big">${(scoreTot/rep.length).toFixed(1)}<span style="font-size:20px">/${nq}</span></div><div class="muted">score moyen</div></div></div>`;
  if(moy.length)h+=`<div class="card"><h2>Ressenti « J'ai compris… »</h2><p class="muted" style="margin-top:0">Moyenne sur 5</p>`+
     moy.map(x=>`<div class="row"><span>${esc(x.k)}</span><span class="pill ${classe(x.m,5)}">${x.m.toFixed(1)}</span></div>`).join('')+`</div>`;
  h+=`<div class="card"><h2>Les questions</h2><p class="muted" style="margin-top:0">Bonnes réponses${sansRep.some(Boolean)?' · ⏳ = pas répondu (temps fini)':''}</p>`+
     z.questions.map((q,i)=>`<div class="row"><span>${i+1}. ${esc(q.q)}${sansRep[i]?` <span style="color:var(--ja)">· ⏳ ${sansRep[i]}</span>`:''}</span><span class="pill ${classe(bonnes[i],rep.length)}">${bonnes[i]}/${rep.length}</span></div>`).join('')+`</div>`;
  h+=`<div class="card ${diffs.length?'r':'g'}"><h2>Difficultés signalées</h2>`+
     (diffs.length?diffs.map((x,k)=>{const q=x.d.startsWith('🚪'), m=q&&x.d.match(/il lui restait ([0-9]+ min [0-9]+)/), a=q&&acceptes().find(s=>memeNom(s.prenom+' '+s.nom,x.n));
       return `<div class="stag"><b>${esc(x.n)}</b><div class="d">${esc(x.d)}</div>${q&&a&&adm?`<button class="btn small" style="margin-top:8px" data-reouv="${esc(a.id)}" data-rt="${esc(m?m[1]:'')}">🔓 Lui redonner accès${m?` (${esc(m[1])})`:''}</button>`:''}</div>`}).join(''):`<p class="muted" style="margin:0">Aucune difficulté signalée.</p>`)+`</div>`;
  if(adm)h+=htmlRetoursJour(c);
  h+=`<div class="card"><h2>Détail par stagiaire</h2>`+rep.map((l,n)=>{
       const R=RR[n], sc=R.score||0;
       const rs=lireRessenti(l[iR]).map(x=>x.n||'-').join(' · ');
       const erreurs=R.etats.map((e,i)=>!e?'':e.etat==='ko'?`<div class="d">❌ ${esc(qTexte(R,i))}<br><span style="color:var(--mute)">→ a répondu : ${esc(e.rep)}</span></div>`
         :e.etat==='na'?`<div class="d">⏳ ${esc(qTexte(R,i))}<br><span style="color:var(--mute)">→ pas répondu (temps fini)</span></div>`:'').join('')
         +(R.nc||[]).map(i=>`<div class="d" style="color:var(--ja)">🤔 a signalé « ${esc(qTexte(R,i))} » (pas claire)</div>`).join('');
       const pap=R.papier?' <span class="muted">(papier)</span>':'';
       return `<div class="stag"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(((l[iP]||'')+' '+(l[iN]||'')).trim())}${pap}</b><span class="pill ${classe(sc,nq)}">${sc}/${nq}</span></div>
       ${rs?`<div class="d">Ressenti : ${esc(rs)}</div>`:''}${erreurs}</div>`}).join('')+
     `<button class="btn sec" id="maj">🔄 Actualiser les réponses</button></div>`;
  zone.innerHTML=h;
  document.getElementById('maj').onclick=()=>reponses(c);
  if(nbTests)document.getElementById('tst').onchange=e=>afficher(c,e.target.checked);
  app.querySelectorAll('[data-corr]').forEach(b=>b.onclick=()=>c.editer(+b.dataset.corr));
  app.querySelectorAll('[data-reouv]').forEach(b=>b.onclick=async()=>{const x=STAG[b.dataset.reouv];if(!x)return;
    const t=b.dataset.rt;
    if(!confirm(`Redonner accès au quiz à ${x.prenom} ${x.nom} ?\n\n${t?`Il récupérera exactement le temps qui lui restait : ${t}.`:'Il retrouvera ses réponses.'}`))return;
    const cle=String(c.cle).replace(/^rev_/,'rev:');
    b.disabled=true;b.textContent='…';
    try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:'reouvrir',[EQ.statut]:'acces',[EQ.contenu]:JSON.stringify({sid:x.id,cle})})}
    catch(e){alert("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.");b.disabled=false;b.textContent='🔓 Lui redonner accès';return}
    try{const L=JSON.parse(localStorage.getItem('cqpf_local_reouv')||'[]');L.push({sid:x.id,cle,at:Date.now()});localStorage.setItem('cqpf_local_reouv',JSON.stringify(L.slice(-20)))}catch(e){}
    b.textContent=`✅ Accès redonné${t?` (${t})`:''} · d'ici quelques minutes chez ${x.prenom}`});
  const eleves=rep.map((l,n)=>{
    const R=RR[n], nom=((l[iP]||'')+' '+(l[iN]||'')).trim();
    const pts=[];
    R.etats.forEach((e,i)=>{if(!e)return;
      if(e.etat==='ko')pts.push(`s'est trompé(e) sur « ${qTexte(R,i)} » (a répondu : ${e.rep})`);
      if(e.etat==='na')pts.push(`n'a pas répondu à « ${qTexte(R,i)} » (temps fini)`)});
    lireRessenti(l[iR]).forEach(x=>{if(x.n&&x.n<=2)pts.push(`ressenti faible sur « ${x.t} » (${x.n}/5)`)});
    const d=(l[iD]||'').trim(); if(d)pts.push(`a écrit : « ${d} »`);
    return {nom,pts};
  }).filter(x=>x.pts.length);
  if(adm)observations(c,{n:rep.length,moy,bonnes,sansRep,diffs,scoreTot,eleves},zone);
}

// ======= Mes observations : gardées sur ce téléphone ET sauvegardées en ligne =======
// En ligne : une ligne du formulaire des réponses avec Nom = « __obs__ », Prénom = la journée
// (ou la révision), Difficulté = le texte complet. Ce tableau n'est lu que par cette page.
const OBS_MINUTEURS={}, OBS_LABELS={};
function etatObs(cle,txt){['obsetat','deretat'].forEach(i=>{const e=document.getElementById(i);if(e&&e.dataset.cle===cle){e.textContent=txt;e.classList.remove('hide')}})}
function programmerSauvegarde(cle,ms){clearTimeout(OBS_MINUTEURS[cle]);OBS_MINUTEURS[cle]=setTimeout(()=>sauverObsEnLigne(cle),ms||3000)}
async function sauverObsEnLigne(cle){
  if(!cle)return;
  clearTimeout(OBS_MINUTEURS[cle]);delete OBS_MINUTEURS[cle];
  const v=lire('obs_'+cle,''), deja=lire('obs_envoye_'+cle,null);
  if(deja!==null?deja===v:!v.trim())return; // rien de nouveau
  etatObs(cle,'☁️ Sauvegarde en ligne…');
  try{
    // 29/10 : « Mon déroulé prévu » → formulaire « Mes quiz CQP » ; observations → formulaire des réponses (comme avant)
    if(cle.startsWith('der:')){const id=cle.slice(4), at=lire('der_at_'+id,0)||Date.now();
      await envoyerForm(FORM_QUIZ,{[EQ.journee]:'deroule',[EQ.statut]:'texte',[EQ.contenu]:JSON.stringify({id,texte:v,at})});
      DEROULES[id]={texte:v,at}}
    else await envoyerForm(FORM,{[E.nom]:'__obs__',[E.prenom]:cle,[E.journee]:'Observations',[E.ressenti]:'',[E.reponses]:'',[E.difficulte]:v});
    ecrire('obs_envoye_'+cle,v);
    etatObs(cle,`☁️ Sauvegardé en ligne à ${heureParis(Date.now())}`);
  }catch(e){
    etatObs(cle,'⚠️ Pas de connexion : c\'est gardé sur ce téléphone, je réessaie bientôt.');
    programmerSauvegarde(cle,20000);
  }
}
function obsEnLigne(cle){const l=OBS.filter(l=>(l[2]||'').trim()===cle);return l.length?(l[l.length-1][6]||''):null}

function observations(c,st,zone){
  const cle=c.cle; OBS_LABELS[cle]=c.titre;
  const box=document.createElement('div');
  box.innerHTML=`<div class="card g"><h2>Mes observations</h2>
   <p class="muted" style="margin-top:0">Écris ou dicte ce que tu as remarqué. C'est gardé sur ce téléphone et sauvegardé en ligne (seulement pour toi).</p>
   <textarea id="obs" data-cle="${esc(cle)}" style="min-height:120px" placeholder="Ex. : placement de la salle encore flou pour 2 stagiaires…"></textarea>
   <div class="muted hide" id="obsetat" data-cle="${esc(cle)}" style="margin-top:6px"></div>
   <button class="btn sec" id="mic">🎤 Dicter</button>
   <div class="muted hide" id="micinfo" style="margin-top:8px"></div>
   <label style="margin-top:18px">Que mettre dans le résumé ?</label>
   <div id="modes">
    <button class="opt" data-m="complet">📋 Complet : réponses des stagiaires + mes observations</button>
    <button class="opt" data-m="obs">👀 Seulement mes observations</button>
    <button class="opt" data-m="stag">👥 Seulement les réponses des stagiaires</button>
   </div>
   <button class="btn" id="res">✨ Faire le résumé</button></div>
   <div class="card o hide" id="rbox"><h2>Résumé pour les formateurs</h2>
   <p class="muted" style="margin-top:0">Tu peux le corriger avant de l'envoyer.</p>
   <textarea id="resume"></textarea>
   <button class="btn wa" id="wa">📋 Copier et ouvrir WhatsApp</button>
   <div class="ok hide" id="cp">✅ Résumé copié. Dans WhatsApp, choisis le groupe des formateurs, puis envoie.</div></div>`;
  zone.appendChild(box);
  const obs=document.getElementById('obs');
  let local=lire('obs_'+cle,'');
  if(!local.trim()){const enLigne=obsEnLigne(cle);if(enLigne&&enLigne.trim()){local=enLigne;ecrire('obs_'+cle,local);ecrire('obs_envoye_'+cle,local);etatObs(cle,'☁️ Repris depuis ta sauvegarde en ligne.')}}
  obs.value=local;
  obs.oninput=()=>{ecrire('obs_'+cle,obs.value);programmerSauvegarde(cle)};
  const mb=document.getElementById('mic'), mi=document.getElementById('micinfo');
  if(!SRdispo()){mb.onclick=()=>{mi.textContent="Sur ce téléphone, touche la case puis le petit micro 🎤 de ton clavier pour dicter.";mi.classList.remove('hide');obs.focus()}}
  else mb.onclick=()=>{if(DICTEE.voulu&&DICTEE.cle===cle)arreterDictee();else demarrerDictee(cle,c.titre)};
  majBoutonMic();
  let mode=lire('mode','complet');
  const majModes=()=>document.querySelectorAll('#modes .opt').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  document.querySelectorAll('#modes .opt').forEach(b=>b.onclick=()=>{mode=b.dataset.m;ecrire('mode',mode);majModes()});
  majModes();
  document.getElementById('res').onclick=()=>{
    document.getElementById('resume').value=resume(c,st,obs.value.trim(),mode);
    const rb=document.getElementById('rbox');rb.classList.remove('hide');rb.scrollIntoView({behavior:'smooth'});
  };
  document.getElementById('wa').onclick=async()=>{
    const txt=document.getElementById('resume').value;
    if(!await copier(txt)){const t=document.getElementById('resume');t.select();try{document.execCommand('copy')}catch(_){}}
    document.getElementById('cp').classList.remove('hide');
    setTimeout(()=>ouvrirWhatsApp(txt,true),600);
  };
}

// retours d'observation envoyés le jour d'une journée (pour le résumé)
function retoursDuJour(c){return c&&c.dateMin?retoursDe(null).filter(r=>jourISO(r.at)===c.dateMin).reverse():[]}
function htmlRetoursJour(c){const L=retoursDuJour(c);if(!c||!c.dateMin)return'';
  return `<div class="card j"><h2>📝 Retours d'observation du jour (${L.length})</h2>`+(L.length?L.map(r=>`<div class="stag"><b>${esc(r.nom||'')}</b>${r.titre?` <span class="muted">· ${esc(r.titre)}</span>`:''}<div style="white-space:pre-wrap;margin-top:4px">${esc(r.texte)}</div></div>`).join(''):`<p class="muted" style="margin:0">Aucun retour envoyé ce jour-là.</p>`)+`</div>`}
function resume(c,st,obs,mode){
  mode=mode||'complet';
  const z=c.z;
  let t=`📋 Bilan CQP Cours collectifs – ${c.titre}\n${c.sousTitre}\n`;
  // 30/10 : ce qui a été travaillé, d'après les documents montrés aux stagiaires / apprentis
  try{const jj=JOURNEES.find(x=>x.id===c.cle); if(jj&&Array.isArray(jj.resumes)){const vis=diaposVisibles(DIAPOS_OUV,jj).filter(i=>jj.resumes[i-1]);
    if(vis.length)t+=`\n📚 Travaillé aujourd'hui :\n`+vis.map(i=>`• ${jj.resumes[i-1]}`).join('\n')+'\n'}}catch(e){}
  const RJ=retoursDuJour(c), txtRJ=RJ.length?`\n📝 Retours individuels :\n`+RJ.map(r=>`• ${r.nom}${r.titre?' ('+r.titre+')':''} : ${r.texte.replace(/\s*\n\s*/g,' ')}`).join('\n')+'\n':'';
  if(mode==='obs'){t+=obs?`\n👀 Mes observations :\n${obs}\n`:(RJ.length?'':`\n(Pas d'observations écrites.)\n`);return t+txtRJ+`\nHamid`}
  if(!st){t+=`\nPas de réponses au quiz pour l'instant.\n`}
  else{
    t+=`\n👥 ${st.n} stagiaire${st.n>1?'s ont':' a'} répondu au quiz · score moyen ${(st.scoreTot/st.n).toFixed(1)}/${z.questions.length}\n`;
    const bien=st.moy.filter(x=>x.m>=4), revoir=st.moy.filter(x=>x.m<3.5), moyen=st.moy.filter(x=>x.m>=3.5&&x.m<4);
    if(bien.length)t+=`\n✅ Bien compris :\n`+bien.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(moyen.length)t+=`\n🟡 Compris en partie :\n`+moyen.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(revoir.length)t+=`\n🔴 À retravailler :\n`+revoir.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    const qrat=z.questions.map((q,i)=>({q:q.q,b:st.bonnes[i],nr:(st.sansRep||[])[i]||0})).filter(x=>x.b<st.n);
    t+=`\n📝 Questions :\n`+(qrat.length?qrat.map(x=>`• ${x.q} : ${x.b}/${st.n} bonnes réponses${x.nr?` (⏳ ${x.nr} sans réponse, temps fini)`:''}`).join('\n'):`• Toutes les questions réussies par tout le monde`)+'\n';
    if(st.eleves&&st.eleves.length)t+=`\n👤 Points de vigilance par stagiaire :\n`+st.eleves.map(x=>`• ${x.nom} : ${x.pts.join(' · ')}`).join('\n')+'\n';
    else t+=`\n👤 Aucun point de vigilance particulier chez les stagiaires.\n`;
  }
  if(mode==='complet'&&obs)t+=`\n👀 Mes observations :\n${obs}\n`;
  if(mode==='complet')t+=txtRJ;
  t+=`\nHamid`;
  return t;
}

// ======= Dictée : elle ne s'arrête que quand tu touches « Arrêter » =======
// Elle continue quand tu changes d'écran (barre rouge en bas) et le texte va dans les
// observations de la journée où tu as commencé.
const DICTEE={voulu:false,coupe:false,rec:null,cle:null,label:'',premier:true,erreurs:0,minuteur:null};
function SRdispo(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function demarrerDictee(cle,label){
  if(DICTEE.voulu)arreterDictee();
  Object.assign(DICTEE,{voulu:true,coupe:false,cle,label,premier:true,erreurs:0});
  lancerReco(); barreDictee(); majBoutonMic();
}
function lancerReco(){
  const SR=SRdispo(); let rec;
  try{rec=new SR()}catch(e){DICTEE.voulu=false;barreDictee();majBoutonMic();return}
  rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{
    let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=(t?' ':'')+String(e.results[i][0].transcript).trim();
    if(t){DICTEE.erreurs=0;ajouterTexteObs(DICTEE.cle,t)}
  };
  rec.onerror=e=>{
    const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed'||c==='audio-capture'){
      DICTEE.voulu=false;
      const mi=document.getElementById('micinfo');if(mi){mi.textContent="Le micro n'est pas autorisé. Tu peux utiliser le micro 🎤 de ton clavier.";mi.classList.remove('hide')}
    }else if(c==='network')DICTEE.erreurs++;
    // « no-speech » (silence) et « aborted » : on relance simplement (voir onend)
  };
  rec.onend=()=>{
    if(DICTEE.rec!==rec)return;
    DICTEE.rec=null;
    if(DICTEE.voulu&&!DICTEE.coupe){
      if(document.hidden){DICTEE.coupe=true;barreDictee();return}
      const attente=DICTEE.erreurs?Math.min(8000,1000*DICTEE.erreurs):150;
      clearTimeout(DICTEE.minuteur);
      DICTEE.minuteur=setTimeout(()=>{if(DICTEE.voulu&&!DICTEE.coupe&&!DICTEE.rec)lancerReco()},attente);
    }else{barreDictee();majBoutonMic()}
  };
  DICTEE.rec=rec;
  try{rec.start()}catch(e){DICTEE.rec=null;DICTEE.erreurs++;clearTimeout(DICTEE.minuteur);DICTEE.minuteur=setTimeout(()=>{if(DICTEE.voulu&&!DICTEE.coupe&&!DICTEE.rec)lancerReco()},1000)}
}
function arreterDictee(){
  const cle=DICTEE.cle;
  DICTEE.voulu=false;DICTEE.coupe=false;clearTimeout(DICTEE.minuteur);
  const r=DICTEE.rec;DICTEE.rec=null;
  if(r){try{r.stop()}catch(e){}}
  if(cle)sauverObsEnLigne(cle);
  barreDictee();majBoutonMic();
}
function reprendreDictee(){DICTEE.coupe=false;DICTEE.premier=true;DICTEE.erreurs=0;lancerReco();barreDictee();majBoutonMic()}
function ajouterTexteObs(cle,t){
  const cur=lire('obs_'+cle,'');
  const v=cur.trim()?cur.replace(/\s*$/,'')+(DICTEE.premier?'\n':' ')+t:t;
  DICTEE.premier=false;
  ecrire('obs_'+cle,v);
  if(cle.startsWith('der:'))ecrire('der_at_'+cle.slice(4),Date.now());
  ['obs','der'].forEach(i=>{const ta=document.getElementById(i);if(ta&&ta.dataset.cle===cle)ta.value=v});
  programmerSauvegarde(cle);
}
function majBoutonMic(){[['mic','obs'],['dmic','der']].forEach(([m,t])=>majUnMic(m,t))}
function majUnMic(idMic,idTa){
  const mb=document.getElementById(idMic), ta=document.getElementById(idTa);
  if(!mb||!ta)return;
  const ici=DICTEE.voulu&&DICTEE.cle===ta.dataset.cle;
  mb.textContent=ici?(DICTEE.coupe?'🎤 Reprendre la dictée':'⏹️ Arrêter la dictée'):'🎤 Dicter';
  mb.classList.toggle('rec',ici&&!DICTEE.coupe);
  if(ici&&DICTEE.coupe)mb.onclick=reprendreDictee;
  else if(SRdispo())mb.onclick=()=>{if(DICTEE.voulu&&DICTEE.cle===ta.dataset.cle)arreterDictee();else demarrerDictee(ta.dataset.cle,OBS_LABELS[ta.dataset.cle]||'')};
}
function barreDictee(){
  let b=document.getElementById('barre-dictee');
  if(!b){b=document.createElement('div');b.id='barre-dictee';document.body.appendChild(b)}
  document.body.classList.toggle('avec-barre',DICTEE.voulu);
  if(!DICTEE.voulu){b.className='hide';b.innerHTML='';return}
  if(DICTEE.coupe){
    b.className='coupe';
    b.innerHTML=`<button id="bd-rep">🎤 Reprendre la dictée<small>Le micro a été coupé · ${esc(DICTEE.label)}</small></button><button class="sec" id="bd-stop">Arrêter</button>`;
    document.getElementById('bd-rep').onclick=reprendreDictee;
  }else{
    b.className='';
    b.innerHTML=`<button id="bd-stop">🔴 Dictée en cours – Arrêter<small>${esc(DICTEE.label)}</small></button>`;
  }
  document.getElementById('bd-stop').onclick=arreterDictee;
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)return;
  // Android coupe le micro quand on quitte l'appli : le texte déjà dicté est gardé
  if(DICTEE.voulu&&!DICTEE.coupe){
    DICTEE.coupe=true;const r=DICTEE.rec;DICTEE.rec=null;
    if(r){try{r.abort()}catch(e){}}
    barreDictee();majBoutonMic();
  }
  Object.keys(OBS_MINUTEURS).forEach(sauverObsEnLigne);

  const restantes=()=>{const C=zoneObj().cases, L=liste(), n=c=>L.filter(x=>x.r===c).length, m=Math.min(...C.map(n));return C.filter(c=>n(c)===m)};

  const son=document.getElementById('rs-son');const majSon=()=>{son.textContent=roueSonActif()?'🔊 Son':'🔇 Son coupé'};majSon();

  go.onclick=async()=>{
    if(ROUE_SIMPLE_TOURNE)return;
    const qui=nom.value.trim();
    const deja=qui&&!multi&&liste().find(y=>memeNom(y.n,qui));
    if(deja){res.innerHTML=`<small style="color:var(--ko)">⚠️ ${esc(deja.n)} a déjà eu</small>${esc(deja.r)}`;return}
    ROUE_SIMPLE_TOURNE=true;roueAudioPret();go.disabled=true;go.textContent='La roue tourne…';res.innerHTML='';document.getElementById('rs-fiche').innerHTML='';
    const C=restantes(), i=Math.floor(Math.random()*C.length);

    nom.value='';go.disabled=false;go.textContent='🎡 Lancer';ROUE_SIMPLE_TOURNE=false;

    setTimeout(()=>{if(!ROUE_SIMPLE_TOURNE)dessinerRoue()},1800); // la case tirée sort de la roue
  };
  nom.onkeydown=e=>{if(e.key==='Enter')go.click()};
  document.getElementById('rs-copie').onclick=async()=>{const L=liste();if(!L.length)return;const t=`${ROUE_SIMPLE_CATS[cat].emoji} ${ROUE_SIMPLE_CATS[cat].titre}\n`+L.map(x=>`• ${x.n} → ${x.r}`).join('\n');
    if(!await copier(t)){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove()}
    ok.textContent='✅ Liste copiée.';ok.classList.remove('hide')};
  document.getElementById('rs-eff').onclick=()=>{if(confirm('Effacer toute la liste ?')){ecrire('roue_liste_'+cat,[]);dessinerListe();dessinerRoue();res.innerHTML=''}};
  const zoneEl=document.getElementById('rs-zone'), proj=document.getElementById('rs-proj');

    try{if(on&&zoneEl.requestFullscreen)zoneEl.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}

  document.onkeydown=e=>{if(e.code==='Space'&&zoneEl.classList.contains('rs-plein')){e.preventDefault();go.click()}};
  document.getElementById('bk').onclick=()=>{quitter();accueil()};
  haut();
}

// ======= 📝 Observations : notes prises pendant un passage, envoyées au stagiaire (lui seul peut les lire) =======
// Copie pour Hamid : tableau des réponses (ligne « __retour__ », jamais lue côté stagiaires).
// Copie pour le stagiaire : tableau « Mes quiz CQP », chiffrée avec la clé de son téléphone.
let RETOURS=[];
function estRetour(l){return (l[1]||'').trim()==='__retour__'}
function retoursDe(sid){
  const loc=lire('retours_locaux',[]).filter(x=>!RETOURS.some(y=>y.at===x.at&&y.sid===x.sid));
  return RETOURS.concat(loc).filter(x=>!sid||x.sid===sid).sort((a,b)=>b.at-a.at);
}
// 27/10 : notes « gardées pour moi » (bilan du stagiaire, jamais visibles par lui tant qu'elles ne sont pas envoyées).
// En ligne : ligne « __note__ » du tableau des réponses ; une suppression = même nid avec « supprime ».
let NOTES=[];
function estNote(l){return (l[1]||'').trim()==='__note__'}
function notesGardees(sid){
  const tout=NOTES.concat(lire('notes_locales',[]).filter(x=>!NOTES.some(y=>y.nid===x.nid&&!!y.supprime===!!x.supprime)));
  const sup=new Set(tout.filter(x=>x.supprime).map(x=>x.nid)), envoyees=new Set(retoursDe(sid).map(r=>r.nid).filter(Boolean)), vu=new Set();
  return tout.filter(x=>!x.supprime&&x.sid===sid&&!sup.has(x.nid)&&!envoyees.has(x.nid)&&!vu.has(x.nid)&&vu.add(x.nid)).sort((a,b)=>b.at-a.at);
}
async function enregistrerNote(n){
  await envoyerForm(FORM,{[E.nom]:'__note__',[E.prenom]:n.sid,[E.journee]:'Note',[E.ressenti]:'',[E.reponses]:'',[E.difficulte]:JSON.stringify(n)});
  const L=lire('notes_locales',[]);L.push(n);ecrire('notes_locales',L.slice(-200));
}
// envoi d'un retour au stagiaire (tout de suite, ou plus tard depuis son bilan pour une note gardée)
async function envoyerRetour(x,titre,texte,nid){
  const at=Date.now(), r={sid:x.id,nom:x.prenom+' '+x.nom,titre,texte,at,date:dateJour(at)}; if(nid)r.nid=nid;
  const m=await chiffrerPour(x.pub,{titre,texte,at,date:r.date});
  await envoyerForm(FORM_QUIZ,{[EQ.journee]:'retour',[EQ.statut]:'msg',[EQ.contenu]:JSON.stringify(Object.assign({sid:x.id},m))});
  await envoyerForm(FORM,{[E.nom]:'__retour__',[E.prenom]:x.id,[E.journee]:'Retour',[E.ressenti]:'',[E.reponses]:'',[E.difficulte]:JSON.stringify(r)});
  const L=lire('retours_locaux',[]);L.push(r);ecrire('retours_locaux',L.slice(-50));
}
function dateJour(ms){return new Date(ms).toLocaleDateString('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long'})}
function jourISO(ms){return new Date(ms).toLocaleDateString('fr-CA',{timeZone:'Europe/Paris'})}

    try{await enregistrerNote(n)}catch(err){e.target.disabled=false;e.target.textContent='💾 Garder pour moi (dans son bilan)';return noteObservation(x,"⚠️ Ça n'a pas marché. Vérifie ta connexion internet et réessaie : tes notes sont toujours là.")}

// ======= 📋 Mes exercices (formateur) : renforcement, étirements, méthodes — partage partie par partie =======

let FICHES_OUV=[], DIAPOS_OUV=[];
function fichesChargerLocal(g){
  FICHES_OUV=(g&&g.fiches&&g.fiches.ouverts)||[];
  DIAPOS_OUV=(g&&g.diapos&&g.diapos.ouverts)||[];
  const ld=lire('local_diapos',null);
  if(ld&&Array.isArray(ld.ouverts)&&Date.now()-ld.at<15*60*1000)DIAPOS_OUV=ld.ouverts;
  const l=lire('local_fiches',null);
  if(l&&Array.isArray(l.ouverts)&&Date.now()-l.at<15*60*1000)FICHES_OUV=l.ouverts;
}
// 06/11 : montrer / cacher toute une catégorie d'exercices d'un coup (œil du menu)
async function fichesChangerCat(cat,montrer){
  const C=fxCles(cat), avant=FICHES_OUV.slice();
  const n=montrer?[...new Set(FICHES_OUV.concat(C))]:FICHES_OUV.filter(x=>!C.includes(x));
  FICHES_OUV=n; ecrire('local_fiches',{ouverts:n,at:Date.now()});

}
async function fichesChanger(cle,montrer){
  const avant=FICHES_OUV.slice();

  FICHES_OUV=n; ecrire('local_fiches',{ouverts:n,at:Date.now()});

// ---- le hasard ----
function hasard(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function melangerH(a){a=a.slice();for(let i=a.length-1;i>0;i--){const k=hasard(i+1);[a[i],a[k]]=[a[k],a[i]]}return a}
// Répartit k cases entre des « unités » (stagiaires ou équipes) :
// assez de cases → aucun doublon ; sinon équilibré (chaque case sort autant de fois, à une près).
// o.fixe {u:case} (choisi par toi), o.interdit {u:Set} (déjà eu avant), o.prec [nb de sorties avant], o.base [déjà pris ici], o.libre (au hasard pur)
function repartir(units,k,o){
  o=o||{};const fixe=o.fixe||{},interdit=o.interdit||{},prec=o.prec||[],res={};
  if(!k||!units.length)return res;
  const tous=[...Array(k).keys()], ok=(u,c)=>!(interdit[u]&&interdit[u].has(c));
  units.forEach(u=>{if(fixe[u]!=null&&fixe[u]<k)res[u]=fixe[u]});
  const libres=melangerH(units.filter(u=>res[u]==null));
  if(o.libre){libres.forEach(u=>{const p=tous.filter(c=>ok(u,c)),q=p.length?p:tous;res[u]=q[hasard(q.length)]});return res}
  const cnt=tous.map(c=>(o.base&&o.base[c])||0);Object.values(res).forEach(c=>cnt[c]++);
  const slots=[];
  libres.forEach(()=>{
    const min=Math.min(...cnt);let cand=tous.filter(c=>cnt[c]===min);
    const pm=Math.min(...cand.map(c=>prec[c]||0));cand=cand.filter(c=>(prec[c]||0)===pm);
    const c=cand[hasard(cand.length)];cnt[c]++;slots.push(c);
  });
  // on donne les cases en évitant ce que chacun a déjà eu (appariement)
  const match=Array(slots.length).fill(-1);
  const essayer=(ui,vu)=>{for(const s of melangerH(slots.map((_,i)=>i))){if(vu[s]||!ok(libres[ui],slots[s]))continue;vu[s]=1;if(match[s]<0||essayer(match[s],vu)){match[s]=ui;return true}}return false};
  const sans=[];libres.forEach((u,ui)=>{if(!essayer(ui,{}))sans.push(ui)});
  match.forEach((ui,s)=>{if(ui>=0)res[libres[ui]]=slots[s]});
  const restes=slots.filter((_,s)=>match[s]<0);sans.forEach((ui,j)=>{res[libres[ui]]=restes[j]});
  return res;
}
function tailleEquipes(n){
  const t=Math.max(2,+RC.taille||4), f=nb=>{nb=Math.max(1,nb);const b=Math.floor(n/nb),r=n%nb;return Array.from({length:nb},(_,i)=>b+(i<r?1:0))};
  return {plus:f(Math.ceil(n/t)),moins:f(Math.floor(n/t)),exact:n%t===0};
}
function texteTailles(ts){const et=ts.length>1?ts.slice(0,-1).join(', ')+' et '+ts[ts.length-1]:String(ts[0]);return `${ts.length} équipe${ts.length>1?'s':''} (${et} stagiaires)`}
function taillesChoisies(n){const t=tailleEquipes(n);return RC.variante==='moins'&&!t.exact?t.moins:t.plus}
function formerEquipes(ids,tailles){const m=melangerH(ids);let p=0;return tailles.map((t,i)=>{const e={n:LETTRES[i]||String(i+1),ids:m.slice(p,p+t)};p+=t;return e})}
// Une manche : pour chaque roue, un résultat (liste de cases) par stagiaire
function tirerManche(T,ids,cibles,avant){
  const M={};ids.forEach(s=>M[s]=T.roues.map(()=>[]));
  T.roues.forEach((r,k)=>{
    const n=r.cases.length;if(!n)return;
    const prec=Array(n).fill(0), interdit={};
    avant.forEach(A=>Object.entries(A).forEach(([s,v])=>((v&&v[k])||[]).forEach(i=>{prec[i]++;(interdit[s]=interdit[s]||new Set()).add(i)})));
    const fixe={};ids.forEach(s=>{const c=cibles[s]&&cibles[s][k];if(c!=null&&c<n)fixe[s]=c});
    if(T.eq&&r.mode==='equipe'){
      const fx={},it={};
      T.eq.forEach(e=>e.ids.forEach(s=>{if(fixe[s]!=null)fx[e.n]=fixe[s];if(interdit[s])interdit[s].forEach(i=>(it[e.n]=it[e.n]||new Set()).add(i))}));
      const R=repartir(T.eq.map(e=>e.n),n,{fixe:fx,interdit:it,prec,libre:!r.sansDoublon});
      T.eq.forEach(e=>e.ids.forEach(s=>{if(M[s])M[s][k]=[R[e.n]]}));
    }else if(T.eq){
      const glob=Array(n).fill(0);
      melangerH(T.eq).forEach(e=>{
        const membres=e.ids.filter(s=>M[s]);
        const R=repartir(membres,n,{fixe,interdit,prec:prec.map((p,i)=>p*1000+glob[i]),libre:!r.sansDoublon});
        membres.forEach(s=>{M[s][k]=[R[s]];glob[R[s]]++});
        if(r.type==='partie'&&T.deuxParties&&r.sansDoublon&&membres.length&&membres.length<n){
          const pris=new Set(membres.map(s=>R[s])), reste=melangerH([...Array(n).keys()].filter(i=>!pris.has(i))), ordre=melangerH(membres);
          reste.forEach((i,j)=>{const s=ordre[j%ordre.length];M[s][k].push(i);M[s][k].sort((a,b)=>a-b)});
        }
      });
    }else{
      const R=repartir(ids,n,{fixe,interdit,prec,libre:!r.sansDoublon});
      ids.forEach(s=>M[s][k]=[R[s]]);
    }
  });
  return M;
}
function manches(T){const nb=Math.max(0,...Object.values(T.res).map(v=>v.length));return Array.from({length:nb},(_,m)=>{const A={};Object.entries(T.res).forEach(([s,v])=>{if(v[m])A[s]=v[m]});return A})}
// 🎯 choisis avant l'activation → {stagiaire:{numéro de roue: numéro de case}}
function ciblesIndex(T,ids){
  const out={};
  ids.forEach(s=>{const c=RC.cibles[s];if(!c)return;
    T.roues.forEach((r,k)=>{const key=c[r.type];if(key==null)return;const i=r.cases.findIndex(x=>(x.f||roueCle(x.t))===key);if(i>=0)(out[s]=out[s]||{})[k]=i})});
  return out;
}
function construireTirage(){
  const ids=acceptes().map(x=>x.id);
  const roues=RC.choisies.map(type=>({type,emoji:roueType(type).emoji,titre:titreRoue(type),
    cases:casesCochees(type).map(c=>c.f?{t:c.t,f:c.f}:{t:c.t}),sansDoublon:sansDoublon(type),mode:RC.equipes?modeRoue(type):'stag'})).filter(r=>r.cases.length);
  const T={id:nouvelId(),v:1,at:Date.now(),actif:true,fiches:!!RC.fiches,roues,eq:null,res:{}};
  if(RC.equipes&&ids.length>1){T.eq=formerEquipes(ids,taillesChoisies(ids.length));if(RC.deuxParties)T.deuxParties=true}
  const cib=ciblesIndex(T,ids), M=tirerManche(T,ids,cib,[]);
  ids.forEach(s=>T.res[s]=[M[s]]);
  const mq={};Object.entries(cib).forEach(([s,v])=>Object.keys(v).forEach(k=>(mq[s]=mq[s]||{})['0:'+k]=1));
  return {T,mq};
}
function nouveauxSansResultat(T){return acceptes().filter(x=>!T.res[x.id])}
function ajouterNouveaux(T,nouv){
  const nb=Math.max(1,...Object.values(T.res).map(v=>v.length));
  nouv.forEach(s=>{
    if(T.eq&&T.eq.length){const min=Math.min(...T.eq.map(e=>e.ids.length)),c=T.eq.filter(e=>e.ids.length===min);c[hasard(c.length)].ids.push(s)}
    T.res[s]=[];
    for(let m=0;m<nb;m++){
      const res=T.roues.map((r,k)=>{
        const n=r.cases.length;if(!n)return [];
        const E_=T.eq&&T.eq.find(e=>e.ids.includes(s));
        const groupe=(E_?E_.ids:Object.keys(T.res)).filter(x=>x!==s&&T.res[x]&&T.res[x][m]);
        if(E_&&r.mode==='equipe'&&groupe.length)return T.res[groupe[0]][m][k].slice();
        const base=Array(n).fill(0);groupe.forEach(x=>(T.res[x][m][k]||[]).forEach(i=>base[i]++));
        const it=new Set();T.res[s].forEach(v=>(v[k]||[]).forEach(i=>it.add(i)));
        return [repartir([s],n,{base,interdit:{[s]:it},libre:!r.sansDoublon})[s]];
      });
      T.res[s].push(res);
    }
  });
}
// Choisir le résultat d'un stagiaire après coup (dernière manche) : échange avec quelqu'un qui n'a pas encore lancé
function choisirApres(T,X,k,c){
  const m=T.res[X].length-1, r=T.roues[k], L=(ROUE.lances[T.id]||{}), aLance=s=>(L[s]||0)>=m+1, nom=s=>STAG[s]?STAG[s].prenom:'?';
  const ancien=T.res[X][m][k].slice(), notes=[];
  if(ancien.length===1&&ancien[0]===c)return notes;
  if(T.eq&&r.mode==='equipe'){
    const e=T.eq.find(e=>e.ids.includes(X));
    if(r.sansDoublon){const autre=T.eq.find(f=>f!==e&&f.ids.some(s=>T.res[s]&&T.res[s][m]&&(T.res[s][m][k]||[]).includes(c)));
      if(autre){if(autre.ids.some(aLance))notes.push(`L'équipe ${autre.n} a aussi cette case (elle a déjà lancé la roue).`);else autre.ids.forEach(s=>{if(T.res[s]&&T.res[s][m])T.res[s][m][k]=ancien.slice()})}}
    e.ids.forEach(s=>{if(T.res[s]&&T.res[s][m])T.res[s][m][k]=[c]});
    if(e.ids.some(aLance))notes.push(`Quelqu'un de l'équipe ${e.n} a déjà lancé la roue : il verra le nouveau résultat en rouvrant la roue.`);
  }else{
    const groupe=T.eq?(T.eq.find(e=>e.ids.includes(X))||{ids:[]}).ids:Object.keys(T.res);
    const neuf=[c].concat(ancien.slice(1).filter(i=>i!==c));
    if(r.sansDoublon){
      const tient=groupe.filter(s=>s!==X&&T.res[s]&&T.res[s][m]&&(T.res[s][m][k]||[]).includes(c));
      const Y=tient.find(s=>!aLance(s)&&T.res[s][m][k].length===1);
      if(Y)T.res[Y][m][k]=[ancien[0]];
      else if(tient.length)notes.push(`${tient.map(nom).join(', ')} a aussi cette case (déjà lancé) : ce sera un doublon.`);
    }
    T.res[X][m][k]=neuf;
    if(aLance(X))notes.push(`${nom(X)} a déjà lancé la roue : il verra son nouveau résultat en rouvrant la roue.`);
  }
  return notes;
}

function resumeRepartition(n){
  return RC.choisies.map(type=>{const k=casesCochees(type).length;if(!k)return `${roueType(type).emoji} aucune case cochée`;
    const u=RC.equipes&&modeRoue(type)==='equipe'?taillesChoisies(n).length:n, qui=RC.equipes&&modeRoue(type)==='equipe'?'équipe':'stagiaire';

    if(RC.equipes&&modeRoue(type)==='stag')return `${roueType(type).emoji} ${k} cases, toutes différentes dans chaque équipe`;
    if(u<=k)return `${roueType(type).emoji} ${k} cases pour ${u} ${qui}${u>1?'s':''} : aucun doublon`;
    const b=Math.floor(u/k);return `${roueType(type).emoji} ${k} cases pour ${u} ${qui}s : chaque case sort ${u%k?`${b+1} ou ${b}`:b} fois`;
  }).join('<br>');

// ======= 📽️ Mode projection : vrai tirage au hasard, tout de suite, en grand =======
function projection(){
  if(!RC)RC=roueConf();
  const roues=RC.choisies.map(type=>({type,emoji:roueType(type).emoji,titre:titreRoue(type),cases:casesCochees(type).map(c=>c.f?{t:c.t,f:c.f}:{t:c.t})})).filter(r=>r.cases.length);
  if(!roues.length){alert('Choisis au moins une roue et coche des cases.');return}
  const P={sans:true,sortis:roues.map(()=>new Set()),force:roues.map(()=>null),qui:'',hist:[],en:false,dernier:null,W:null,vue:0};
  const ov=document.createElement('div');ov.id='proj';document.body.appendChild(ov);document.body.style.overflow='hidden';
  try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)}catch(e){}
  ov.innerHTML=`<div class="pj-g"><div class="pj-t" id="pjt"></div><div id="pjw" class="pj-w"></div></div>
   <div class="pj-d">
    <select id="pjqui" class="pj-sel"><option value="">👤 Pour qui ? (personne)</option>${acceptes().map(x=>`<option value="${esc(x.prenom)}">${esc(x.prenom)} ${esc(x.nom)}</option>`).join('')}</select>
    <div class="pj-res" id="pjres"><span class="pj-mute">Appuie sur « Lancer » ou sur la barre Espace</span></div>
    <button class="pj-go" id="pjgo">🎡 Lancer</button>
    <button class="pj-b hide" id="pjfi">📋 Voir la fiche</button>
    <div class="pj-o"><label><input type="checkbox" id="pjsans" checked> Sans répétition</label><button class="pj-b2" id="pjrem">↩️ Remettre toutes les cases</button><button class="pj-b2" id="pjson"></button></div>
    <div class="pj-h" id="pjh"></div>
    <button class="pj-b2" id="pjq" style="align-self:flex-start">✕ Quitter</button>
   </div>
   <button class="pj-disc" id="pjdisc" aria-label="Réglages">·</button><div class="pj-menu hide" id="pjm"></div>
   <div class="pj-fiche hide" id="pjf"></div>`;
  const $=id=>document.getElementById(id);
  const restes=k=>roues[k].cases.map((c,i)=>i).filter(i=>!(P.sans&&P.sortis[k].has(i)));
  const afficher=k=>{P.vue=k;const r=roues[k],ix=restes(k);$('pjt').textContent=`${r.emoji} ${r.titre}${roues.length>1?` · ${k+1}/${roues.length}`:''}`;
    P.W=creerRoue($('pjw'),ix.map(i=>r.cases[i]),{titre:r.titre});P.W.ix=ix;return P.W};
  const majSon=()=>{$('pjson').textContent=roueSonActif()?'🔊 Son':'🔇 Son coupé'};majSon();
  const majDisc=()=>{$('pjdisc').classList.toggle('arme',P.force.some(x=>x!=null))};
  afficher(0);
  const lancer=async()=>{
    if(P.en)return;
    if(roues.some((r,k)=>!restes(k).length)){$('pjres').innerHTML=`<span class="pj-mute">Toutes les cases sont sorties. Touche « ↩️ Remettre toutes les cases ».</span>`;return}
    P.en=true;roueAudioPret();$('pjgo').disabled=true;$('pjfi').classList.add('hide');$('pjf').classList.add('hide');$('pjm').classList.add('hide');
    const qui=$('pjqui').value, sortie=[];
    $('pjres').innerHTML=qui?`<div class="pj-qui">Pour ${esc(qui)}</div>`:'';
    for(let k=0;k<roues.length;k++){
      const W=afficher(k), ix=W.ix;
      let i=P.force[k]!=null&&ix.includes(P.force[k])?P.force[k]:ix[hasard(ix.length)];
      P.force[k]=null;
      await new Promise(r=>setTimeout(r,k?400:30));
      await W.tourner(ix.indexOf(i));
      sortie.push({type:roues[k].type,titre:roues[k].titre,emoji:roues[k].emoji,cases:[roues[k].cases[i]],i});
      $('pjres').innerHTML=(qui?`<div class="pj-qui">Pour ${esc(qui)}</div>`:'')+sortie.map(x=>`<div class="pj-l"><small>${x.emoji} ${esc(x.titre)}</small>${esc(nomCase(x.cases[0]))}</div>`).join('');
      if(k<roues.length-1)await new Promise(r=>setTimeout(r,1200));
    }
    if(P.sans)sortie.forEach((x,k)=>P.sortis[k].add(x.i));
    if(roues.length>1){const M=phraseMission(sortie);if(M.phrase)$('pjres').innerHTML+=`<div class="pj-ph">🎯 ${esc(M.phrase)}</div>`}
    P.dernier=sortie;P.hist.unshift((qui?qui+' → ':'')+sortie.map(x=>etiquetteCase(x.cases[0])).join(' · '));
    $('pjh').innerHTML=P.hist.slice(0,8).map(t=>`<div>${esc(t)}</div>`).join('');
    $('pjfi').classList.toggle('hide',!sortie.some(x=>x.cases[0].f&&ficheRoue(x.cases[0].f)));
    $('pjgo').disabled=false;P.en=false;majDisc();
  };
  const fiche=()=>{if(!P.dernier)return;const fs=P.dernier.map(x=>x.cases[0].f&&ficheRoue(x.cases[0].f)).filter(Boolean);if(!fs.length)return;
    $('pjf').innerHTML=fs.map(htmlFiche).join('')+`<button class="pj-b" id="pjfx">✕ Fermer la fiche</button>`;$('pjf').classList.remove('hide');$('pjfx').onclick=()=>$('pjf').classList.add('hide')};
  const quitter=()=>{document.removeEventListener('keydown',clavier);ov.remove();document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}};
  const menu=()=>{const m=$('pjm');if(!m.classList.contains('hide')){m.classList.add('hide');return}
    m.innerHTML=roues.map((r,k)=>`<select data-pf="${k}"><option value="">${esc(r.emoji)} hasard</option>${restes(k).map(i=>`<option value="${i}" ${P.force[k]===i?'selected':''}>${esc(etiquetteCase(r.cases[i]))}</option>`).join('')}</select>`).join('');
    m.classList.remove('hide');m.querySelectorAll('[data-pf]').forEach(s=>s.onchange=()=>{P.force[+s.dataset.pf]=s.value===''?null:+s.value;majDisc()})};
  function clavier(e){
    if(e.target&&/SELECT|INPUT/.test(e.target.tagName)&&e.key!=='Escape')return;
    if(e.code==='Space'||e.key===' '){e.preventDefault();lancer()}
    else if(e.key==='Escape'){if(!$('pjf').classList.contains('hide'))$('pjf').classList.add('hide');else if(!$('pjm').classList.contains('hide'))$('pjm').classList.add('hide')}
    else if(e.key==='f'||e.key==='F')fiche();
  }
  document.addEventListener('keydown',clavier);
  $('pjgo').onclick=lancer;$('pjfi').onclick=fiche;$('pjq').onclick=quitter;$('pjdisc').onclick=menu;
  $('pjsans').onchange=e=>{P.sans=e.target.checked;afficher(P.vue)};
  $('pjrem').onclick=()=>{P.sortis.forEach(s=>s.clear());afficher(0);$('pjres').innerHTML='<span class="pj-mute">Toutes les cases sont remises.</span>'};
  $('pjson').onclick=()=>{roueSonChanger(!roueSonActif());majSon()};
  return P;
}

// ---- les quiz d'Hamid, pour un autre formateur (si Hamid l'a coché) ----
function quizHamidEcran(){
  if(!peut('quiz'))return accueil();
  const L=[];
  JOURNEES.forEach(j=>{const z=quizDe(j);if(!quizVide(z))L.push({tag:j.titre,titre:j.theme,z,o:estOuvert(ETAT[j.id]),c:()=>Object.assign(cibleJournee(j),{retour:quizHamidEcran,editer:null})})});
  Object.values(REVS).sort((a,b)=>b.cree-a.cree).forEach(r=>L.push({tag:'Révision',titre:r.titre,z:r.quiz,o:estOuvert(r),c:()=>Object.assign(cibleRevision(r),{retour:quizHamidEcran,editer:null})}));
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>📂 Les quiz de Hamid</h1>`;
  if(!L.length)h+=`<div class="card"><p class="muted" style="margin:0">Pas encore de quiz.</p></div>`;

function mesQuizF(){const q=moiF();return Object.values(QUIZF).filter(x=>q&&x.auteur&&x.auteur.id===q.id).sort((a,b)=>String(b.quand||'').localeCompare(String(a.quand||''))||(b.cree||0)-(a.cree||0))}
function noterLocalQF(id,champs){
  const lq=lire('local_quizf',{});
  let v=lq[id]; if(!v||Date.now()-v.at>15*60*1000)v={};
  lq[id]=Object.assign(v,champs,{at:Date.now()});
  Object.keys(lq).forEach(k=>{if(Date.now()-lq[k].at>24*3600*1000)delete lq[k]});
  ecrire('local_quizf',lq);
  if(champs.supprime)delete QUIZF[id];else QUIZF[id]=Object.assign(QUIZF[id]||{id,ouvert:false,duree:0},champs);
}
async function enregistrerQuizF(r,propre){
  const c={id:r.id,titre:r.titre,quand:r.quand,label:r.label,auteur:r.auteur,quiz:propre};

// ======= 06/11 : « 💻 Ouvrir mon espace sur mon PC » : QR code + lien (#p=…) =======
// Le lien emporte les notes et réglages de cet appareil (clés cqpf_…), jamais le code ni le blocage.
// Sur l'autre appareil, le code est toujours demandé ; les données ne sont copiées qu'après le bon code,
// et seulement si c'est la même personne. Une seule fois, 7 jours ; jamais bloqué à cause de la connexion.
function idAppareilF(){let d=lire('dev_id','');if(!d){d=nouvelId();ecrire('dev_id',d)}return d}
function empreinteLienF(t){let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36)+'_'+t.length}
const CLES_NON_TRANSPORT=['ok','bloque','qui','dev_id','liens_utilises'];
function cleTransportable(k){return typeof k==='string'&&!!k&&!CLES_NON_TRANSPORT.includes(k)}
function donneesAppareil(){
  const s={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.startsWith('cqpf_')&&cleTransportable(k.slice(5))){const v=localStorage.getItem(k);if(v!=null)s[k.slice(5)]=v}}}catch(e){}
  return s;
}
async function lienPC(n){
  const s=donneesAppareil(), q=estAdmin()?'admin':((moiF()||{}).id||'');
  // si c'est trop long : on enlève d'abord les copies de 15 min (local_…), puis les plus longues
  const ordre=Object.keys(s).sort((a,b)=>((a.startsWith('local_')?0:1)-(b.startsWith('local_')?0:1))||(s[b].length-s[a].length));
  let retires=0;
  for(;;){
    const t=await encoderLien({v:1,c:Math.round(Date.now()/1000),n,d:idAppareilF(),q,s});
    if(t.length<=60000||!ordre.length)return {lien:location.origin+location.pathname+'#p='+t,retires};
    delete s[ordre.shift()];retires++;
  }
}
async function ecranPC(){
  const adm=estAdmin(), titre='💻 Ouvrir mon espace sur mon PC';
  app.innerHTML=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>${titre}</h1><p class="muted">Préparation…</p>`;
  document.getElementById('bk').onclick=accueil;
  haut();
  let R=null;try{R=await lienPC(nouvelId().slice(0,10))}catch(e){R=null}
  if(!R){app.innerHTML=`<button class="back" id="bk">← Retour</button><div class="card r"><h2>Je n'ai pas pu préparer le lien</h2><p>Réessaie dans un moment.</p></div>`;document.getElementById('bk').onclick=accueil;return}
  let qr=null;try{qr=R.lien.length<=2900&&typeof qrSvg==='function'?qrSvg(R.lien):null}catch(e){qr=null}
  app.innerHTML=`<button class="back" id="bk">← Retour</button><div class="tag">Espace formateur</div><h1>${titre}</h1>
   <div class="card o nopli">
    <h2>Ouvre ce lien sur ton ordinateur</h2>
    <p style="margin:0">Touche « 📤 M'envoyer le lien », envoie-le-toi (par e-mail ou WhatsApp), puis ouvre-le sur ton ordinateur. Ton code te sera demandé.</p>
    ${qr?`<div class="qr">${qr}</div><p class="muted" style="margin:4px 0 0;text-align:center">Si ton ordinateur a une caméra, tu peux aussi viser ce code.</p>`:`<p class="muted" style="margin:10px 0 0">Tes notes sont trop longues pour tenir dans un code à viser : utilise « 📤 M'envoyer le lien ».</p>`}
    <button class="btn" id="env">📤 M'envoyer le lien</button>
    <div class="lien hide" id="lien"></div>
    <div class="ok hide" id="okl" style="margin-top:10px"></div>
   </div>
   <div class="card j nopli"><h2>⚠️ À savoir</h2>
    <p style="margin:0 0 8px">• Le lien marche <b>une seule fois</b>, pendant <b>7 jours</b>.</p>
    <p style="margin:0 0 8px">• Ton code est demandé sur l'ordinateur : le lien seul n'ouvre pas ton espace.</p>
    <p style="margin:0">• Il emporte tes notes et tes réglages de cet appareil${adm?' (pas tes musiques ni tes documents : ils restent sur ce téléphone)':' (pas tes documents : ils restent sur ce téléphone)'}. Ton espace reste aussi ouvert sur ce téléphone.</p>
    ${R.retires?`<p style="margin:8px 0 0;color:var(--ja)">• Tes notes sont très nombreuses : les plus longues ne sont pas dans le lien.</p>`:''}</div>
   <button class="btn sec" id="bk2">← Retour à l'accueil</button>`;
  document.getElementById('bk').onclick=accueil;document.getElementById('bk2').onclick=accueil;
  document.getElementById('env').onclick=async()=>{
    const ok=document.getElementById('okl'), zl=document.getElementById('lien');
    if(navigator.share){try{await navigator.share({title:'Mon espace formateur CQP',text:'Mon lien pour ouvrir mon espace formateur CQP sur mon ordinateur (une seule fois) :',url:R.lien});return}catch(e){if(e&&e.name==='AbortError')return}}
    const c=await copier(R.lien);
    zl.textContent=R.lien;zl.classList.remove('hide');
    ok.textContent=c?'✅ Lien copié : colle-le dans un message pour toi (e-mail ou WhatsApp).':'Appuie longtemps sur le lien ci-dessus, puis choisis « Copier ».';
    ok.classList.remove('hide');
  };
}
// Sur le nouvel appareil, juste après le bon code
async function appliquerLienPC(){
  const t=LIEN_PC; LIEN_PC=null;
  const fin=(titre,texte,cls)=>{app.innerHTML=`<div class="tag">Espace formateur</div><h1>💻 Mon espace sur cet appareil</h1>
    <div class="card nopli ${cls}"><h2>${titre}</h2><p>${texte}</p><button class="btn" id="okc">Continuer</button></div>`;
    document.getElementById('okc').onclick=demarrer;haut()};
  app.innerHTML=`<p class="muted">Chargement…</p>`;
  let p;
  try{p=await decoderLien(t);if(!p||p.v!==1||!p.s||typeof p.s!=='object')throw 0}
  catch(e){return fin('Lien abîmé',"Ce lien ne marche pas. Fabrique-en un nouveau depuis ton autre appareil.",'r')}
  if(!p.c||Date.now()-p.c*1000>7*24*3600*1000)return fin('Lien expiré',"Ce lien n'est plus valable (7 jours). Fabrique-en un nouveau depuis ton autre appareil.",'r');
  const qui=estAdmin()?'admin':((moiF()||{}).id||'');
  if(!qui||p.q!==qui)return fin("Ce lien n'est pas le tien","Ce lien a été fabriqué dans l'espace d'un autre formateur. Rien n'a été copié sur cet appareil.",'r');
  const cle=empreinteLienF(t), U=lire('liens_utilises',[]);
  if(U.includes(cle))return fin('Lien déjà utilisé',"Ce lien a déjà été utilisé sur cet appareil.",'j');
  if(p.d&&p.d===idAppareilF())return fin("Ouvre-le sur l'autre appareil","Ce lien a été fabriqué sur cet appareil-ci. Ouvre-le sur ton ordinateur.",'j');
  // lien déjà ouvert sur un autre appareil ? (si le tableau répond ; sinon on continue)
  if(p.n){try{const g=await etatGeneral(), u=g.liensUtilises&&g.liensUtilises[p.n];
    if(u&&u!==idAppareilF())return fin('Lien déjà utilisé',"Ce lien a déjà été ouvert sur un autre appareil. Fabrique-en un nouveau depuis ton autre appareil.",'j')}catch(e){}}
  let n=0;
  Object.entries(p.s).forEach(([k,v])=>{if(!cleTransportable(k)||typeof v!=='string')return;try{localStorage.setItem('cqpf_'+k,v);n++}catch(e){}});
  U.push(cle);ecrire('liens_utilises',U.slice(-50));
  if(p.n)envoyerForm(FORM_QUIZ,{[EQ.journee]:'lienf',[EQ.statut]:'utilise',[EQ.contenu]:JSON.stringify({n:p.n,dev:idAppareilF()})}).catch(()=>{});
  fin("✅ C'est bon, ton espace est sur cet appareil",`Tes notes et tes réglages sont récupérés (${n} élément${n>1?'s':''}). La prochaine fois, ouvre simplement l'adresse habituelle de ton espace formateur.`,'g');
}

const MEMO_CLE='cqpf_ecran';
const MEMO_ECRANS={
 accueil:{},
 journee:{cle:j=>j&&j.id,trouver:id=>JOURNEES.find(x=>x.id===id)},
 diapos:{cle:j=>j&&j.id,trouver:id=>JOURNEES.find(x=>x.id===id)},
 monQuiz:{cle:j=>j&&j.id,trouver:id=>JOURNEES.find(x=>x.id===id)},
 mesStagiaires:{}, bilanStagiaire:{cle:x=>x&&x.id,trouver:id=>STAG&&STAG[id]},
 revisionEcran:{}, observationsEcran:{}, mesExercices:{}, coursPrepEcran:{}, roueEcran:{},
 ecranFiches:{cle:c=>c,trouver:c=>c}, mesDocuments:{}
};
// ======= 30/10 : quand on actualise la page, on reste sur le même écran (mémoire de l'onglet seulement) =======
(function(){
  const K=MEMO_CLE, ss={get(){try{return JSON.parse(sessionStorage.getItem(K)||'null')}catch(e){return null}},set(o){try{sessionStorage.setItem(K,JSON.stringify(o))}catch(e){}}};
  let premier=true, enCours=false, tY=null;
  const cible=MEMO_ECRANS;
  for(const nom of Object.keys(cible)){
    const fn=window[nom]; if(typeof fn!=='function') continue;
    const cle=cible[nom].cle||(()=>null);
    window[nom]=function(...a){ if(!enCours){ try{ss.set({s:nom,k:cle(...a),y:0})}catch(e){} } return fn.apply(this,a) };
  }
  const accOrig=window.accueil;
  window.accueil=function(...a){
    if(premier){ premier=false; const m=ss.get();
      if(m&&m.s&&m.s!=='accueil'&&cible[m.s]&&ecranPermis(m.s)){ try{ const arg=cible[m.s].trouver?cible[m.s].trouver(m.k):undefined;
          if(!cible[m.s].trouver||arg){ enCours=true; const r=window[m.s](arg); enCours=false; ss.set(m);
            const y=+m.y||0; if(y) Promise.resolve(r).then(()=>setTimeout(()=>window.scrollTo(0,y),350));
            return r } }catch(e){ enCours=false } } }
    return accOrig.apply(this,a) };
  addEventListener('scroll',()=>{ clearTimeout(tY); tY=setTimeout(()=>{ const m=ss.get(); if(m){ m.y=Math.round(window.scrollY); ss.set(m) } },250) },{passive:true});
})();
// 06/11 : lien d'un autre formateur (#fc=son code) : connexion directe, le code est retiré de l'adresse
async function connexionLien(code){
  app.innerHTML=`<p class="muted">Connexion…</p>`;
  const h=await empreinte(code);
  let g=null;try{g=await etatGeneral()}catch(e){g=null}
  if(!g)return ecranCode("Je n'arrive pas à vérifier ton lien. Vérifie ta connexion internet, puis touche encore le lien.");
  const f=(g.formateurs||[]).find(x=>x.h===h);
  if(!f)return ecranCode("Ton lien n'est pas encore prêt, ou il a été remplacé. Réessaie dans quelques minutes, ou demande un nouveau lien à Hamid.");
  ecrire('bloque',{n:0,jusqua:0});ecrire('ok',h);ecrire('qui',{id:f.id,prenom:f.prenom,nom:f.nom,h});demarrer();
}
// 06/11 : lien d'invitation (#fi=…) : le formateur écrit son prénom et son nom, puis il est dans son espace
function ecranRejoindre(t,msg){
  app.innerHTML=`<div class="tag">CQP Instructeur Fitness – Cours collectifs</div><h1>Espace formateur</h1>
  <div class="card o"><h2>👋 Bienvenue</h2><p class="muted" style="margin-top:0">Écris ton prénom et ton nom, puis touche « Valider ».</p>
   <label for="jp" style="margin-top:0">Prénom</label><input id="jp" type="text" autocomplete="given-name" maxlength="40">
   <label for="jn">Nom</label><input id="jn" type="text" autocomplete="family-name" maxlength="40">
   <div class="err ${msg?'':'hide'}" id="jer">${msg?esc(msg):''}</div>
   <button class="btn" id="jok">✅ Valider</button></div>`;
  const er=document.getElementById('jer'),b=document.getElementById('jok'),dire=x=>{er.textContent=x;er.classList.remove('hide')};
  b.onclick=async()=>{er.classList.add('hide');
    const prenom=document.getElementById('jp').value.trim().replace(/\s+/g,' '), nom=document.getElementById('jn').value.trim().replace(/\s+/g,' ');
    if(!prenom)return dire('Écris ton prénom.');if(!nom)return dire('Écris ton nom.');
    b.disabled=true;b.textContent='⏳ Un instant…';const fin=()=>{b.disabled=false;b.textContent='✅ Valider'};
    const p=await empreinte('fi:'+t);let g=null;try{g=await etatGeneral()}catch(e){g=null}
    if(!g){fin();return dire("Pas de connexion internet. Vérifie ta connexion, puis réessaie.")}
    if(g.inviteF!==p){fin();return dire("Ce lien n'est pas encore prêt, ou il a été changé. Réessaie dans quelques minutes, sinon demande le nouveau lien à Hamid.")}
    const id=nouvelId(), h=await empreinte(codeAuto()+codeAuto()), f={id,prenom,nom,h,at:Date.now()};
    try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:'formateurs',[EQ.statut]:'inscription',[EQ.contenu]:JSON.stringify(Object.assign({p},f))})}
    catch(e){fin();return dire("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.")}
    ecrire('local_inscrit',{f,at:Date.now()});ecrire('bloque',{n:0,jusqua:0});ecrire('ok',h);ecrire('qui',{id,prenom,nom,h});demarrer()};
}
const lireFI=()=>{const t=location.hash.match(/^#fi=([A-Za-z0-9]{10,60})/);if(t){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}return t[1]}return null};
const lireFC=()=>{const t=location.hash.match(/^#fc=([A-Za-z0-9]{6,40})/);if(t){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}return t[1]}return null};
{const t=location.hash.match(/^#p=([A-Za-z0-9_-]+)/);
 if(t){LIEN_PC=t[1];try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
{const fi=lireFI(), fc=lireFC();
 fi&&!LIEN_PC&&!estAdmin()&&!moiF() ? ecranRejoindre(fi) : fc&&!LIEN_PC&&!estAdmin() ? connexionLien(fc) : LIEN_PC ? ecranCode() : (estAdmin()||moiF()) ? demarrer() : ecranCode();}
// si l'espace est déjà ouvert dans cet onglet, le lien ne recharge pas la page
window.addEventListener('hashchange',()=>{const fi=lireFI();if(fi&&!estAdmin()&&!moiF())return ecranRejoindre(fi)});
window.addEventListener('hashchange',()=>{const fc=lireFC();if(fc&&!estAdmin())return connexionLien(fc)});
window.addEventListener('hashchange',()=>{const t=location.hash.match(/^#p=([A-Za-z0-9_-]+)/);if(t){LIEN_PC=t[1];try{history.replaceState(null,'',location.pathname+location.search)}catch(e){};ecranCode()}});
</script>
