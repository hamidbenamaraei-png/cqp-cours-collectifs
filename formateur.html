<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Espace formateur – CQP Cours collectifs</title>
<style>
:root{--bg:#10162b;--card:#1c2442;--line:#2c365c;--txt:#fff;--soft:#c9cfe6;--mute:#8a92b2;--or:#ff7a3d;--ok:#4cc38a;--ko:#ff5d6c;--bl:#4c8dff;--ja:#f5c451}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.tag{color:var(--or);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:26px;margin:4px 0 18px;line-height:1.2}
h2{font-size:20px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 16px;border-top:5px solid var(--bl)}
.card.o{border-top-color:var(--or)}.card.g{border-top-color:var(--ok)}.card.r{border-top-color:var(--ko)}.card.j{border-top-color:var(--ja)}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:17px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--or);color:#10162b;font-weight:800;font-size:18px;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
.btn.sec{background:#2a3566;color:#fff}
.btn.wa{background:#25d366;color:#0b2416}
.btn.ko{background:#3a1c25;color:var(--ko)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;cursor:pointer;padding:6px 0;font-family:inherit;text-align:left}
.back{background:none;border:0;color:var(--soft);font-size:16px;cursor:pointer;padding:8px 0;font-family:inherit}
.muted{color:var(--mute);font-size:15px}
.err{color:var(--ko);font-weight:700;margin-top:10px}
.ok{color:var(--ok);font-weight:700;margin-top:10px}
.hide{display:none!important}
.big{font-size:40px;font-weight:800;line-height:1}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border-bottom:0}
.pill{display:inline-block;min-width:52px;text-align:center;padding:3px 10px;border-radius:999px;font-weight:800;font-size:15px;white-space:nowrap}
.p-ok{background:#173528;color:var(--ok)}.p-moy{background:#3a321a;color:var(--ja)}.p-ko{background:#3a1c25;color:var(--ko)}
.stag{background:#141b33;border-radius:12px;padding:12px 14px;margin:10px 0}
.stag b{font-size:17px}
.stag .d{margin-top:6px;color:var(--soft);font-size:15px}
.rec{background:var(--ko)!important;color:#fff!important}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--soft)}
.check input{width:22px;height:22px}
#resume{min-height:260px;font-size:15px}
.slide{width:100%;border-radius:12px;display:block;margin:0 0 12px;border:1px solid var(--line)}
.scale{display:flex;gap:8px;margin-top:4px}
.scale button{flex:1;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.scale button.on{background:var(--or);border-color:var(--or);color:#10162b}
.q{margin:16px 0 6px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
.opt.on{border-color:var(--or);background:#2a2230}
.opt.good{border-color:var(--ok);background:#173528}
.expl{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:#141b33;font-size:15px;color:var(--soft)}
.statut{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.ligne{display:flex;gap:8px;align-items:center;margin:8px 0}
.ligne input{flex:1}
.x{flex:none;width:44px;height:48px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:var(--ko);font-size:20px;cursor:pointer}
.bonne{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:var(--mute);font-size:20px;cursor:pointer}
.bonne.on{background:var(--ok);border-color:var(--ok);color:#0b2416}
.qed{background:#141b33;border-radius:14px;padding:14px;margin:14px 0;border-left:4px solid var(--or)}
.qed textarea,.qed input{background:#1c2442}
/* Feuille papier */
.feuille{background:#fff;color:#111;border-radius:6px;padding:26px 24px;font-size:15px;line-height:1.4}
.feuille h3{margin:0 0 4px;font-size:19px}
.feuille .sub{color:#444;margin:0 0 14px}
.feuille .champ{display:flex;gap:10px;margin:8px 0}
.feuille .champ span{flex:none;font-weight:700}
.feuille .champ i{flex:1;border-bottom:1.5px solid #333}
.feuille .bloc{border:1.5px solid #333;border-radius:8px;padding:10px 12px;margin:14px 0}
.feuille .bloc h4{margin:0 0 6px;font-size:16px}
.feuille .rs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #ccc}
.feuille .rs:last-child{border-bottom:0}
.feuille .ronds{flex:none;white-space:nowrap;letter-spacing:6px;font-size:17px}
.feuille .qq{margin:10px 0 4px;font-weight:700}
.feuille .oo{margin:3px 0 3px 8px}
.feuille .ex{margin:4px 0 0 8px;font-style:italic;color:#333}
.feuille .zone{height:70px}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .feuille{border-radius:0;padding:0}
  .feuille .bloc{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="commun.js"></script>
<script>
// ======= Réglages propres au formateur =======
// Empreinte du code d'accès (le code lui-même n'est pas écrit ici)
const CODE_HASH = '9de007567a93e86a677452886d8b9326ecf5a0726172be9c57b017546bb21146';
// Lien du groupe WhatsApp des formateurs : vide = WhatsApp demande à qui envoyer
const WHATSAPP_GROUPE = '';

// ======= Outils =======
function lire(k,d){try{const v=localStorage.getItem('cqpf_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function ecrire(k,v){try{localStorage.setItem('cqpf_'+k,JSON.stringify(v))}catch(e){}}
const app = document.getElementById('app');
function haut(){window.scrollTo(0,0)}
async function empreinte(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cqp-cc:'+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function classe(v,max){const p=max?v/max:0;return p>=0.8?'p-ok':p>=0.6?'p-moy':'p-ko'}
function ouvrirWhatsApp(txt,groupe){
  const url=(groupe&&WHATSAPP_GROUPE)?WHATSAPP_GROUPE:('https://wa.me/?text='+encodeURIComponent(txt));
  window.location.href=url;
}
async function copier(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){return false}}

// ======= État des quiz (tableau Google + ce que tu viens de faire sur ce téléphone) =======
// Le tableau Google met quelques minutes à se mettre à jour : pendant 15 min, ce téléphone
// se fie à ce que tu viens d'enregistrer.
let ETAT = null;
async function chargerEtat(){
  try{ETAT=await etatQuiz()}catch(e){ETAT=null}
  if(!ETAT){ETAT={};JOURNEES.forEach(j=>ETAT[j.id]={quiz:j.quiz,ouvert:false,horsLigne:true})}
  JOURNEES.forEach(j=>{
    const loc=lire('local_'+j.id,null);
    if(loc && Date.now()-loc.at<15*60*1000){
      if(loc.quiz)ETAT[j.id].quiz=loc.quiz;
      if(typeof loc.ouvert==='boolean')ETAT[j.id].ouvert=loc.ouvert;
    }
  });
}
function noterLocal(id,champ,val){
  const loc=lire('local_'+id,{}); if(!loc.at||Date.now()-loc.at>15*60*1000){delete loc.quiz;delete loc.ouvert}
  loc[champ]=val; loc.at=Date.now(); ecrire('local_'+id,loc);
}
function quizDe(j){return (ETAT&&ETAT[j.id]&&ETAT[j.id].quiz)||j.quiz}

// ======= Écran : code =======
function ecranCode(){
  app.innerHTML=`<div class="tag">CQP Instructeur Fitness – Cours collectifs</div><h1>Espace formateur</h1>
  <div class="card o"><h2>Code d'accès</h2>
   <input type="password" id="c" inputmode="numeric" autocomplete="off" placeholder="••••••">
   <div class="err hide" id="er">Code incorrect.</div>
   <button class="btn" id="go">Entrer</button>
   <p class="muted" style="margin-top:14px"><a href="./" style="color:var(--mute)">← Retour à l'espace stagiaires</a></p></div>`;
  const go=async()=>{
    const h=await empreinte(document.getElementById('c').value.trim());
    if(h===CODE_HASH){ecrire('ok',h);demarrer()}else document.getElementById('er').classList.remove('hide');
  };
  document.getElementById('go').onclick=go;
  document.getElementById('c').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function demarrer(){
  app.innerHTML=`<p class="muted">Chargement…</p>`;
  await chargerEtat(); accueil();
}

// ======= Écran : accueil =======
function accueil(){
  let h=`<div class="tag">Espace formateur</div><h1>Bonjour Hamid 👋</h1>`;
  JOURNEES.slice().reverse().forEach(j=>{
    const o=ETAT[j.id].ouvert;
    h+=`<div class="card"><div class="tag" style="color:var(--soft)">${esc(j.titre)}</div><h2 style="margin-top:4px">${esc(j.theme)}</h2>
    <div class="statut" style="font-size:15px"><span class="dot" style="background:${o?'var(--ok)':'var(--mute)'}"></span>${o?'Quiz ouvert aux stagiaires':'Quiz caché aux stagiaires'}</div>
    <button class="btn" data-j="${j.id}">Ouvrir cette journée</button></div>`});
  h+=`<p class="muted"><a href="./" style="color:var(--mute)">Voir l'espace stagiaires</a> · <button class="link" id="out">Se déconnecter</button></p>
  <p class="muted"><button class="link" id="rz">Pour mes tests : changer de nom dans l'espace stagiaires (sur ce téléphone)</button></p><div class="ok hide" id="rzok">✅ C'est fait : l'espace stagiaires te redemandera ton nom.</div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>journee(JOURNEES.find(j=>j.id===b.dataset.j)));
  document.getElementById('out').onclick=()=>{ecrire('ok','');ecranCode()};
  document.getElementById('rz').onclick=()=>{try{localStorage.removeItem('cqp_moi')}catch(e){};document.getElementById('rzok').classList.remove('hide')};
  haut();
}

// ======= Écran : une journée (le menu) =======
function journee(j){
  const o=ETAT[j.id].ouvert;
  app.innerHTML=`<button class="back" id="bk">← Retour</button>
  <div class="tag">${esc(j.titre)}</div><h1>${esc(j.theme)}</h1>
  <div class="card ${o?'g':'j'}">
   <div class="statut"><span class="dot" style="background:${o?'var(--ok)':'var(--mute)'}"></span>${o?'Quiz ouvert aux stagiaires':'Quiz caché aux stagiaires'}</div>
   <p class="muted" style="margin:6px 0 0">${o?'Les stagiaires voient le bouton « Petit bilan de ma journée ».':'Les stagiaires ne voient pas encore le quiz. Ouvre-le quand tu veux, par exemple en fin de journée.'}</p>
   ${o?`<button class="btn wa" id="prev">📲 Prévenir les stagiaires sur WhatsApp</button><button class="btn ko" id="tog">🔒 Fermer le quiz</button>`
      :`<button class="btn" id="tog">🔓 Ouvrir le quiz aux stagiaires</button>`}
   <div class="ok hide" id="togok"></div>
   ${ETAT[j.id].horsLigne?`<div class="err">Je n'ai pas pu lire ton tableau des quiz. Vérifie ta connexion internet.</div>`:''}
  </div>
  <button class="btn sec" id="m1">📊 Réponses et résumé de la journée</button>
  <button class="btn sec" id="m2">📝 Mon quiz du jour</button>
  <button class="btn sec" id="m3">📚 Diapos et documents</button>
  <button class="btn sec" id="m4">🖨️ Version papier (PDF)</button>
  <button class="btn sec" id="m5">✍️ Saisir une réponse papier</button>`;
  document.getElementById('bk').onclick=accueil;
  document.getElementById('m1').onclick=()=>reponses(j);
  document.getElementById('m2').onclick=()=>monQuiz(j);
  document.getElementById('m3').onclick=()=>diapos(j);
  document.getElementById('m4').onclick=()=>papier(j,false);
  document.getElementById('m5').onclick=()=>saisie(j);
  const prev=document.getElementById('prev');
  if(prev)prev.onclick=()=>ouvrirWhatsApp(`Hello la team ! 👋\nLe petit bilan de la journée (${j.titre} – ${j.theme}) est ouvert ! 📝\nPrenez 2-3 minutes pour le remplir sur votre espace stagiaires :\n${LIEN_STAGIAIRES}\nMerci ! 💪`);
  document.getElementById('tog').onclick=async()=>{
    const b=document.getElementById('tog'); b.disabled=true; b.textContent='Un instant…';
    const nouveau=!o;
    try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:j.id,[EQ.statut]:nouveau?'ouvert':'ferme',[EQ.contenu]:''})}
    catch(e){b.disabled=false;b.textContent=o?'🔒 Fermer le quiz':'🔓 Ouvrir le quiz aux stagiaires';alert("Ça n'a pas marché. Vérifie ta connexion internet et réessaie.");return}
    ETAT[j.id].ouvert=nouveau; noterLocal(j.id,'ouvert',nouveau);
    journee(j);
    const t=document.getElementById('togok');
    t.textContent=nouveau?"✅ Quiz ouvert. Il apparaîtra chez les stagiaires d'ici quelques minutes (le temps que Google se mette à jour).":"✅ Quiz fermé. Il disparaîtra chez les stagiaires d'ici quelques minutes.";
    t.classList.remove('hide');
  };
  haut();
}

// ======= Écran : diapos et documents =======
function diapos(j){
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Diapos et documents</h1>
   ${(j.docs||[]).map(d=>`<a class="btn" href="${d.fichier}" download>⬇️ ${esc(d.titre)}</a>`).join('')}
   <p class="muted" style="margin-top:16px">Exactement ce que les stagiaires ont reçu. Touche une diapo pour l'ouvrir en grand.</p>`;
  for(let i=1;i<=j.diapos;i++){const s=`${j.dossier}/${String(i).padStart(2,'0')}.jpg`;h+=`<a href="${s}" target="_blank" rel="noopener"><img class="slide" loading="lazy" src="${s}" alt="Diapo ${i}"></a>`}
  h+=`<button class="btn sec" id="bk2">← Retour</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>journee(j);document.getElementById('bk2').onclick=()=>journee(j);
  haut();
}

// ======= Écran : mon quiz du jour (voir + modifier) =======
function monQuiz(j){
  const z=JSON.parse(JSON.stringify(quizDe(j)));
  const dessiner=()=>{
    let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Mon quiz du jour</h1>
    <p class="muted" style="margin-top:-8px">Pour dicter : touche une case, puis le micro 🎤 de ton clavier. Touche ✓ pour choisir la bonne réponse.</p>
    <div class="card o"><h2>Ressenti « J'ai compris… »</h2><p class="muted" style="margin-top:0">Les stagiaires notent chaque ligne de 1 à 5.</p>`;
    z.ressenti.forEach((t,i)=>{h+=`<div class="ligne"><input type="text" data-rs="${i}" value="${esc(t)}"><button class="x" data-rsx="${i}" title="Supprimer">✕</button></div>`});
    h+=`<button class="btn small sec" id="addr">+ Ajouter une ligne</button></div>
    <div class="card"><h2>Les questions</h2>`;
    z.questions.forEach((q,i)=>{
      h+=`<div class="qed"><div style="display:flex;justify-content:space-between;align-items:center"><b>Question ${i+1}</b><button class="link" data-qx="${i}" style="color:var(--ko)">Supprimer</button></div>
      <textarea data-qq="${i}" style="min-height:70px;margin-top:8px">${esc(q.q)}</textarea>
      <label style="margin-top:10px">Réponses proposées</label>`;
      q.o.forEach((o,k)=>{h+=`<div class="ligne"><button class="bonne ${q.b===k?'on':''}" data-qb="${i}:${k}" title="Bonne réponse">✓</button><input type="text" data-qo="${i}:${k}" value="${esc(o)}">${q.o.length>2?`<button class="x" data-qox="${i}:${k}">✕</button>`:''}</div>`});
      if(q.o.length<4)h+=`<button class="btn small sec" data-qoa="${i}">+ Ajouter une réponse</button>`;
      h+=`<label>Explication (affichée après l'envoi)</label><textarea data-qe="${i}" style="min-height:70px">${esc(q.e||'')}</textarea></div>`;
    });
    h+=`<button class="btn small sec" id="addq">+ Ajouter une question</button></div>
    <div class="err hide" id="er"></div>
    <button class="btn" id="sav">💾 Enregistrer le quiz</button>
    <div class="ok hide" id="okk"></div>
    <button class="btn sec" id="def">↩️ Revenir au quiz préparé avec Claude</button>
    <p class="muted">Si le quiz est déjà ouvert, les changements s'appliquent aux stagiaires qui ne l'ont pas encore rempli.</p>`;
    app.innerHTML=h;
    document.getElementById('bk').onclick=()=>journee(j);
    // lecture des champs avant chaque action
    const lireChamps=()=>{
      app.querySelectorAll('[data-rs]').forEach(e=>z.ressenti[+e.dataset.rs]=e.value);
      app.querySelectorAll('[data-qq]').forEach(e=>z.questions[+e.dataset.qq].q=e.value);
      app.querySelectorAll('[data-qe]').forEach(e=>z.questions[+e.dataset.qe].e=e.value);
      app.querySelectorAll('[data-qo]').forEach(e=>{const [i,k]=e.dataset.qo.split(':').map(Number);z.questions[i].o[k]=e.value});
    };
    const re=f=>()=>{lireChamps();f();const y=window.scrollY;dessiner();window.scrollTo(0,y)};
    document.getElementById('addr').onclick=re(()=>z.ressenti.push(''));
    app.querySelectorAll('[data-rsx]').forEach(b=>b.onclick=re(()=>z.ressenti.splice(+b.dataset.rsx,1)));
    document.getElementById('addq').onclick=re(()=>z.questions.push({q:'',o:['','',''],b:-1,e:''}));
    app.querySelectorAll('[data-qx]').forEach(b=>b.onclick=re(()=>z.questions.splice(+b.dataset.qx,1)));
    app.querySelectorAll('[data-qb]').forEach(b=>b.onclick=re(()=>{const [i,k]=b.dataset.qb.split(':').map(Number);z.questions[i].b=k}));
    app.querySelectorAll('[data-qoa]').forEach(b=>b.onclick=re(()=>z.questions[+b.dataset.qoa].o.push('')));
    app.querySelectorAll('[data-qox]').forEach(b=>b.onclick=re(()=>{const [i,k]=b.dataset.qox.split(':').map(Number);const q=z.questions[i];q.o.splice(k,1);if(q.b===k)q.b=-1;else if(q.b>k)q.b--}));
    document.getElementById('def').onclick=()=>{if(confirm('Remettre le quiz préparé avec Claude ? Tes changements non enregistrés seront perdus.')){const d=JSON.parse(JSON.stringify(j.quiz));z.ressenti=d.ressenti;z.questions=d.questions;dessiner()}};
    document.getElementById('sav').onclick=async()=>{
      lireChamps();
      const er=document.getElementById('er');
      const propre={ressenti:z.ressenti.map(t=>t.trim()).filter(Boolean),
        questions:z.questions.map(q=>{const o=[];let b=-1;q.o.forEach((t,k)=>{if(t.trim()){if(k===q.b)b=o.length;o.push(t.trim())}});return {q:q.q.trim(),o,b,e:(q.e||'').trim()}})};
      const pb=[];
      if(!propre.questions.length)pb.push('Ajoute au moins une question.');
      propre.questions.forEach((q,i)=>{
        if(!q.q)pb.push(`Question ${i+1} : écris la question.`);
        if(q.o.length<2)pb.push(`Question ${i+1} : il faut au moins 2 réponses.`);
        if(q.b<0)pb.push(`Question ${i+1} : touche ✓ pour choisir la bonne réponse.`);
      });
      if(pb.length){er.innerHTML=pb.map(esc).join('<br>');er.classList.remove('hide');er.scrollIntoView({behavior:'smooth',block:'center'});return}
      er.classList.add('hide');
      const b=document.getElementById('sav');b.disabled=true;b.textContent='Enregistrement…';
      try{await envoyerForm(FORM_QUIZ,{[EQ.journee]:j.id,[EQ.statut]:'quiz',[EQ.contenu]:JSON.stringify(propre)})}
      catch(e){b.disabled=false;b.textContent='💾 Enregistrer le quiz';er.textContent="L'enregistrement n'a pas marché. Vérifie ta connexion internet et réessaie.";er.classList.remove('hide');return}
      ETAT[j.id].quiz=propre; noterLocal(j.id,'quiz',propre);
      z.ressenti=propre.ressenti; z.questions=propre.questions;
      dessiner();
      const ok=document.getElementById('okk');ok.textContent=`✅ Quiz enregistré${ETAT[j.id].ouvert?" : les stagiaires verront la nouvelle version d'ici quelques minutes.":". Il reste caché tant que tu ne l'as pas ouvert."}`;ok.classList.remove('hide');ok.scrollIntoView({behavior:'smooth',block:'center'});
    };
  };
  dessiner(); haut();
}

// ======= Écran : version papier =======
function papier(j,corrige){
  const z=quizDe(j);
  const ronds='①②③④⑤'.split('').join(' ');
  let f=`<div class="feuille">
   <h3>Petit bilan de ma journée${corrige?' — CORRIGÉ':''}</h3>
   <p class="sub">CQP Instructeur Fitness – Cours collectifs · ${esc(j.titre)} · ${esc(j.theme)}</p>
   ${corrige?'':`<div class="champ"><span>Nom :</span><i></i></div><div class="champ"><span>Prénom :</span><i></i></div>`}
   ${z.ressenti.length?`<div class="bloc"><h4>Mon ressenti — J'ai compris… <span style="font-weight:400">(entoure : 1 = pas du tout, 5 = tout à fait)</span></h4>
     ${z.ressenti.map(t=>`<div class="rs"><span>${esc(t)}</span><span class="ronds">${ronds}</span></div>`).join('')}</div>`:''}
   <div class="bloc"><h4>Questions <span style="font-weight:400">(coche une seule réponse)</span></h4>
     ${z.questions.map((q,i)=>`<div class="qq">${i+1}. ${esc(q.q)}</div>${q.o.map((o,k)=>`<div class="oo">${corrige&&k===q.b?'☑':'☐'} ${esc(o)}</div>`).join('')}${corrige&&q.e?`<div class="ex">${esc(q.e)}</div>`:''}`).join('')}</div>
   ${corrige?'':`<div class="bloc"><h4>Une difficulté à signaler ? <span style="font-weight:400">(facultatif)</span></h4><div class="zone"></div></div>`}
  </div>`;
  app.innerHTML=`<div class="noprint"><button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Version papier</h1>
   <div class="card o"><p style="margin-top:0">Touche <b>Imprimer / PDF</b>, puis choisis <b>« Enregistrer au format PDF »</b> ou ton imprimante.</p>
   <button class="btn" id="pr">🖨️ Imprimer / PDF</button>
   <button class="btn sec" id="sw">${corrige?'📄 Voir la feuille vierge (pour les stagiaires)':'✅ Voir le corrigé (pour moi)'}</button></div></div>${f}
   <div class="noprint"><button class="btn sec" id="bk2">← Retour</button></div>`;
  document.getElementById('bk').onclick=()=>journee(j);document.getElementById('bk2').onclick=()=>journee(j);
  document.getElementById('pr').onclick=()=>window.print();
  document.getElementById('sw').onclick=()=>papier(j,!corrige);
  haut();
}

// ======= Écran : saisir une réponse papier =======
function saisie(j){
  const z=quizDe(j);
  const r=z.ressenti.map(()=>0), rep=z.questions.map(()=>-1);
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>Saisir une réponse papier</h1>
  <div class="card o"><h2>Le stagiaire</h2>
   <label for="n">Nom</label><input type="text" id="n"><label for="p">Prénom</label><input type="text" id="p">
   <p class="muted">Écris-le exactement comme dans l'espace stagiaires, pour qu'il soit bien reconnu.</p></div>`;
  if(z.ressenti.length){h+=`<div class="card"><h2>Son ressenti</h2>`;
    z.ressenti.forEach((t,i)=>{h+=`<div class="q">${esc(t)}</div><div class="scale" data-r="${i}">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`});h+=`</div>`}
  h+=`<div class="card"><h2>Ses réponses</h2>`;
  z.questions.forEach((q,i)=>{h+=`<div class="q">${i+1}. ${esc(q.q)}</div><div data-q="${i}">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`});
  h+=`</div><div class="card g"><h2>Difficulté signalée</h2><p class="muted" style="margin-top:0">Facultatif : recopie ce qu'il a écrit.</p><textarea id="dif"></textarea></div>
  <div class="err hide" id="er"></div><button class="btn" id="env">Envoyer cette feuille</button><div id="fin"></div>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=()=>journee(j);
  app.querySelectorAll('.scale').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{r[+s.dataset.r]=+b.dataset.n;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}));
  app.querySelectorAll('[data-q]').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{rep[+g.dataset.q]=+b.dataset.k;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))}));
  document.getElementById('env').onclick=async()=>{
    const er=document.getElementById('er'), nom=document.getElementById('n').value.trim(), prenom=document.getElementById('p').value.trim();
    if(!nom||!prenom){er.textContent='Écris le nom et le prénom du stagiaire.';er.classList.remove('hide');return}
    if(r.includes(0)||rep.includes(-1)){er.textContent='Remplis tout le ressenti et toutes les questions (si une case est vide sur la feuille, choisis la plus proche ou laisse la feuille de côté).';er.classList.remove('hide');return}
    er.classList.add('hide');
    const bon=rep.filter((k,i)=>k===z.questions[i].b).length;
    const champs={[E.nom]:nom,[E.prenom]:prenom,[E.journee]:`${j.titre} – ${j.theme}`,
      [E.ressenti]:z.ressenti.map((t,i)=>`${t} : ${r[i]}/5`).join(' | '),
      [E.reponses]:z.questions.map((q,i)=>`Q${i+1} ${rep[i]===q.b?'✅':'❌ ('+q.o[rep[i]]+')'}`).join(' | ')+` — Score ${bon}/${z.questions.length} (papier)`,
      [E.difficulte]:document.getElementById('dif').value.trim()};
    const b=document.getElementById('env');b.disabled=true;b.textContent='Envoi…';
    try{await envoyerForm(FORM,champs)}catch(e){b.disabled=false;b.textContent='Envoyer cette feuille';er.textContent="L'envoi n'a pas marché. Vérifie ta connexion internet et réessaie.";er.classList.remove('hide');return}
    b.classList.add('hide');
    document.getElementById('fin').innerHTML=`<div class="card g"><div class="ok" style="margin:0">✅ Feuille de ${esc(prenom)} ${esc(nom)} enregistrée (${bon}/${z.questions.length}).</div><p class="muted">Elle apparaîtra dans les réponses d'ici quelques minutes.</p><button class="btn" id="aut">✍️ Saisir une autre feuille</button><button class="btn sec" id="ret">← Retour à la journée</button></div>`;
    document.getElementById('aut').onclick=()=>saisie(j);document.getElementById('ret').onclick=()=>journee(j);
    document.getElementById('fin').scrollIntoView({behavior:'smooth'});
  };
  haut();
}

// ======= Écran : réponses et résumé =======
let lignes=[];
async function reponses(j){
  app.innerHTML=`<button class="back" id="bk">← Retour</button>
  <div class="tag">${esc(j.titre)}</div><h1>Réponses et résumé</h1><div id="zone"><p class="muted">Chargement des réponses…</p></div>`;
  document.getElementById('bk').onclick=()=>journee(j);
  haut();
  try{lignes=await lireCSV(CSV_REPONSES)}
  catch(e){
    document.getElementById('zone').innerHTML=`<div class="card r"><h2>Impossible de lire les réponses</h2><p>Vérifie ta connexion internet, puis réessaie.</p><button class="btn" id="re">Réessayer</button></div>`;
    document.getElementById('re').onclick=()=>reponses(j);return;
  }
  afficher(j,false);
}

function afficher(j,tests){
  const z=quizDe(j), nq=z.questions.length;
  const iH=0,iN=1,iP=2,iJ=3,iR=4,iQ=5,iD=6;
  let rep=lignes.slice(1).filter(l=>(l[iJ]||'').trim().startsWith(j.titre));
  const nbTests=rep.filter(l=>dateFR(l[iH])<j.id).length;
  if(!tests)rep=rep.filter(l=>dateFR(l[iH])>=j.id);
  const zone=document.getElementById('zone');
  let h='';
  if(nbTests)h+=`<label class="check"><input type="checkbox" id="tst" ${tests?'checked':''}> Afficher aussi les réponses de test d'avant le ${esc(j.titre.toLowerCase())} (${nbTests})</label>`;
  if(!rep.length){
    h+=`<div class="card"><h2>Pas encore de réponses</h2><p class="muted">Les réponses arrivent dès qu'un stagiaire envoie son petit bilan (ou que tu saisis une feuille papier).</p><button class="btn sec" id="maj">🔄 Actualiser</button></div>`;
    zone.innerHTML=h;
    document.getElementById('maj').onclick=()=>reponses(j);
    if(nbTests)document.getElementById('tst').onchange=e=>afficher(j,e.target.checked);
    observations(j,null,zone);return;
  }
  const res={};
  rep.forEach(l=>(l[iR]||'').split('|').forEach(p=>{const m=p.match(/(.+?)\s*:\s*(\d)\/5/);if(m){const k=m[1].trim();(res[k]=res[k]||[]).push(+m[2])}}));
  const moy=Object.entries(res).map(([k,v])=>({k,m:v.reduce((a,b)=>a+b,0)/v.length}));
  const bonnes=Array(nq).fill(0);
  rep.forEach(l=>{for(let i=0;i<nq;i++){if(new RegExp('Q'+(i+1)+'\\s*✅').test(l[iQ]||''))bonnes[i]++}});
  const diffs=rep.map(l=>({n:`${(l[iP]||'').trim()} ${(l[iN]||'').trim()}`.trim(),d:(l[iD]||'').trim()})).filter(x=>x.d);
  const scoreTot=rep.reduce((a,l)=>{const m=(l[iQ]||'').match(/Score\s*(\d+)\/(\d+)/);return a+(m?+m[1]:0)},0);

  h+=`<div class="card o" style="display:flex;justify-content:space-between;align-items:center">
     <div><div class="big">${rep.length}</div><div class="muted">stagiaire${rep.length>1?'s ont':' a'} répondu</div></div>
     <div style="text-align:right"><div class="big">${(scoreTot/rep.length).toFixed(1)}<span style="font-size:20px">/${nq}</span></div><div class="muted">score moyen</div></div></div>`;
  h+=`<div class="card"><h2>Ressenti « J'ai compris… »</h2><p class="muted" style="margin-top:0">Moyenne sur 5</p>`+
     moy.map(x=>`<div class="row"><span>${esc(x.k)}</span><span class="pill ${classe(x.m,5)}">${x.m.toFixed(1)}</span></div>`).join('')+`</div>`;
  h+=`<div class="card"><h2>Les questions</h2><p class="muted" style="margin-top:0">Bonnes réponses</p>`+
     z.questions.map((q,i)=>`<div class="row"><span>${i+1}. ${esc(q.q)}</span><span class="pill ${classe(bonnes[i],rep.length)}">${bonnes[i]}/${rep.length}</span></div>`).join('')+`</div>`;
  h+=`<div class="card ${diffs.length?'r':'g'}"><h2>Difficultés signalées</h2>`+
     (diffs.length?diffs.map(x=>`<div class="stag"><b>${esc(x.n)}</b><div class="d">${esc(x.d)}</div></div>`).join(''):`<p class="muted" style="margin:0">Aucune difficulté signalée.</p>`)+`</div>`;
  h+=`<div class="card"><h2>Détail par stagiaire</h2>`+rep.map(l=>{
       const m=(l[iQ]||'').match(/Score\s*(\d+)\/(\d+)/);const sc=m?+m[1]:0;
       const rs=(l[iR]||'').split('|').map(p=>{const k=p.match(/:\s*(\d)\/5/);return k?k[1]:'?'}).join(' · ');
       const erreurs=[...(l[iQ]||'').matchAll(/Q(\d+)\s*❌\s*\(([^)]*)\)/g)].map(x=>{const q=z.questions[+x[1]-1];return `<div class="d">❌ ${esc(q?q.q:'Question '+x[1])}<br><span style="color:var(--mute)">→ a répondu : ${esc(x[2])}</span></div>`}).join('');
       const pap=/\(papier\)/.test(l[iQ]||'')?' <span class="muted">(papier)</span>':'';
       return `<div class="stag"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(((l[iP]||'')+' '+(l[iN]||'')).trim())}${pap}</b><span class="pill ${classe(sc,nq)}">${sc}/${nq}</span></div>
       <div class="d">Ressenti : ${esc(rs)}</div>${erreurs}</div>`}).join('')+
     `<button class="btn sec" id="maj">🔄 Actualiser les réponses</button></div>`;
  zone.innerHTML=h;
  document.getElementById('maj').onclick=()=>reponses(j);
  if(nbTests)document.getElementById('tst').onchange=e=>afficher(j,e.target.checked);
  observations(j,{n:rep.length,moy,bonnes,diffs,scoreTot},zone);
}

// ======= Mes observations + résumé =======
function observations(j,st,zone){
  const box=document.createElement('div');
  box.innerHTML=`<div class="card g"><h2>Mes observations</h2>
   <p class="muted" style="margin-top:0">Écris ou dicte ce que tu as remarqué pendant la journée. C'est gardé sur ce téléphone.</p>
   <textarea id="obs" style="min-height:120px" placeholder="Ex. : placement de la salle encore flou pour 2 stagiaires…"></textarea>
   <button class="btn sec" id="mic">🎤 Dicter</button>
   <div class="muted hide" id="micinfo" style="margin-top:8px"></div>
   <button class="btn" id="res">✨ Faire le résumé</button></div>
   <div class="card o hide" id="rbox"><h2>Résumé pour les formateurs</h2>
   <p class="muted" style="margin-top:0">Tu peux le corriger avant de l'envoyer.</p>
   <textarea id="resume"></textarea>
   <button class="btn wa" id="wa">📋 Copier et ouvrir WhatsApp</button>
   <div class="ok hide" id="cp">✅ Résumé copié. Dans WhatsApp, choisis le groupe des formateurs, puis envoie.</div></div>`;
  zone.appendChild(box);
  const obs=document.getElementById('obs');
  obs.value=lire('obs_'+j.id,'');
  obs.oninput=()=>ecrire('obs_'+j.id,obs.value);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mb=document.getElementById('mic'), mi=document.getElementById('micinfo');
  if(!SR){mb.onclick=()=>{mi.textContent="Sur ce téléphone, touche la case puis le petit micro 🎤 de ton clavier pour dicter.";mi.classList.remove('hide');obs.focus()}}
  else{let rec=null;
    mb.onclick=()=>{
      if(rec){rec.stop();return}
      rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;
      const base=obs.value;let ajout='';
      rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)ajout+=(ajout?' ':'')+e.results[i][0].transcript.trim();
        obs.value=(base.trim()?base.replace(/\s*$/,'')+'\n':'')+ajout;ecrire('obs_'+j.id,obs.value)};
      rec.onend=()=>{rec=null;mb.textContent='🎤 Dicter';mb.classList.remove('rec')};
      rec.onerror=()=>{mi.textContent="La dictée n'a pas marché. Tu peux utiliser le micro 🎤 de ton clavier.";mi.classList.remove('hide')};
      rec.start();mb.textContent='⏹️ Arrêter la dictée';mb.classList.add('rec');
    }}
  document.getElementById('res').onclick=()=>{
    document.getElementById('resume').value=resume(j,st,obs.value.trim());
    const rb=document.getElementById('rbox');rb.classList.remove('hide');rb.scrollIntoView({behavior:'smooth'});
  };
  document.getElementById('wa').onclick=async()=>{
    const txt=document.getElementById('resume').value;
    if(!await copier(txt)){const t=document.getElementById('resume');t.select();try{document.execCommand('copy')}catch(_){}}
    document.getElementById('cp').classList.remove('hide');
    setTimeout(()=>ouvrirWhatsApp(txt,true),600);
  };
}

function resume(j,st,obs){
  const z=quizDe(j);
  let t=`📋 Bilan CQP Cours collectifs – ${j.titre}\n${j.theme}\n`;
  if(!st){t+=`\nPas de réponses au petit bilan pour l'instant.\n`}
  else{
    t+=`\n👥 ${st.n} stagiaire${st.n>1?'s ont':' a'} répondu au petit bilan · score moyen ${(st.scoreTot/st.n).toFixed(1)}/${z.questions.length}\n`;
    const bien=st.moy.filter(x=>x.m>=4), revoir=st.moy.filter(x=>x.m<3.5), moyen=st.moy.filter(x=>x.m>=3.5&&x.m<4);
    if(bien.length)t+=`\n✅ Bien compris :\n`+bien.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(moyen.length)t+=`\n🟡 Compris en partie :\n`+moyen.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    if(revoir.length)t+=`\n🔴 À retravailler :\n`+revoir.map(x=>`• ${x.k} (${x.m.toFixed(1)}/5)`).join('\n')+'\n';
    const qrat=z.questions.map((q,i)=>({q:q.q,b:st.bonnes[i]})).filter(x=>x.b<st.n);
    t+=`\n📝 Questions :\n`+(qrat.length?qrat.map(x=>`• ${x.q} : ${x.b}/${st.n} bonnes réponses`).join('\n'):`• Toutes les questions réussies par tout le monde`)+'\n';
    if(st.diffs.length)t+=`\n⚠️ Difficultés signalées par les stagiaires :\n`+st.diffs.map(x=>`• ${x.d}`).join('\n')+'\n';
  }
  if(obs)t+=`\n👀 Mes observations :\n${obs}\n`;
  t+=`\nHamid`;
  return t;
}

lire('ok','')===CODE_HASH ? demarrer() : ecranCode();
