<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Espace stagiaires – CQP Cours collectifs</title>
<style>
:root{--bg:#10162b;--card:#1c2442;--line:#2c365c;--txt:#fff;--soft:#c9cfe6;--mute:#8a92b2;--or:#ff7a3d;--ok:#4cc38a;--ko:#ff5d6c;--bl:#4c8dff;--ja:#f5c451}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.tag{color:var(--or);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
h1{font-size:26px;margin:4px 0 18px;line-height:1.2}
h2{font-size:20px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 16px;border-top:5px solid var(--bl)}
.card.o{border-top-color:var(--or)}.card.g{border-top-color:var(--ok)}.card.r{border-top-color:var(--ko)}.card.j{border-top-color:var(--ja)}
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],textarea{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:17px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{min-height:90px;resize:vertical}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--or);color:#10162b;font-weight:800;font-size:18px;cursor:pointer;margin-top:16px;text-align:center;text-decoration:none}
.btn.sec{background:#2a3566;color:#fff}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;cursor:pointer;padding:6px 0}
.muted{color:var(--mute);font-size:15px}
.scale{display:flex;gap:8px;margin-top:4px}
.scale button{flex:1;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.scale button.on{background:var(--or);border-color:var(--or);color:#10162b}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.q{margin:18px 0 6px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:#141b33;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
.opt.on{border-color:var(--or);background:#2a2230}
.opt.good{border-color:var(--ok);background:#173528}
.opt.bad{border-color:var(--ko);background:#3a1c25}
.expl{margin:6px 0 4px;padding:10px 12px;border-radius:10px;background:#141b33;font-size:15px;color:var(--soft)}
.err{color:var(--ko);font-weight:700;margin-top:10px}
.done{font-size:18px;font-weight:700;color:var(--ok)}
.slide{width:100%;border-radius:12px;display:block;margin:0 0 12px;border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.back{background:none;border:0;color:var(--soft);font-size:16px;cursor:pointer;padding:8px 0}
.hide{display:none}
/* Chrono collé en haut */
.chrono{position:sticky;top:0;z-index:5;margin:0 -16px 14px;padding:12px 16px;background:#141b33;border-bottom:2px solid var(--line);font-size:24px;font-weight:800;text-align:center}
.chrono.rouge{background:#3a1c25;color:var(--ko);border-bottom-color:var(--ko)}
.chrono small{display:block;font-size:13px;font-weight:600;color:var(--mute)}
/* Mon évolution */
.item{background:#141b33;border-radius:12px;padding:12px 14px;margin:10px 0}
.item .d{margin-top:6px;color:var(--soft);font-size:15px}
.frise{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.frise:last-child{border-bottom:0}
.frise .p{flex:none;letter-spacing:3px;font-size:18px;white-space:nowrap;overflow-x:auto;max-width:55%}
details{background:var(--card);border-radius:18px;padding:14px 18px;margin:0 0 12px}
summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="commun.js?v=202610260204"></script>
<script src="roue.js?v=202610260204"></script>
<script src="fiches.js?v=202610260204"></script>
<script>
// ======= Mémoire du téléphone (nom, prénom, quiz envoyés, historique) =======
function lire(k,d){try{const v=localStorage.getItem('cqp_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function ecrire(k,v){try{localStorage.setItem('cqp_'+k,JSON.stringify(v))}catch(e){}}
let moi = lire('moi', null);
const app = document.getElementById('app');
function haut(){window.scrollTo(0,0)}
let ECRAN = '';      // écran affiché (pour le chrono)
let QUIZ_AFFICHE = null; // quiz affiché à l'écran

// ======= Écran 1 : nom et prénom =======
function ecranNom(){
  ECRAN='nom';
  app.innerHTML = `<div class="tag">CQP Instructeur Fitness – Cours collectifs</div>
  <h1>Espace stagiaires</h1>
  <div class="card o"><h2>Qui es-tu ?</h2>
   <p style="margin:6px 0 0;padding:10px 12px;border-radius:10px;background:#3a2a1a;color:#ffd2b8;font-weight:700">⚠️ Fais bien attention à bien écrire ton nom et ton prénom, car tu ne pourras pas les modifier plus tard.</p>
   <label for="n">Nom</label><input type="text" id="n" autocomplete="family-name" value="${esc(moi?moi.nom:'')}">
   <label for="p">Prénom</label><input type="text" id="p" autocomplete="given-name" value="${esc(moi?moi.prenom:'')}">
   <div class="err hide" id="er">Écris ton nom et ton prénom.</div>
   <button class="btn" id="go">Entrer</button></div>`;
  document.getElementById('go').onclick=()=>{
    const nom=document.getElementById('n').value.trim(), prenom=document.getElementById('p').value.trim();
    if(!nom||!prenom){document.getElementById('er').classList.remove('hide');return}
    confirmer(nom,prenom);
  };
  haut();
}

// ======= Confirmation du nom =======
function confirmer(nom,prenom){
  app.innerHTML = `<div class="tag">CQP Instructeur Fitness – Cours collectifs</div>
  <h1>Espace stagiaires</h1>
  <div class="card o"><h2>C'est bien toi ?</h2>
   <p style="font-size:22px;font-weight:800;margin:10px 0">${esc(prenom)} ${esc(nom)}</p>
   <p class="muted">Vérifie bien l'orthographe : tu ne pourras plus le modifier ensuite.</p>
   <button class="btn" id="oui">Oui, c'est moi</button>
   <button class="btn sec" id="non">Non, corriger</button></div>`;
  document.getElementById('oui').onclick=()=>{moi={nom,prenom,id:nouvelId()}; ecrire('moi',moi); envoyerDemande(); attente(true);};
  document.getElementById('non').onclick=()=>{moi={nom,prenom}; ecranNom(); moi=null;};
  haut();
}

// ======= Les quiz : une « session » = un quiz ouvert (journée ou révision) =======
let ETAT = null, REVS = {}; // état des quiz (ouvert ou non), lu dans le tableau du formateur
let FICHES = []; // fiches de révision ouvertes par Hamid (renfo.bas, etir.haut, meth…)
let ROUE = null, NOMS = {}; // la roue (tirage préparé par Hamid) et les prénoms des stagiaires
function sessionJournee(j){
  const e=ETAT[j.id];
  return {cle:j.id,label:`${j.titre} – ${j.theme}`,tag:j.titre,titre:'Petit bilan de ma journée',z:e.quiz,duree:e.duree||0,ouvCle:e.ouvCle||''};
}
function sessionRevision(r){
  return {cle:'rev:'+r.id,label:r.titre,tag:'Révision',titre:'🧠 '+r.titre,z:r.quiz,duree:r.duree||0,ouvCle:r.ouvCle||''};
}
function revisionOuverte(){
  return Object.values(REVS||{}).filter(estOuvert).sort((a,b)=>(b.ouvertAt||0)-(a.ouvertAt||0))[0]||null;
}
function idSession(S){return S.cle+'|'+S.ouvCle}
// Brouillons des quiz chronométrés (heure de départ gardée sur ce téléphone)
function brouillons(){return lire('chrono',{})}
function garderBrouillon(D){const b=brouillons();b[D.id]=D;ecrire('chrono',b)}
function oublierBrouillon(D){const b=brouillons();delete b[D.id];ecrire('chrono',b)}
function reste(D){return D.duree*60000-(Date.now()-D.debut)}
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function dejaFerme(S){return !!lire('fermes',{})[idSession(S)]}

function boutonQuiz(S,texte){
  if(S.duree&&dejaFerme(S))return `<p class="done" style="margin:12px 0 0">✅ Quiz envoyé.</p><p class="muted" style="margin:4px 0 0">Ta correction est dans « 📈 Mes révisions ».</p>`;
  const D=brouillons()[idSession(S)];
  if(D&&!D.envoye)return `<button class="btn" data-ses="${esc(idSession(S))}">⏱️ Reprendre le quiz (il reste ${mmss(reste(D))})</button>`;
  const envoyes=lire('envoyes',{});
  return `<button class="btn" data-ses="${esc(idSession(S))}">${texte}${envoyes[S.cle]&&!S.duree?' ✅':''}${S.duree?` · ⏱️ ${S.duree} min`:''}</button>`;
}

// ======= Écran 2 : accueil =======
function accueil(){
  ECRAN='accueil'; QUIZ_AFFICHE=null;
  const sessions={};
  let h = `<div class="top"><div><div class="tag">Espace stagiaires</div><h1 style="margin-bottom:6px">Bonjour ${esc(moi.prenom)} 👋</h1></div></div>
  <button class="btn sec" id="evo" style="margin:0 0 16px">📈 Mes révisions</button>`;
  const T=roueActive();
  if(T){
    const vu=T.res&&T.res[moi.id]&&lire('roue_vu',{})[T.id+':'+(T.res[moi.id].length-1)];
    h+=`<div class="card o"><div class="tag">🎡 La roue</div><h2 style="margin-top:4px">${vu?'Ta mission est prête':'C\'est à toi : lance la roue !'}</h2>
      <p class="muted" style="margin:0">${vu?'Revois ta mission quand tu veux.':'Touche le bouton pour découvrir ta mission.'}</p>
      <button class="btn" id="roue">🎡 ${vu?'Voir ma mission':'Lancer la roue'}</button></div>`;
  }
  const rev=revisionOuverte();
  if(rev){const S=sessionRevision(rev);sessions[idSession(S)]=S;
    h+=`<div class="card o"><div class="tag">🧠 Révision</div><h2 style="margin-top:4px">${esc(rev.titre)}</h2>
      <p class="muted" style="margin:0">Un petit quiz pour revoir ce qu'on a vu depuis le début. ${texteDuree(rev.quiz)}</p>
      ${boutonQuiz(S,'🧠 Faire la révision')}</div>`}
  if(FICHES.length)h+=`<div class="card g"><div class="tag">📚 Pour réviser</div><h2 style="margin-top:4px">Les exercices et les étirements</h2>
      <p class="muted" style="margin:0">Les fiches que Hamid a ouvertes : placement, exécution, sécurité.</p>
      <button class="btn" id="fx">📚 Ouvrir les fiches</button></div>`;
  JOURNEES.slice().reverse().forEach(j=>{
    const e=ETAT&&ETAT[j.id], ouvert=estOuvert(e);
    let b='';
    if(ouvert){const S=sessionJournee(j);sessions[idSession(S)]=S;b=boutonQuiz(S,'📝 Petit bilan de ma journée')}
    h += `<div class="card"><div class="tag" style="color:var(--soft)">${esc(j.titre)}</div><h2 style="margin-top:4px">${esc(j.theme)}</h2>
     ${b}
     <button class="btn sec" data-cours="${j.id}">📚 Revoir les diapos</button></div>`;
  });
  app.innerHTML = h;
  document.getElementById('evo').onclick=evolution;
  const br=document.getElementById('roue'); if(br)br.onclick=ecranRoue;
  const bf=document.getElementById('fx'); if(bf)bf.onclick=()=>revoirFiches();
  app.querySelectorAll('[data-ses]').forEach(b=>b.onclick=()=>ouvrirSession(sessions[b.dataset.ses]));
  app.querySelectorAll('[data-cours]').forEach(b=>b.onclick=()=>cours(JOURNEES.find(j=>j.id===b.dataset.cours)));
  haut();
}
// ======= 📚 Pour réviser : les fiches ouvertes par Hamid =======
function fichesOuvertes(g){
  let o=(g&&g.fiches&&g.fiches.ouverts)||[];
  // sur le téléphone d'Hamid (stagiaire de test) : ce qu'il vient de décider, sans attendre Google
  try{const l=JSON.parse(localStorage.getItem('cqpf_local_fiches')||'null');if(l&&Array.isArray(l.ouverts)&&Date.now()-l.at<15*60*1000)o=l.ouverts}catch(e){}
  return o;
}
function revoirFiches(){
  ECRAN='fiches';
  const cats=Object.keys(FICHES_CATS).filter(k=>fxCles(k).some(c=>FICHES.includes(c)));
  if(cats.length===1)return revoirCategorie(cats[0],true);
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">Espace stagiaires</div><h1>📚 Pour réviser</h1>`;
  if(!cats.length)h+=`<p class="muted">Rien n'est ouvert pour l'instant.</p>`;
  cats.forEach(k=>{const c=FICHES_CATS[k];h+=`<button class="btn sec" data-fcat="${k}" style="text-align:left">${c.emoji} ${esc(c.titre)}</button>`});
  h+=`<button class="btn sec" id="bk2">← Retour à l'accueil</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=accueil;document.getElementById('bk2').onclick=accueil;
  app.querySelectorAll('[data-fcat]').forEach(b=>b.onclick=()=>revoirCategorie(b.dataset.fcat));
  haut();
}
function revoirCategorie(cat,seule){
  ECRAN='fiches';
  const C=FICHES_CATS[cat], ret=seule?accueil:revoirFiches;
  let h=`<button class="back" id="bk">← Retour</button><div class="tag">📚 Pour réviser</div><h1>${C.emoji} ${esc(C.titre)}</h1>
  <p class="muted" style="margin-top:0">Touche une partie pour l'ouvrir ou la refermer.</p>`;
  h+= cat==='meth' ? fxMethodes('') : C.parties.filter(p=>FICHES.includes(cat+'.'+p.k)).map(p=>fxPartie(cat,p,'')).join('');
  h+=`<button class="btn sec" id="bk2">← Retour</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=ret;document.getElementById('bk2').onclick=ret;
  haut();
}
// ======= Accès : demande envoyée au formateur, qui accepte ou refuse =======
function envoyerDemande(){
  ecrire('demande_at',Date.now());
  return envoyerForm(FORM_QUIZ,{[EQ.journee]:'stagiaires',[EQ.statut]:'demande',[EQ.contenu]:JSON.stringify({id:moi.id,nom:moi.nom,prenom:moi.prenom})}).catch(()=>{});
}
function attente(vientDEnvoyer){
  ECRAN='attente';
  app.innerHTML = `<div class="tag">Espace stagiaires</div><h1>Bonjour ${esc(moi.prenom)} 👋</h1>
  <div class="card o"><h2>⏳ Ta demande est envoyée</h2>
   <p>Attends que Hamid t'accepte. Ensuite, ton espace s'ouvrira avec les diapos et le petit bilan de la journée.</p>
   <p class="muted">${vientDEnvoyer?"Ça peut prendre quelques minutes. ":""}Touche « Vérifier » de temps en temps.</p>
   <button class="btn" id="ver">🔄 Vérifier</button></div>`;
  document.getElementById('ver').onclick=verifier;
  haut();
}
function bloque(){
  ECRAN='bloque';
  app.innerHTML = `<div class="tag">Espace stagiaires</div><h1>Bonjour ${esc(moi.prenom)}</h1>
  <div class="card r" style="border-top-color:var(--ko)"><h2>Accès non actif</h2>
   <p>Ton accès à cet espace n'est pas (ou plus) actif. Si c'est une erreur, parles-en à Hamid.</p>
   <button class="btn sec" id="ver">🔄 Vérifier à nouveau</button></div>`;
  document.getElementById('ver').onclick=verifier;
  haut();
}
async function verifier(){
  ECRAN='chargement';
  app.innerHTML = `<p class="muted">Chargement…</p>`;
  let g;
  try{g=await etatGeneral()}catch(e){
    app.innerHTML = `<div class="card"><h2>Pas de connexion</h2><p>Vérifie ta connexion internet, puis réessaie.</p><button class="btn" id="re">Réessayer</button></div>`;
    document.getElementById('re').onclick=verifier;return;
  }
  ETAT=g.quiz; REVS=g.revisions||{}; ROUE=g.roue||null; FICHES=fichesOuvertes(g);
  NOMS={};Object.values(g.stagiaires||{}).forEach(x=>NOMS[x.id]=x.prenom);
  if(!moi.id){moi.id=nouvelId();ecrire('moi',moi);envoyerDemande();return attente(true)}
  let s=g.stagiaires[moi.id];
  // sur le téléphone du formateur (stagiaire de test) : sa décision locale compte tout de suite
  try{const ls=JSON.parse(localStorage.getItem('cqpf_localst')||'{}')[moi.id];if(ls&&(!s||s.statut==='attente'))s={id:moi.id,statut:ls.statut}}catch(e){}
  if(s&&s.statut==='accepte'){
    accueil();
    // un quiz chronométré était en cours : on y retourne directement
    const D=Object.values(brouillons()).find(x=>!x.envoye);
    if(D)quiz(D);
    return;
  }
  if(s&&(s.statut==='refuse'||s.statut==='supprime'||s.statut==='efface'))return bloque();
  // pas encore dans le tableau : on renvoie la demande si elle date de plus de 10 minutes
  if(!s&&Date.now()-lire('demande_at',0)>10*60*1000)envoyerDemande();
  attente(false);
}

// ======= Écran 3 : les diapos =======
function cours(j){
  ECRAN='cours';
  let h = `<button class="back" id="bk">← Retour</button><div class="tag">${esc(j.titre)}</div><h1>${esc(j.theme)}</h1>
   ${(j.docs||[]).map(d=>`<a class="btn" href="${d.fichier}" download>⬇️ ${esc(d.titre)}</a>`).join('')}
   <p class="muted" style="margin-top:16px">Touche une diapo pour l'ouvrir en grand.</p>`;
  for(let i=1;i<=j.diapos;i++){const s=`${j.dossier}/${String(i).padStart(2,'0')}.jpg`;h+=`<a href="${s}" target="_blank" rel="noopener"><img class="slide" loading="lazy" src="${s}" alt="Diapo ${i}"></a>`}
  h += `<button class="btn sec" id="bk2">← Retour</button>`;
  app.innerHTML=h;
  document.getElementById('bk').onclick=accueil; document.getElementById('bk2').onclick=accueil;
  haut();
}

// ======= Ouvrir un quiz (avec ou sans chrono) =======
function nouveauBrouillon(S){
  return {id:idSession(S),cle:S.cle,label:S.label,tag:S.tag,titre:S.titre,z:S.z,duree:S.duree,ouvCle:S.ouvCle,
    r:S.z.ressenti.map(()=>0),rep:S.z.questions.map(()=>-1),dif:'',debut:0,envoye:false};
}
function ouvrirSession(S){
  if(!S)return accueil();
  if(!S.duree)return quiz(nouveauBrouillon(S));
  if(dejaFerme(S))return accueil();
  const D0=brouillons()[idSession(S)];
  if(D0)return quiz(D0);
  ECRAN='intro';
  app.innerHTML=`<button class="back" id="bk">← Retour</button><div class="tag">${esc(S.tag)}</div><h1>${esc(S.titre)}</h1>
   <div class="card o"><h2>⏱️ Tu as ${S.duree} minute${S.duree>1?'s':''}</h2>
    <p>Le chrono démarre quand tu touches « Commencer ».</p>
    <p class="muted">Quand le temps est fini, tes réponses partent toutes seules. Une question sans réponse compte comme « pas répondu ». Tu ne pourras l'envoyer qu'une fois.</p>
    <button class="btn" id="go">▶️ Commencer</button></div>`;
  document.getElementById('bk').onclick=accueil;
  document.getElementById('go').onclick=()=>{const D=nouveauBrouillon(S);D.debut=Date.now();garderBrouillon(D);quiz(D)};
  haut();
}

// ======= Écran 4 : le quiz =======
function quiz(D){
  ECRAN='quiz'; QUIZ_AFFICHE=D;
  const z=D.z, chrono=D.duree>0;
  let h = `${chrono?`<div class="chrono" id="chr">⏱️ ${mmss(reste(D))}<small>Temps restant</small></div>`:''}
  <button class="back" id="bk">← Retour</button><div class="tag">${esc(D.tag)}</div><h1>${esc(D.titre)}</h1>`;
  if(z.ressenti.length){
    h+=`<div class="card o"><h2>Mon ressenti</h2><p class="muted" style="margin-top:0">J'ai compris… (1 = pas du tout, 5 = tout à fait)</p>`;
    z.ressenti.forEach((t,i)=>{h+=`<div class="q">${esc(t)}</div><div class="scale" data-r="${i}">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${D.r[i]===n?'on':''}">${n}</button>`).join('')}</div>`});
    h+=`</div>`;
  }
  h += `<div class="card"><h2>${z.questions.length} petite${z.questions.length>1?'s':''} question${z.questions.length>1?'s':''}</h2>`;
  z.questions.forEach((q,i)=>{h+=`<div class="q">${i+1}. ${esc(q.q)}</div><div data-q="${i}">${q.o.map((o,k)=>`<button class="opt ${D.rep[i]===k?'on':''}" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="expl hide" id="ex${i}"></div>`});
  h += `</div><div class="card g"><h2>Une difficulté à signaler ?</h2><p class="muted" style="margin-top:0">Facultatif.</p><textarea id="dif" placeholder="Écris ici si tu veux…">${esc(D.dif||'')}</textarea></div>
  <div class="err hide" id="er"></div><button class="btn" id="env">Envoyer</button><div id="fin"></div>`;
  app.innerHTML=h;
  const garder=()=>{if(chrono&&!D.envoye)garderBrouillon(D)};

const ENVOI_EN_COURS = new Set();

  const bt=(QUIZ_AFFICHE===D)?document.getElementById('env'):null;
  if(bt){bt.disabled=true;bt.textContent='Envoi…'}
  envoyerForm(FORM,{[E.nom]:moi.nom,[E.prenom]:moi.prenom,[E.journee]:D.label,[E.ressenti]:t.ressenti,[E.reponses]:t.reponses,[E.difficulte]:D.dif})
  .then(()=>{

    ENVOI_EN_COURS.delete(D.id);

// Le chrono : affichage + envoi automatique à 0 (même si un autre écran est affiché)
function tic(){
  const b=brouillons();
  Object.values(b).forEach(D=>{
    if(D.envoye||!D.duree||!D.debut)return;
    if(reste(D)<=0){

function ajouterHisto(D){

  fusionnerHisto([{l:D.label,d:Date.now(),
    it:z.questions.map((q,i)=>({id:q.id||null,q:q.q,th:q.theme||'autre',s:D.rep[i]<0?'na':D.rep[i]===q.b?'ok':'ko',r:D.rep[i]>=0?q.o[D.rep[i]]:'',b:q.o[q.b],e:q.e||''})),
    rs:z.ressenti.map((t,i)=>({t,n:D.r[i]||0}))}]);
}
function fusionnerHisto(liste,remplacer){
  const h=remplacer?[]:lire('histo',[]);
  liste.forEach(e=>{if(!h.some(x=>x.l===e.l&&Math.abs(x.d-e.d)<10*60000))h.push(e)});
  h.sort((a,b)=>a.d-b.d);

}

function empreinteLien(t){let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36)+'_'+t.length}

    it:(items||[]).map(([ref,s,r])=>{

      return {id:typeof ref==='string'?ref:null,q:bq.q,th:bq.theme||bq.t||'autre',s:etat,r:etat==='ko'?(typeof r==='number'?(bq.o[r]||''):String(r||'')):'',b:bq.o[bq.b]||'',e:bq.e||''};

      <p class="muted">L'évolution de ${esc(moi.prenom)} sera effacée de ce téléphone.</p>
      <button class="btn" id="oui">Oui, remplacer</button><button class="btn sec" id="non">Non, garder ${esc(moi.prenom)}</button></div>`;
    document.getElementById('oui').onclick=()=>appliquer(true);
    document.getElementById('non').onclick=demarrer;
    haut();return;
  }
  appliquer(false);
}

function demarrer(){moi ? verifier() : ecranNom()}
const T0 = location.hash.match(/^#t=([A-Za-z0-9_-]+)/);
T0 ? traiterLien(T0[1]) : demarrer();
// si l'espace est déjà ouvert dans cet onglet, le lien ne recharge pas la page
window.addEventListener('hashchange',()=>{const t=location.hash.match(/^#t=([A-Za-z0-9_-]+)/);if(t)traiterLien(t[1])});
</script>
