<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#151a33">
<meta name="mobile-web-app-capable" content="yes">
<title>ScriptMove</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#151a33;--card:#1e2547;--card2:#252d56;--line:#323c6e;--txt:#fff;--soft:#c9cfea;--mute:#8f97bd;--or:#ff8a3d;--or2:#ffb27f;--ok:#4cc38a;--ko:#ff5d6c;--ja:#f5c451;--bl:#5b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45;overflow-wrap:break-word;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:4px 0 14px;line-height:1.2}
h2{font-size:21px;margin:0 0 10px;line-height:1.25}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 12px}
.soft{color:var(--soft)}.mute{color:var(--mute);font-size:15px}.small{font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;border:1px solid var(--line)}
.card.o{border-left:6px solid var(--or)}.card.g{border-left:6px solid var(--ok)}.card.r{border-left:6px solid var(--ko)}.card.j{border-left:6px solid var(--ja)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:12px 16px;border:0;border-radius:16px;background:var(--or);color:#1b1206;font:inherit;font-weight:800;font-size:19px;cursor:pointer;text-align:center;margin:0 0 10px;text-decoration:none}
.btn.sec{background:var(--card2);color:#fff;border:2px solid var(--line)}
.btn.ghost{background:transparent;color:var(--soft);border:2px dashed var(--line)}
.btn.red{background:var(--ko);color:#fff}.btn.green{background:var(--ok);color:#06210f}
.btn.small{min-height:46px;font-size:16px;padding:8px 12px;border-radius:13px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.row.tight>*{flex:1 1 90px}
.top{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.top .back{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--card2);border:2px solid var(--line);color:#fff;font-size:24px;cursor:pointer}
.top h1{margin:0;flex:1;min-width:0}
.logo{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.logo img{width:64px;height:64px;border-radius:16px}
.logo b{font-size:30px;letter-spacing:.5px}.logo span{display:block;color:var(--soft);font-size:15px;font-weight:400}
input[type=text],input[type=search],input[type=number],select{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:18px}
input:focus,select:focus{outline:none;border-color:var(--or)}
label.lab{display:block;font-weight:700;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.chip{flex:1 1 130px;min-height:64px;border-radius:16px;border:3px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-weight:800;font-size:19px;cursor:pointer;padding:8px}
.chip small{display:block;font-weight:600;font-size:13px;color:var(--ja)}
.chip.on{border-color:var(--or);background:#3a2a22}
.bar{height:16px;background:#0f1328;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .3s}
.big{font-size:44px;font-weight:900;line-height:1.1}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:800;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.badge.wrap{white-space:normal;display:inline}
select{max-width:100%;text-overflow:ellipsis}
.badge.ok{background:#173a2a;color:#8ff0bd;border-color:#2b6b4c}.badge.wait{background:#3b3216;color:#ffe29a;border-color:#6d5a24}.badge.q{background:#47202a;color:#ffb3bf;border-color:#7a3443}
.list{list-style:none;padding:0;margin:0}
.seg{display:flex;gap:12px;align-items:center;background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px;cursor:pointer;width:100%;color:#fff;font:inherit;text-align:left}
.seg .n{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:#11162c;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--or)}
.seg .t{flex:1;min-width:0}
.seg .t b{display:block;font-size:20px}
.seg img{flex:0 0 auto;width:72px;height:auto;border-radius:8px}
.seg.q{border-color:#7a3443}
.seg.pause{opacity:.6}
.mrc{display:block}
.mrc .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mrc .head h2{flex:1 1 200px;min-width:0}
.tline{margin:10px 0 4px}.tline b{font-size:20px;margin-left:6px}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px;margin:0 0 6px}
.times button{min-width:0;height:46px;border-radius:12px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.vidbox{position:relative;background:#000;border-radius:14px;overflow:hidden;margin:0 0 12px}
.vidbox video,.vidbox canvas{display:block;width:100%;height:auto}
.vidbox canvas.ov{position:absolute;inset:0;width:100%;height:100%}
.pickcv{display:block;width:100%;height:auto;border-radius:14px;background:#000;touch-action:manipulation}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,20,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px 26px}
.thumbs{display:flex;gap:8px;margin:0 0 12px}
.thumbs figure{flex:1;margin:0;min-width:0}
.thumbs img{width:100%;border-radius:10px;display:block;background:#000}
.thumbs figcaption{font-size:13px;color:var(--mute);text-align:center}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 12px}
.stepper button{width:64px;height:64px;border-radius:18px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:30px;font-weight:900;cursor:pointer}
.stepper b{font-size:44px;min-width:90px;text-align:center}
.namegrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.namegrid button{flex:1 1 150px;min-height:50px;border-radius:13px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:6px 8px}
.namegrid button.on{border-color:var(--or)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:min(90vw,360px);text-align:center;background:#fff;color:#151a33;padding:12px 18px;border-radius:14px;font-weight:800;z-index:99;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
/* clavier du code */
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0 22px;min-height:22px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--or)}
.dots i.f{background:var(--or)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
.pad button{height:70px;border-radius:18px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-size:30px;font-weight:800;cursor:pointer}
.pad button.ok{background:var(--or);color:#1b1206;border-color:var(--or)}
/* jeu de danse */
.play{position:fixed;inset:0;background:#0d1124;z-index:40;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.play .ph{display:flex;align-items:center;gap:10px}
.play .ph h3{flex:1;min-width:0;margin:0;color:var(--soft);font-size:17px;line-height:1.3;height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:center}
.play #pnx{min-height:2.7em;line-height:1.3}
.play .ph button{flex:0 0 auto;width:50px;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer}
.play .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:0}
.play .mv{font-size:clamp(38px,12vw,76px);font-weight:900;line-height:1.05;overflow-wrap:normal;word-break:normal;hyphens:none}
.play .cnt{font-size:clamp(70px,26vw,150px);font-weight:900;color:var(--or);line-height:1;font-variant-numeric:tabular-nums}
.play .cnt small{font-size:.42em;color:var(--soft)}
.play .tempo{font-size:22px;color:var(--ja);font-weight:800;min-height:28px}
.play .nx{font-size:20px;color:var(--soft);min-height:30px}
.play .bar{height:20px;margin:6px 0 2px}.play .bar>i{transition:none}.play .pseek{position:relative;padding:14px 0;margin:-8px 0 -10px;touch-action:none;cursor:pointer}.play .pseek .bar{margin:0}.play .pknob{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:4px solid var(--or);box-shadow:0 2px 6px #0008;pointer-events:none}.play .ptime{text-align:center;font-size:15px;color:var(--soft,#aab);margin:0 0 8px;font-variant-numeric:tabular-nums}
.play .ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.play .ctl button{min-height:62px;border-radius:16px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-size:24px;font-weight:800;cursor:pointer}
.play .ctl button.main{background:var(--or);color:#1b1206;border-color:var(--or)}
.play .adj{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.play .adj button{min-height:50px;border-radius:14px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:4px 6px}
.play .adj span{font-size:15px;color:var(--mute);text-align:center;white-space:nowrap}
/* bibliothèque */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
.fold{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:96px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;text-align:left;cursor:pointer}
.fold .fi{font-size:30px;line-height:1}.fold b{font-size:20px;overflow-wrap:anywhere}
/* 🔀 mes mix */
.mixrow{display:flex;gap:8px;align-items:stretch;margin:0 0 10px}
.mixrow .seg{flex:1;min-width:0;margin:0}
.mixrow .ib{flex:0 0 52px;width:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer;padding:0}
.card.lost{opacity:.6;border-style:dashed;background:#191e3a}
details.pk{margin:0 0 8px}
details.pk>summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;margin:0 0 8px}
details.pk>summary::-webkit-details-marker{display:none}
details.pk>summary::before{content:'▸ ';color:var(--or)}
details.pk[open]>summary::before{content:'▾ '}
/* ✍️ mon script */
.wstick{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px 10px;padding:6px 16px 8px;border-bottom:1px solid var(--line)}
.wstick video{display:block;width:100%;max-height:26vh;background:#000;border-radius:12px;object-fit:contain}
.vctl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:6px}
.vctl button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;padding:2px;white-space:nowrap}
.vctl button.main{background:var(--or);border-color:var(--or);color:#1b1206;font-size:20px}
.vctl button.on{border-color:var(--ja);color:var(--ja)}
.vtime{display:flex;align-items:center;gap:10px;margin-top:6px}.vtime b{font-variant-numeric:tabular-nums;min-width:46px}
.vtime input{flex:1;min-width:0;accent-color:var(--or);height:28px}
.wflash{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:900;padding:6px 14px;border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.wflash.go{animation:wfl 1.3s ease-out}
@keyframes wfl{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.mvchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 7px}
.mvchips.small4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mvchips button{min-height:52px;border-radius:16px;border:2px solid var(--or);background:#3a2a22;color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;padding:4px 6px;line-height:1.15;overflow-wrap:normal;word-break:normal;hyphens:manual}
.mvchips.small4 button{border-color:var(--line);background:var(--card2);font-size:14px;min-height:46px}
.mvchips button:active{background:var(--or);color:#1b1206}
.mvchips.small4 button.wide{grid-column:span 4}
.favline{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favhelp{margin:0 0 8px;padding:8px 10px}
.mvchips.favpick button{border-color:var(--line);background:var(--card2);color:var(--soft,#cfd3e6)}
.mvchips.favpick button.fav{border-color:var(--ja);background:#3b3216;color:#fff}
.mvchips.favpick button:active{background:#3b3216;color:#fff}
.mvchips.favpick .st{font-size:17px}
.whead{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 8px}
.whead b{flex:1 1 180px;min-width:0}
.wbtn{width:auto!important;flex:0 0 auto;margin:0!important}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 6px}
.kgrid.k8{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.klab{margin:0 0 3px;font-size:13px;color:var(--mute);font-weight:700}
.wcur{padding:10px 12px}
.kgrid button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;padding:2px;white-space:nowrap}
.kgrid button.on{border-color:var(--or);background:#3a2a22;color:var(--or2)}
.kgrid button.val{color:var(--or);font-size:20px}
.kgrid.ktempo button{font-size:15px;white-space:normal;line-height:1.1;padding:2px 4px}
.kgrid.ktempo button.wide{grid-column:span 2}
.kgrid.ktempo button.note{grid-column:span 4;min-height:42px}
.lx{border:0;background:transparent;color:var(--mute);font-size:16px;cursor:pointer;padding:0 6px}
.lrow{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:0 0 8px;cursor:pointer}
.lrow.on{border-color:var(--or)}.lrow.pick{border-color:var(--ja);background:#3b3216}.lrow.pz{opacity:.8}
.lmain{display:flex;align-items:center;gap:10px}
.lmain .ln{flex:0 0 auto;width:30px;color:var(--or);font-weight:900;text-align:center}
.lmain .lt{flex:1;min-width:0;font-weight:700}
.lmain .ck{flex:0 0 auto;font-size:20px}
.ltime{flex:0 0 auto;min-height:40px;border-radius:10px;border:2px solid var(--line);background:#11162c;color:var(--soft);font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ltools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.ltools button{min-height:44px;border-radius:11px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:2px;white-space:nowrap}
.rlist{margin:0;padding-left:28px}.rlist li{margin:4px 0}.rlist li span:first-child{margin-right:8px}
/* ✍️ mon script en texte libre (01/11) */
.wbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 8px}
.wsaved{font-size:14px;color:var(--mute);min-height:20px;opacity:0;transition:opacity .3s}.wsaved.on{opacity:1}
.wta{display:block;width:100%;min-height:300px;height:46vh;resize:vertical;padding:14px;border-radius:14px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:18px;line-height:1.55;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:break-word}
.wta:focus{outline:none;border-color:var(--or)}
.wta::placeholder{color:var(--mute)}
.sc{font-size:18px;line-height:1.45}
.sc .sblk+.sblk{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.sl{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.sl .sn{flex:0 0 auto;min-width:30px;text-align:right;color:var(--or);font-weight:900;font-variant-numeric:tabular-nums}
.sl .sb{flex:1;min-width:0;overflow-wrap:break-word}
.sl .snm{font-weight:800}
.sl .srep{display:inline-block;padding:0 9px;border-radius:999px;background:#3a2a22;border:1px solid var(--or);color:var(--or2);font-weight:800;font-size:16px;white-space:nowrap}
.sl .stp{color:var(--ja);font-weight:800}
.sl .stx{color:var(--soft)}
.sl .sdot{color:var(--mute)}
.sl.pz{background:#1a2040;border-radius:10px;padding:4px 8px;margin:2px 0;color:var(--mute);font-style:italic}.sl.pz .sn{color:var(--mute)}
.play .main{cursor:pointer}
.play .pnum{font-size:16px;color:var(--mute);min-height:22px;font-weight:700}
.play .mv.long{font-size:clamp(26px,8vw,46px);overflow-wrap:break-word}
.play .mv.pz{color:var(--mute)}
.play .phint{font-size:17px;color:var(--soft);min-height:24px}
/* photo plein écran */
.pv{position:fixed;inset:0;background:#000;z-index:45;display:flex;flex-direction:column}
.pvimg{flex:1;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;min-height:0}
.pvimg img{max-width:100%;max-height:100%;transform-origin:center center;user-select:none;-webkit-user-drag:none}
.pvbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0d1124}
.pvbar button{min-width:56px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer}
.pvbar span{color:var(--soft);min-width:56px;text-align:center}
/* ✍️ mon script ligne par ligne (v10) */
.wrow{display:flex;gap:8px;align-items:stretch;margin:8px 0 0}
.wrow .win{flex:1;min-width:0;display:block;height:50px;min-height:50px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:18px;line-height:22px;resize:none;overflow:hidden;white-space:pre;margin:0}
.wrow .win:focus{outline:none;border-color:var(--or)}
.wrow .win::placeholder{color:var(--mute)}
.wok{font-size:14px;font-weight:800;color:#8ff0bd;height:0;overflow:hidden;opacity:0;transition:opacity .2s;white-space:nowrap}
.wok.on{opacity:1;height:20px;margin-top:4px}
body.wtyping .wok{height:20px;margin-top:4px}
.wrec{margin:4px 12px 10px}.wrec .btn{margin:6px 0 0}
.wrow .wclose{flex:0 0 58px;width:58px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-size:13px;font-weight:700;line-height:1.1;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wrow .wclose span{display:block;white-space:nowrap}
body.wtyping .wrow .wadd{width:46px}
body.wtyping .wrow .win{padding:10px 8px}
.wrow .wadd{flex:0 0 auto;width:52px;border-radius:12px;border:2px solid var(--or);background:#3a2a22;color:#fff;font-size:22px;cursor:pointer;padding:0}
.wmode{display:flex;align-items:center;gap:8px;margin:6px 0 0;min-height:36px}
.wmode .wmt{flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--ja);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmode button{flex:0 0 auto;min-height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:2px 10px;white-space:nowrap}
.wmode .wcan{border-color:var(--ja)}
.wlist{max-height:46vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:#11162c;border:2px solid var(--line);border-radius:14px;padding:4px 0;margin:0 0 12px;-webkit-overflow-scrolling:touch}
.wempty{margin:10px 14px}
.wl{display:flex;gap:8px;align-items:baseline;padding:7px 12px;font-size:18px;line-height:1.35;cursor:pointer;border-bottom:1px solid #1d2448}
.wl:last-child{border-bottom:0}
.wl .wn{flex:0 0 auto;min-width:30px;text-align:right;color:var(--or);font-weight:900;font-variant-numeric:tabular-nums}
.wl .wt{flex:1;min-width:0;overflow-wrap:break-word}
.wl.wpz .wt{color:var(--mute);font-style:italic}
.wl.wsep{padding:12px 12px;align-items:center}
.wl .whr{display:block;flex:1;height:0;border-top:2px dashed var(--mute)}
.wl.on{background:#252d56}
.wl.ed{background:#3b3216}.wl.ed .wt{color:var(--ja)}
.wl.ins{box-shadow:inset 0 3px 0 var(--ja)}
.wmenu{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 10px;background:#252d56;border-bottom:1px solid var(--line)}
.wmenu button{flex:1 1 60px;min-height:44px;border-radius:11px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:2px 6px;white-space:nowrap}
.wmenu button.w2{flex:1 1 130px}
.wmenu button.red{background:var(--ko);border-color:var(--ko);flex:1 1 150px}
.wmenu button:disabled{opacity:.35}
.wmenu .wq{flex:1 1 100%;font-weight:800;color:#ffb3bf}
body.wtyping{overflow:hidden}
body.wtyping .top,body.wtyping #wfoot{display:none}
body.wtyping .wpane{position:fixed;left:0;right:0;top:0;height:100vh;margin:0 auto;max-width:640px;display:flex;flex-direction:column;z-index:30;background:var(--bg);padding:0 16px 4px;overflow:hidden}
/* v11 : clavier ouvert = seulement la vidéo (grande), ses boutons, la barre de temps et la case, collée au-dessus du clavier */
body.wtyping .wstick{position:static;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:0 -16px;padding:6px 16px 4px;border-bottom:0}
body.wtyping .wstick video{flex:1 1 0;height:0;min-height:60px;width:100%;max-height:none;object-fit:contain}
body.wtyping .wstick>.card{flex:1 1 auto}
body.wtyping #wbody{display:none}
/* 📄 mon livret (v12) */
.lvcard .row.tight>*{flex:1 1 120px}
.lvset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.lvset .lvl{font-weight:700;font-size:16px;white-space:nowrap}
.lvset button{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-size:24px;font-weight:900;cursor:pointer;padding:0}
.lvset .lvnum{min-width:38px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.lvset .lvnum.auto{color:var(--mute);font-style:italic}
.lvset .lvhint{font-size:14px}
.lvq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#3b3216;border:1px solid #6d5a24;border-radius:12px;padding:8px 10px;margin:0 0 10px}
.lvq span{flex:1 1 100%;font-weight:700;color:#ffe29a;font-size:16px}
.lvq button{flex:1 1 80px;min-height:44px;border-radius:11px;border:2px solid var(--line);background:#11162c;color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.lvq button:first-of-type{background:var(--or);border-color:var(--or);color:#1b1206}
.lvbadge{display:block;margin-top:4px}
.lv{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.lvtop{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0d1124}
.lvtop b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.lvtop button{flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer}
.lvst{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.lvpg{flex:0 0 auto;transform-origin:center center;background:#fff;will-change:transform}
.lvpg canvas{display:block}
.lvmsg{position:absolute;left:16px;right:16px;top:40%;text-align:center;color:var(--soft);margin:0;pointer-events:none}
.lvbar{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#0d1124}
.lvbar button{flex:0 0 auto;width:72px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer}
.lvbar button:disabled{opacity:.35}
.lvbar span{flex:0 1 auto;min-width:120px;text-align:center;color:#fff;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hide{display:none!important}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.toast,.sheet-bg,.play,#pcrx{display:none!important}
  #print{display:block;font-family:Georgia,serif;color:#000;padding:0 8mm}
  #print h1{font-size:22pt;margin:0 0 4pt}#print .sub{color:#444;margin:0 0 14pt}
  #print h2{font-size:15pt;margin:14pt 0 4pt;border-bottom:1.5pt solid #ff8a3d;padding-bottom:2pt;break-after:avoid}
  #print ol{margin:0 0 6pt 0;padding-left:22pt;font-size:13pt;line-height:1.5}
  #print li{break-inside:avoid}
  #print .t{color:#666;font-size:10pt}
  #print section{break-inside:avoid}
  #print .sc{font-size:13pt;line-height:1.45}
  #print .sblk+.sblk{border-top:1pt dashed #bbb;margin-top:6pt;padding-top:6pt}
  #print .sl{display:flex;gap:6pt;align-items:baseline;padding:1.5pt 0;break-inside:avoid}
  #print .sl .sn{min-width:20pt;text-align:right;color:#c25400;font-weight:700}
  #print .sl .sb{flex:1}
  #print .snm{font-weight:700}
  #print .srep{background:#fff1e6;border:1pt solid #e07a2e;border-radius:9pt;padding:0 5pt;color:#8a3d00;font-weight:700;font-size:12pt;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .stp{color:#a35a00;font-weight:700}
  #print .stx,#print .sdot{color:#555}
  #print .sl.pz{color:#666;font-style:italic;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:1.5pt 4pt}
  #print .sl.pz .sn{color:#666}
}
</style>
</head>

<div id="app"><p class="soft" style="margin-top:40px;text-align:center">Chargement…</p></div>
<div id="print"></div>
<script src="core.js?v=22"></script>
<script src="mp4.js?v=22"></script>
<script src="pc-commun.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
